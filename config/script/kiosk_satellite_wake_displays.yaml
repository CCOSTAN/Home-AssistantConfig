# -------------------------------------------------------------------
# Native Kiosk Satellite Fleet - Shared device policy
#  Enrolled device identity and route come from kiosk_health satellite_devices.
# -------------------------------------------------------------------
# Notes: Existing Kitchen script and automation identities remain compatible.
######################################################################

kiosk_satellite_wake_displays:
  alias: "Kiosk Satellite - Wake Displays"
  mode: restart
  sequence:
    - repeat:
        for_each: >-
          {% from 'kiosk_health.jinja' import satellite_devices %}
          {{ satellite_devices() | from_json }}
        sequence:
          - if:
              - condition: template
                value_template: "{{ is_state('binary_sensor.' ~ repeat.item.node ~ '_connectivity' ~ repeat.item.suffix, 'on') }}"
            then:
              - service: light.turn_on
                continue_on_error: true
                target:
                  entity_id: "{{ 'light.' ~ repeat.item.node ~ '_screen' ~ repeat.item.suffix }}"
              - service: button.press
                continue_on_error: true
                target:
                  entity_id:
                    - "{{ 'button.' ~ repeat.item.node ~ '_postpone_screensaver' ~ repeat.item.suffix }}"
                    - "{{ 'button.' ~ repeat.item.node ~ '_bring_to_front' ~ repeat.item.suffix }}"
