# -------------------------------------------------------------------
# HVAC Control - Shared thermostat target and safety reconciliation
#  Retains the upstairs policy and delegates downstairs to its own controller.
# -------------------------------------------------------------------
######################################################################

set_downstairs_target_temp_based_on_conditions:
  alias: Set Downstairs Target Temperature Based on Conditions
  mode: restart
  sequence:
    - action: script.reconcile_downstairs_hvac

reconcile_hvac_state:
  alias: Reconcile HVAC State
  mode: restart
  sequence:
    - variables:
        reconcile_reason: "{{ reason | default('state change', true) }}"
    # Downstairs cloud command verification must not delay upstairs safety.
    - action: script.turn_on
      target:
        entity_id: script.reconcile_downstairs_hvac
    # A group can appear after presence during startup; never treat missing as closed.
    # Grid-off must still bypass this wait so the safety shutoff is immediate.
    - wait_template: >-
        {{ states('group.entry_points') in ['on', 'off']
           or is_state('binary_sensor.powerwall_grid_status', 'off') }}
    - choose:
        - conditions:
            - condition: state
              entity_id: binary_sensor.powerwall_grid_status
              state: 'off'
          sequence:
            - service: climate.turn_off
              target:
                entity_id:
                  - climate.upstairs
            - service: script.send_to_logbook
              data:
                topic: "CLIMATE"
                message: "HVAC kept off because the grid is down ({{ reconcile_reason }})."
        - conditions:
            - condition: state
              entity_id: group.entry_points
              state: 'on'
          sequence:
            - service: climate.turn_off
              target:
                entity_id:
                  - climate.upstairs
            - service: script.send_to_logbook
              data:
                topic: "CLIMATE"
                message: "HVAC kept off because an entry point is open ({{ reconcile_reason }})."
        - conditions:
            - condition: state
              entity_id: group.family
              state: 'not_home'
            - condition: state
              entity_id: input_boolean.guest_mode
              state: 'off'
          sequence:
            - condition: state
              entity_id: group.entry_points
              state: 'off'
            - service: climate.set_hvac_mode
              target:
                entity_id: climate.upstairs
              data:
                hvac_mode: cool
            - service: climate.set_temperature
              target:
                entity_id: climate.upstairs
              data:
                temperature: 83
            - service: script.send_to_logbook
              data:
                topic: "CLIMATE"
                message: "HVAC reconciled to away targets ({{ reconcile_reason }})."
      default:
        - condition: state
          entity_id: group.entry_points
          state: 'off'
        - service: climate.set_hvac_mode
          target:
            entity_id: climate.upstairs
          data:
            hvac_mode: cool
        - service: climate.set_temperature
          target:
            entity_id: climate.upstairs
          data:
            temperature: 82
        - service: script.send_to_logbook
          data:
            topic: "CLIMATE"
            message: "HVAC reconciled to occupied targets ({{ reconcile_reason }})."
