######################################################################
# @CCOSTAN - Follow Me on X
# For more info visit https://www.vcloudinfo.com/click-here
# Original Repo : https://github.com/CCOSTAN/Home-AssistantConfig
# -------------------------------------------------------------------
# Recorder Configuration - database retention and exclusions
#  Stores HA history while purging noise and controlling DB size.
# -------------------------------------------------------------------
# Notes: Keeps 180 days (1/2 year); excludes vcloudinfo pings, noisy connectivity telemetry, countdown-style alarm helpers, low-value script/button/scene history, MariaDB snapshot helpers, raw Docker/Proxmox/Glances host telemetry including dynamic Docker veth sensors, PoE live power, and other high-churn entities; MariaDB via recorder_db_url.
# Notes: L10s status/room telemetry is live-only; keep curated VACUUM logbook entries plus error/run context instead.
# Notes: Tesla Fleet Spaceship telemetry is live-only in HA; TeslaMate is the historical car database.
# Notes: Life360 trackers are explicitly included for map/history queries despite the broad device_tracker exclusion.
# Notes: Raw Portainer container/stack status telemetry is live-only; keep Docker aggregate outage sensors, Repairs, and curated logbook events instead.
# Notes: Mobile app phone telemetry is live-only; Life360 keeps location history and notify services remain available.
# Notes: Rolling maintenance days-since sensors are live-only; durable interval/count/total sensors carry the history.
# Notes: TP-Link lamp voltage diagnostics are live-only; useful energy/power sensors stay recorded.
######################################################################
db_url: !secret recorder_db_url
purge_keep_days: 180
auto_purge: true
commit_interval: 30
include:
  entities:
    - device_tracker.life360_adriano_costanzo
    - device_tracker.life360_amanda_desantis
