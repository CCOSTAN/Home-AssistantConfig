            }
            if (s === 'on' || s === 'running') return 'rgba(46,125,50,0.12)';
            if (s === 'off' || s === 'stopped' || s === 'exited' || s === 'dead') return 'rgba(198,40,40,0.10)';
            return 'rgba(230,81,0,0.12)';
          ]]]
      - color: >
