      const okState = String(variables?.ok_state ?? 'off').toLowerCase();
      if (unavailable) return 'NO DATA';
      if (raw === okState) return variables?.healthy_text ?? 'HEALTHY';
      if (variables?.alert_text) return variables.alert_text;
      if (variables?.raw_suffix) return `${entity.state} ${variables.raw_suffix}`;
