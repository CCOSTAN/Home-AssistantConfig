# -------------------------------------------------------------------
# Home Assistant power resilience dry run
# -------------------------------------------------------------------
- type: grid
  column_span: 4
  columns: 1
  square: false
  cards:
  - type: custom:layout-card
    grid_options:
      columns: full
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(1, minmax(0, 1fr))
      grid-auto-flow: row
      grid-auto-rows: min-content
      grid-gap: 12px
      margin: 0
    cards:
    - type: custom:vertical-stack-in-card
      card_mod:
        style: !include /config/dashboards/infrastructure/card_mod/infra_panel.yaml
      cards:
      - type: custom:button-card
        template: bearstone_infra_panel_header_icon
        name: Power Resilience - Home Assistant
        icon: mdi:home-assistant

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: sensor.power_resilience_recommended_stage
        name: Recommended Stage
        icon: mdi:signal
        state_display: >
          [[[ return String(entity?.state ?? 'NO DATA').replaceAll('_', ' '); ]]]

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: sensor.power_resilience_recommended_stage
        name: Control Owner
        icon: mdi:brain
        state_display: >
          [[[
            const owner = String(entity?.attributes?.control_owner ?? 'NO DATA');
            const mode = String(entity?.attributes?.execution_mode ?? 'NO DATA');
            return `${owner.toUpperCase()} / ${mode.replaceAll('_', ' ').toUpperCase()}`;
          ]]]

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: sensor.power_resilience_recommended_stage
        name: Safety State
        icon: mdi:shield-lock-outline
        state_display: >
          [[[ return entity?.attributes?.actions_armed === true ? 'ACTIONS ARMED' : 'NO SHUTDOWN ACTIONS'; ]]]

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: sensor.power_resilience_recommended_stage
        name: Powerwall Inputs
        icon: mdi:home-battery-outline
        state_display: >
          [[[
            const grid = String(entity?.attributes?.grid_status ?? 'NO DATA').toUpperCase();
            const charge = Number(entity?.attributes?.powerwall_charge);
            return Number.isFinite(charge) ? `GRID ${grid} / ${charge.toFixed(0)}%` : `GRID ${grid} / NO DATA`;
          ]]]

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: sensor.power_resilience_recommended_stage
        name: Outage Elapsed
        icon: mdi:timer-sand
        state_display: >
          [[[
            const seconds = Number(entity?.attributes?.outage_elapsed_seconds);
            if (!Number.isFinite(seconds)) return 'NO DATA';
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            return hours > 0 ? `${hours}h ${minutes}m` : `${minutes}m`;
          ]]]
