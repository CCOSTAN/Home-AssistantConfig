# -------------------------------------------------------------------
# Infrastructure Partial - UPS Power
# Related Issue: 1936
#  Garage and both Office NUT devices with current readings and trends.
# -------------------------------------------------------------------
# Notes: Raw NUT status data drives the shared on-battery rollup.
# Notes: All graphs use 24-hour windows and explicit threshold colors.
######################################################################

# -------------------------------------------------------------------
# Current UPS health (mandatory first full-width wrapper)
# -------------------------------------------------------------------
- type: grid
  column_span: 4
  columns: 1
  square: false
  cards:
  - type: custom:layout-card
    grid_options:
      columns: full
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(4, minmax(0, 1fr))
      grid-auto-flow: row
      grid-auto-rows: min-content
      grid-gap: 12px
      margin: 0
      mediaquery:
        "(max-width: 900px)":
          grid-template-columns: repeat(2, minmax(0, 1fr))
    cards:
    - type: custom:button-card
      template: bearstone_nav_back
      name: Back to Systems
      icon: mdi:arrow-left
      view_layout:
        grid-column: 1 / -1
      tap_action:
        action: navigate
        navigation_path: /dashboard-infrastructure/home

    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: sensor.garage_ups_status
      name: Garage UPS
      icon: mdi:garage-variant
      variables:
        ok_state: Online
        healthy_text: ONLINE
        alert_text: CHECK

    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: sensor.office_ups_eaton_550_status
      name: Office Eaton 3S 550
      icon: mdi:desk
      variables:
        ok_state: Online
        healthy_text: ONLINE
        alert_text: CHECK

    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: sensor.office_ups_cyberpower_status
      name: Office CyberPower ST Series
      icon: mdi:battery-heart-variant
      variables:
        ok_state: Online
        healthy_text: ONLINE
        alert_text: CHECK

    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: binary_sensor.infra_ups_on_battery
      name: Utility State
      icon: mdi:transmission-tower
      variables:
        ok_state: 'off'
        healthy_text: UTILITY POWER
        alert_text: ON BATTERY

# -------------------------------------------------------------------
# Current readings
# -------------------------------------------------------------------
- type: grid
  column_span: 4
  columns: 1
  square: false
  cards:
  - type: custom:layout-card
    grid_options:
      columns: full
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(3, minmax(0, 1fr))
      grid-auto-flow: row
      grid-auto-rows: min-content
      grid-gap: 12px
      margin: 0
      mediaquery:
        "(max-width: 900px)":
          grid-template-columns: repeat(1, minmax(0, 1fr))
    cards:
    - type: custom:vertical-stack-in-card
      card_mod:
        style: !include /config/dashboards/infrastructure/card_mod/infra_panel.yaml
      cards:
      - type: custom:button-card
        template: bearstone_infra_panel_header_icon
        name: Garage UPS
        icon: mdi:garage-variant

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: sensor.garage_ups_status
        name: Status
        icon: mdi:battery-heart-variant
        state_display: >
          [[[ return String(entity?.state ?? 'NO DATA').toUpperCase(); ]]]

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: sensor.garage_ups_battery_charge
        name: Battery
        icon: mdi:battery-high
        state_display: >
          [[[
            const value = Number(entity?.state);
            return Number.isFinite(value) ? `${value.toFixed(0)}%` : 'NO DATA';
          ]]]

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: sensor.garage_ups_battery_runtime
        name: Runtime
        icon: mdi:timer-outline
        state_display: >
          [[[
            const seconds = Number(entity?.state);
            if (!Number.isFinite(seconds)) return 'NO DATA';
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            return hours > 0 ? `${hours}h ${minutes}m` : `${minutes}m`;
          ]]]

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: sensor.garage_ups_load
        name: Load
        icon: mdi:gauge
        state_display: >
          [[[
            const value = Number(entity?.state);
            return Number.isFinite(value) ? `${value.toFixed(0)}%` : 'NO DATA';
          ]]]

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: sensor.garage_ups_input_voltage
