# -------------------------------------------------------------------
# Systems Partial - Water
#  Protection, live use, hot water, salt, outdoor water, and trends.
# -------------------------------------------------------------------
# Related Issue: 1890, 1817
# Notes: NAS, NVR, and unrelated house-temperature cards are omitted; refrigerator temperature stays with home safety.
# Notes: HVAC maintenance has moved to the dedicated production HVAC view.
# Notes: Active Phyn leak alerts are shown; the integration's stale latest-test leak flag is not an operator alert.
# Notes: Rheem alert, health, and telemetry faults render as an exception row backed by durable Repairs.
# Notes: Daily usage uses change on the same sum-only statistic configured in Energy.
# Notes: The overview ribbon keeps water-softener salt maintenance visible and amber when due.
# Notes: Refrigerator temperature remains a temporary Home Safety overview item until a better permanent view is chosen.
######################################################################

# -------------------------------------------------------------------
# Water overview ribbon (mandatory first full-width wrapper)
# -------------------------------------------------------------------
- type: grid
  column_span: 4
  columns: 1
  square: false
  cards:
  - type: custom:layout-card
    grid_options:
      columns: full
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(7, minmax(0, 1fr))
      grid-auto-flow: row
      grid-auto-rows: min-content
      grid-gap: 12px
      margin: 0
      mediaquery:
        "(max-width: 900px)":
          grid-template-columns: repeat(2, minmax(0, 1fr))
    cards:
    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: sensor.water_softener_salt_days_since_last_add
      name: Salt Maintenance
      icon: mdi:shaker-outline
      variables:
        default_severity: healthy
        numeric_warning_checks:
        - entity_id: sensor.water_softener_salt_days_since_last_add
          threshold_entity_id: sensor.water_softener_salt_average_days_between_refills
      state_display: >
        [[[
          const current = Number(entity?.state);
          const limit = Number(states['sensor.water_softener_salt_average_days_between_refills']?.state);
          if (!Number.isFinite(current) || !Number.isFinite(limit) || limit <= 0) return 'NO DATA';
          const remaining = Math.ceil(limit - current);
          return remaining <= 0 ? 'DUE · SALT' : `${remaining}D LEFT`;
        ]]]
      tap_action:
        action: more-info

    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: valve.phyn_shutoff_valve
      name: Water Protection
      icon: mdi:valve
      variables:
        ok_state: open
        healthy_text: OPEN
        alert_text: CLOSED
      tap_action:
        action: more-info

    - type: custom:button-card
      template: bearstone_infra_kpi
      entity: sensor.rachio_controller_status
      name: Sprinklers
      icon: mdi:sprinkler-variant
      state_display: >
        [[[
          const status = String(entity?.state ?? '').toLowerCase();
          if (status === 'watering') {
            const zones = String(entity?.attributes?.active_zones ?? '').trim();
            return zones ? `RUNNING · ${zones.toUpperCase()}` : 'RUNNING';
          }
          if (status === 'rain_delay') return 'RAIN DELAY';
          if (status === 'standby') return 'STANDBY';
          if (['unknown', 'unavailable', 'none', ''].includes(status)) return 'OFFLINE';
          return 'READY';
        ]]]
      tap_action:
        action: navigate
        navigation_path: /dashboard-infrastructure/sprinklers

    - type: custom:button-card
      template: bearstone_infra_kpi
      entity: sensor.blink_blink1_temperature
      name: Refrigerator
      icon: mdi:fridge-outline

    - type: custom:button-card
      template: bearstone_infra_kpi
      entity: sensor.rheem_wh_available_hot_water
      name: Hot Water
      icon: mdi:water-thermometer

    - type: custom:button-card
      template: bearstone_infra_kpi
      entity: sensor.phyn_daily_water_usage
      name: Used Today
      icon: mdi:water-outline

    - type: custom:button-card
      template: bearstone_infra_kpi
      entity: input_datetime.water_delivery_date
      name: Next Delivery
      icon: mdi:truck-delivery-outline
      state_display: >
        [[[
          const raw = String(entity?.state ?? '');
          const value = raw ? new Date(`${raw}T00:00:00`) : null;
          if (!(value instanceof Date) || Number.isNaN(value.getTime())) return 'NO DATE';
          const today = new Date();
          today.setHours(0, 0, 0, 0);
          const formatted = value.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }).toUpperCase();
          return value < today ? `OVERDUE · ${formatted}` : formatted;
        ]]]
      tap_action:
        action: url
        url_path: https://www.readyrefresh.com/en/login

# -------------------------------------------------------------------
# Home safety and outdoor water
# -------------------------------------------------------------------
- type: grid
  column_span: 4
  columns: 1
  square: false
  cards:
  - type: custom:layout-card
    grid_options:
      columns: full
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(3, minmax(0, 1fr))
      grid-auto-flow: row
      grid-auto-rows: min-content
      grid-gap: 12px
      margin: 0
      mediaquery:
        "(max-width: 900px)":
          grid-template-columns: repeat(1, minmax(0, 1fr))
    cards:
    - type: custom:vertical-stack-in-card
      card_mod:
        style: !include /config/dashboards/infrastructure/card_mod/infra_panel.yaml
      cards:
      - type: custom:button-card
        template: bearstone_infra_panel_header
        name: Home Safety

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: sensor.blink_blink1_temperature
        name: Refrigerator Temperature
        icon: mdi:fridge-outline
        state:
        - operator: '>'
          value: 60
          styles:
            card:
            - border-color: rgba(229,57,53,0.35)
            - background: rgba(255,235,238,0.85)
            icon:
            - color: rgba(198,40,40,1)
            state:
            - color: rgba(198,40,40,1)
            - opacity: 1

    - type: custom:vertical-stack-in-card
      card_mod:
        style: !include /config/dashboards/infrastructure/card_mod/infra_panel.yaml
      cards:
      - type: custom:button-card
        template: bearstone_infra_panel_header
        name: Water Delivery & Softener

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: sensor.water_softener_salt_last_summary
        name: Last Salt Refill
        icon: mdi:shaker

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: sensor.water_softener_salt_average_days_between_refills
        name: Typical Salt Interval
        icon: mdi:calendar-sync-outline
        tap_action:
          action: navigate
          navigation_path: /dashboard-infrastructure/salt-trends

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: input_datetime.water_delivery_date
        name: Next Water Delivery
        icon: mdi:truck-delivery-outline
        state_display: >
          [[[
            const raw = String(entity?.state ?? '');
            const value = raw ? new Date(`${raw}T00:00:00`) : null;
            if (!(value instanceof Date) || Number.isNaN(value.getTime())) return 'NO DATE';
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const formatted = value.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }).toUpperCase();
            return value < today ? `OVERDUE · ${formatted}` : formatted;
          ]]]

      - type: custom:button-card
        template: bearstone_infra_list_row
        name: Manage ReadyRefresh
        icon: mdi:open-in-new
        show_state: false
        tap_action:
          action: url
          url_path: https://www.readyrefresh.com/en/login

    - type: custom:vertical-stack-in-card
      card_mod:
        style: !include /config/dashboards/infrastructure/card_mod/infra_panel.yaml
      cards:
      - type: custom:button-card
        template: bearstone_infra_panel_header
        name: Outdoor Water

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: sensor.rachio_controller_status
        name: Sprinkler Controller
        icon: mdi:sprinkler-variant
        tap_action:
          action: navigate
          navigation_path: /dashboard-infrastructure/sprinklers

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: sensor.rachio_active_zone
        name: Active Zone
        icon: mdi:sprinkler

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: switch.carlo_rachio_rain_delay
        name: Rain Delay
        icon: mdi:weather-rainy
        tap_action:
          action: more-info

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: sensor.rachio_last_run_summary
        name: Last Sprinkler Run
        icon: mdi:history

# -------------------------------------------------------------------
# Water protection and hot water
# -------------------------------------------------------------------
- type: grid
  column_span: 4
  columns: 1
  square: false
  cards:
  - type: custom:layout-card
    grid_options:
      columns: full
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(2, minmax(0, 1fr))
      grid-auto-flow: row
      grid-auto-rows: min-content
      grid-gap: 12px
      margin: 0
      mediaquery:
        "(max-width: 900px)":
          grid-template-columns: repeat(1, minmax(0, 1fr))
    cards:
    - type: custom:vertical-stack-in-card
      card_mod:
        style: !include /config/dashboards/infrastructure/card_mod/infra_panel.yaml
      cards:
      - type: custom:button-card
        template: bearstone_infra_panel_header
        name: Water Protection

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: valve.phyn_shutoff_valve
        name: Main Shutoff Valve
        icon: mdi:valve

      - type: custom:button-card
        template: bearstone_infra_list_row_running
        entity: switch.phyn_autoshutoff_enabled
        name: Automatic Shutoff
        icon: mdi:shield-water-outline
        tap_action:
          action: more-info

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: switch.phyn_scheduled_leak_test_enabled
        name: Scheduled Leak Tests
        icon: mdi:calendar-search
        state_display: >
          [[[
            return entity?.state === 'on' ? 'ENABLED' : 'OFF';
          ]]]
        tap_action:
          action: more-info

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: binary_sensor.phyn_leak_test_running
        name: Leak Test Activity
        icon: mdi:water-search
        state_display: >
          [[[
            return entity?.state === 'on' ? 'RUNNING' : 'IDLE';
          ]]]

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: sensor.phyn_average_water_flow_rate
        name: Current Flow Rate
        icon: mdi:water-pump

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: sensor.phyn_current_water_pressure
        name: Water Pressure
        icon: mdi:gauge

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: sensor.phyn_average_water_temperature
        name: Supply Temperature
        icon: mdi:thermometer-water

    - type: custom:vertical-stack-in-card
      card_mod:
        style: !include /config/dashboards/infrastructure/card_mod/infra_panel.yaml
      cards:
      - type: custom:button-card
        template: bearstone_infra_panel_header
        name: Hot Water System

      - type: custom:button-card
        template: bearstone_infra_alert_row
        entity: binary_sensor.rheem_wh_problem
        name: Rheem Needs Attention
        icon: mdi:water-boiler-alert
        variables:
          alert_kind: binary_on
          critical_entity_ids:
          - binary_sensor.rheem_wh_active_alert
          warning_entity_ids:
          - binary_sensor.rheem_wh_telemetry_stale
          exception_detail: >
            [[[
              const status = states['sensor.rheem_wh_diagnostic_status']?.state ?? 'unknown';
              const count = states['sensor.rheem_wh_alert_count']?.state ?? 'unknown';
              return `Status: ${String(status).replaceAll('_', ' ')} · Active alerts: ${count}`;
            ]]]

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: sensor.rheem_wh_diagnostic_status
        name: Diagnostic Status
        icon: mdi:stethoscope

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: sensor.rheem_wh_available_hot_water
        name: Available Hot Water
        icon: mdi:water-percent

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: binary_sensor.rheem_wh_running
        name: Heat Pump
        icon: mdi:heat-pump-outline
        state_display: >
          [[[
            return entity?.state === 'on' ? 'RUNNING' : 'IDLE';
          ]]]

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: sensor.rheem_wh_running_state
        name: Operating State
        icon: mdi:state-machine

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: sensor.rheem_wh_tank_health
        name: Tank Health
        icon: mdi:shield-check-outline

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: sensor.rheem_wh_alert_count
        name: Active Alerts
        icon: mdi:alert-circle-outline

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: sensor.rheem_wh_last_alert_snapshot
        name: Last New Alert
        icon: mdi:alert-decagram-outline

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: water_heater.rheem_wh
        name: Water Heater Controls
        icon: mdi:water-boiler

# -------------------------------------------------------------------
# Thirty-day water trends
# -------------------------------------------------------------------
- type: grid
  column_span: 4
  columns: 1
  square: false
  cards:
  - type: custom:layout-card
    grid_options:
      columns: full
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(2, minmax(0, 1fr))
      grid-auto-flow: row
      grid-auto-rows: min-content
      grid-gap: 12px
      margin: 0
      mediaquery:
        "(max-width: 900px)":
          grid-template-columns: repeat(1, minmax(0, 1fr))
    cards:
    - type: custom:vertical-stack-in-card
      card_mod:
        style: !include /config/dashboards/infrastructure/card_mod/infra_panel.yaml
      cards:
      - type: custom:button-card
        template: bearstone_infra_panel_header
        name: Daily Water Use - 30 Days

      # Fallback card: change uses the same sum-only long-term statistic as Energy.
      - type: statistics-graph
        chart_type: bar
        days_to_show: 30
        period: day
        stat_types:
        - change
        entities:
        - entity: sensor.phyn_daily_water_usage
          name: Daily Usage

    - type: custom:vertical-stack-in-card
      card_mod:
        style: !include /config/dashboards/infrastructure/card_mod/infra_panel.yaml
      cards:
      - type: custom:button-card
        template: bearstone_infra_panel_header
        name: Lowest Hot Water - 30 Days

      # Fallback card: daily minimum shows whether household demand is outrunning recovery.
      - type: statistics-graph
        chart_type: line
        days_to_show: 30
        period: day
        stat_types:
        - min
        entities:
        - entity: sensor.rheem_wh_available_hot_water
          name: Available Hot Water
