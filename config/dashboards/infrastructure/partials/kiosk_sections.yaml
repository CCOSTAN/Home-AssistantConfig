# Infrastructure Partial - kiosks
# Related Issue: 2030
#  Exception-first health, device telemetry, and live dashboard previews.
# -------------------------------------------------------------------
# Notes: Included by config/dashboards/infrastructure/views/05z_kiosks.yaml.
# Notes: Living Room TV is an on-demand kiosk, outside fleet health checks.
# Notes: Raven app status replaces the retired Samsung Haven browser preview.
# Notes: Kitchen Show power uses its charging sensor; battery telemetry is absent.
######################################################################

# -------------------------------------------------------------------
# Device health strip
# -------------------------------------------------------------------
- type: grid
  column_span: 4
  columns: 1
  square: false
  cards:
  - type: custom:layout-card
    grid_options:
      columns: full
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(5, minmax(0, 1fr))
      grid-auto-flow: row
      grid-auto-rows: min-content
      grid-gap: 12px
      margin: 0
      mediaquery:
        "(max-width: 900px)":
          grid-template-columns: repeat(1, minmax(0, 1fr))
    cards:
    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: binary_sensor.bedroom_kiosk_needs_attention
      name: Bedroom Tablet
      icon: mdi:tablet
      variables:
        ok_state: 'off'
        healthy_text: ONLINE
        alert_text: NEEDS ATTENTION
      state_display: >
        [[[ return String(entity?.attributes?.status ?? entity?.state ?? 'unknown').toUpperCase(); ]]]
      tap_action:
        action: navigate
        navigation_path: /dashboard-bedroom/home

    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: binary_sensor.kitchen_kiosk_needs_attention
      name: Kitchen Show
      icon: mdi:monitor-dashboard
      variables:
        ok_state: 'off'
        critical_entity_ids:
          - binary_sensor.kitchen_kiosk_needs_attention
        warning_entity_ids:
          - update.kitchen_show_update
        healthy_text: ONLINE
        warning_text: UPDATE AVAILABLE
        alert_text: NEEDS ATTENTION
      state_display: >
        [[[
          const updateAvailable = states['update.kitchen_show_update']?.state === 'on';
          if (entity?.state === 'off') return updateAvailable ? 'UPDATE AVAILABLE' : 'ONLINE';
          return String(entity?.attributes?.status ?? entity?.state ?? 'unknown').toUpperCase();
        ]]]
      tap_action:
        action: navigate
        navigation_path: /dashboard-kiosk-satellite-staging/home

    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: binary_sensor.upstairs_kiosk_needs_attention
      name: Upstairs Show
      icon: mdi:monitor-dashboard
      variables:
        ok_state: 'off'
        critical_entity_ids:
          - binary_sensor.upstairs_kiosk_needs_attention
        warning_entity_ids:
          - update.upstairs_show_update
        healthy_text: ONLINE
        warning_text: UPDATE AVAILABLE
        alert_text: NEEDS ATTENTION
      state_display: >
        [[[
          const updateAvailable = states['update.upstairs_show_update']?.state === 'on';
          if (entity?.state === 'off') return updateAvailable ? 'UPDATE AVAILABLE' : 'ONLINE';
          return String(entity?.attributes?.status ?? entity?.state ?? 'unknown').toUpperCase();
        ]]]
      tap_action:
        action: navigate
        navigation_path: /dashboard-kiosk-satellite-staging/echo-show5

    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: binary_sensor.office_kiosk_needs_attention
      name: Office Show
      icon: mdi:monitor-dashboard
      variables:
        ok_state: 'off'
        critical_entity_ids:
          - binary_sensor.office_kiosk_needs_attention
        warning_entity_ids:
          - update.office_show_update
        healthy_text: ONLINE
        warning_text: UPDATE AVAILABLE
        alert_text: NEEDS ATTENTION
      state_display: >
        [[[
          const updateAvailable = states['update.office_show_update']?.state === 'on';
          if (entity?.state === 'off') return updateAvailable ? 'UPDATE AVAILABLE' : 'ONLINE';
          return String(entity?.attributes?.status ?? entity?.state ?? 'unknown').toUpperCase();
        ]]]
      tap_action:
        action: navigate
        navigation_path: /dashboard-kiosk-satellite-staging/echo-show5

    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: sensor.living_room_nest_status
      name: Living Room Nest
      icon: mdi:circle-outline
      variables:
        ok_state: 'online'
        healthy_text: ONLINE
        alert_text: NEEDS ATTENTION
      state_display: >
        [[[ return String(entity?.attributes?.status ?? entity?.state ?? 'unknown').replaceAll('_', ' ').toUpperCase(); ]]]

# -------------------------------------------------------------------
# Screens - device captures and native Roku Raven status
# -------------------------------------------------------------------
- type: grid
  column_span: 4
  columns: 1
  square: false
  cards:
  - type: custom:layout-card
    grid_options:
      columns: full
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(3, minmax(0, 1fr))
      grid-gap: 12px
      margin: 0
      mediaquery:
        "(max-width: 700px)":
          grid-template-columns: minmax(0, 1fr)
        "(max-width: 1200px)":
          grid-template-columns: repeat(2, minmax(0, 1fr))
    cards:
    - camera_view: auto
      type: picture-glance
      title: Bedroom Tablet
      image: https://demo.home-assistant.io/stub_config/kitchen.png
      entities:
      - entity: binary_sensor.bedroom_kiosk_needs_attention
      image_entity: image.alarm_panel_1_screenshot
      tap_action:
        action: navigate
        navigation_path: /dashboard-bedroom/home

    - camera_view: auto
      type: picture-glance
      title: Kitchen Show
      image: https://demo.home-assistant.io/stub_config/kitchen.png
      entities:
      - entity: binary_sensor.kitchen_kiosk_needs_attention
      - entity: sensor.kitchen_show_last_screenshot
      camera_image: camera.kitchen_show_screenshot
      tap_action:
        action: navigate
        navigation_path: /dashboard-kiosk-satellite-staging/home

    - camera_view: auto
      type: picture-glance
      title: Upstairs Show
      image: https://demo.home-assistant.io/stub_config/kitchen.png
      entities:
      - entity: binary_sensor.upstairs_kiosk_needs_attention
      - entity: sensor.upstairs_show_last_screenshot
      camera_image: camera.upstairs_show_screenshot
      tap_action:
        action: navigate
        navigation_path: /dashboard-kiosk-satellite-staging/echo-show5

    - camera_view: auto
      type: picture-glance
      title: Office Show
      image: https://demo.home-assistant.io/stub_config/kitchen.png
      entities:
      - entity: binary_sensor.office_kiosk_needs_attention
      - entity: sensor.office_show_last_screenshot
      camera_image: camera.office_show_screenshot
      tap_action:
        action: navigate
        navigation_path: /dashboard-kiosk-satellite-staging/echo-show5

    - type: custom:button-card
      template: bearstone_infra_round_display
      entity: image.living_room_nest_screen
      name: Living Room Nest
      icon: mdi:circle-outline
      triggers_update:
        - sensor.living_room_nest_status
        - sensor.living_room_nest_last_screenshot
      variables:
        health_entity: sensor.living_room_nest_status
        timestamp_entity: sensor.living_room_nest_last_screenshot
        capture_entity: button.living_room_nest_capture_screen

    - type: custom:vertical-stack-in-card
      card_mod:
        style: !include /config/dashboards/infrastructure/card_mod/infra_panel.yaml
      cards:
      - type: custom:button-card
        template: bearstone_infra_panel_header
        name: Raven - Living Room Roku
        icon: mdi:television
      - type: custom:button-card
        template: bearstone_mobile_control
        entity: sensor.living_room_ultra_active_app_id
        name: Open Raven
        show_entity_picture: true
        entity_picture: /local/custom_ui/floorplan/images/branding/vCloudInfoCircle.png
        triggers_update:
          - media_player.samsung_q70_series_65
        variables:
          status_severity: >
            [[[
              const tv = states['media_player.samsung_q70_series_65']?.state;
              if (tv === 'off') return 'active';
              if (['unknown', 'unavailable', undefined].includes(entity?.state)) return 'warning';
              return tv === 'on' && entity?.state === 'dev' ? 'healthy' : 'active';
            ]]]
        state_display: >
          [[[
            const tv = states['media_player.samsung_q70_series_65']?.state;
            if (tv === 'off') return 'TV OFF';
            if (['unknown', 'unavailable', undefined].includes(entity?.state)) return 'ROKU UNAVAILABLE';
            return entity?.state === 'dev' ? 'RAVEN RUNNING' : 'TAP TO OPEN';
          ]]]
        tap_action:
          action: perform-action
          perform_action: rest_command.samsung_living_room_launch_haven
        hold_action:
          action: navigate
          navigation_path: /dashboard-infrastructure/roku-remote
        double_tap_action:
          action: none
      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: sensor.living_room_ultra_active_app
        name: Current Roku app
        icon: mdi:apps
        triggers_update:
          - sensor.living_room_ultra_active_app_id
        state_display: >
          [[[ return states['sensor.living_room_ultra_active_app_id']?.state === '562859' ? 'Roku Home' : entity?.state ?? 'Unknown'; ]]]
      - type: custom:button-card
        template: bearstone_infra_list_row
        name: Roku Remote
        icon: mdi:remote
        show_state: false
        tap_action:
          action: navigate
          navigation_path: /dashboard-infrastructure/roku-remote

