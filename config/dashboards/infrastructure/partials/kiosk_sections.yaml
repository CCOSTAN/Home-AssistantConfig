        entity: automation.living_room_tv_haven_on_roku_screensaver
        name: Last automatic launch
        icon: mdi:history
        state_display: >
          [[[
            const last = entity?.attributes?.last_triggered;
            if (!last) return 'NOT YET';
            const date = new Date(last);
            return Number.isNaN(date.getTime()) ? 'UNKNOWN' : date.toLocaleString(undefined, {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'});
