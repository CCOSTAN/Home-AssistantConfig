# -------------------------------------------------------------------
# Charging trends
# -------------------------------------------------------------------
- type: grid
  column_span: 4
  columns: 1
  square: false
  cards:
  - type: custom:layout-card
    grid_options:
      columns: full
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: minmax(0, 1fr)
      grid-auto-flow: row
      grid-auto-rows: min-content
      grid-gap: 12px
      margin: 0
    cards:
    - type: custom:vertical-stack-in-card
      card_mod:
        style: !include /config/dashboards/infrastructure/card_mod/infra_panel.yaml
      cards:
      - type: custom:button-card
        template: bearstone_infra_panel_header_icon
        name: Energy Delivered - 30 Days
        icon: mdi:chart-bar

      - type: conditional
        conditions:
        - entity: sensor.juicebox_energy_lifetime
          state_not: unavailable
        card:
          type: statistics-graph
          chart_type: bar
          days_to_show: 30
          period: day
          stat_types:
          - change
          entities:
          - entity: sensor.juicebox_energy_lifetime
            name: JuiceBox Energy

      - type: conditional
        conditions:
        - entity: sensor.juicebox_energy_lifetime
          state: unavailable
        card:
          type: custom:button-card
          template: bearstone_infra_list_row
          entity: sensor.juicebox_status
          name: Energy history starts with first report
          icon: mdi:chart-timeline-variant-shimmer
          state_display: PENDING
