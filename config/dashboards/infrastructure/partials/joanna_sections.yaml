# -------------------------------------------------------------------
# Infrastructure Partial - Joanna
#  Focused dispatch health, latest activity, runtime issues, and memory-system freshness.
# -------------------------------------------------------------------
# Notes: BearClaw Admin provides the detailed runtime drill-down while this page stays summary-focused.
# Notes: This view changes HA presentation only; BearClaw runtime behavior is untouched.
# Notes: Compact scheduled-job health provides an HA-visible failure summary with Admin as the detailed source of truth.
# Notes: BearClaw working memory and the federated OneNote KB are separate indexes and render separately.
######################################################################

# -------------------------------------------------------------------
# Dispatch health strip (mandatory first full-width wrapper)
# -------------------------------------------------------------------
- type: grid
  column_span: 4
  columns: 1
  square: false
  cards:
  - type: custom:layout-card
    grid_options:
      columns: full
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(4, minmax(0, 1fr))
      grid-auto-flow: row
      grid-auto-rows: min-content
      grid-gap: 12px
      margin: 0
      mediaquery:
        "(max-width: 900px)":
          grid-template-columns: repeat(2, minmax(0, 1fr))
    cards:
    - type: custom:button-card
      template: bearstone_infra_kpi
      entity: sensor.joanna_ha_dispatches_24h
      name: HA 24H
      icon: mdi:home-automation

    - type: custom:button-card
      template: bearstone_infra_kpi
      entity: sensor.joanna_all_dispatches_24h
      name: All 24H
      icon: mdi:robot

    - type: custom:button-card
      template: bearstone_infra_kpi
      entity: sensor.joanna_ha_success_rate_24h
      name: HA Success
      icon: mdi:percent-circle
      state_display: '[[[ return `${entity.state}%`; ]]]'

    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: sensor.joanna_ha_errors_24h
      name: HA Errors 24H
      icon: mdi:alert-circle-outline
      variables:
        ok_state: '0'
        healthy_text: NONE
        raw_suffix: ERRORS

# -------------------------------------------------------------------
# Trend, latest activity, and runtime health
# -------------------------------------------------------------------
- type: grid
  column_span: 4
  columns: 3
  square: false
  cards:
  - type: custom:vertical-stack-in-card
    card_mod:
      style: !include /config/dashboards/infrastructure/card_mod/infra_panel.yaml
    cards:
    - type: custom:button-card
      template: bearstone_infra_panel_header
      name: Dispatch Trend

    - type: custom:mini-graph-card
      name: HA Dispatches (24h Rolling)
      icon: mdi:chart-timeline-variant
      hours_to_show: 168
      points_per_hour: 1
      line_width: 2
      smoothing: true
      show:
        legend: false
        labels: false
        name: true
        icon: true
        state: true
      entities:
      - entity: sensor.joanna_ha_dispatches_24h
        name: HA Dispatches
      card_mod:
        style: !include /config/dashboards/infrastructure/card_mod/infra_card.yaml

    - type: custom:button-card
      template: bearstone_infra_list_row
      entity: sensor.joanna_ha_dispatches_7d
      name: HA Dispatches 7D
      icon: mdi:calendar-range

    - type: custom:button-card
      template: bearstone_infra_list_row
      entity: sensor.joanna_ha_dispatches_30d
      name: HA Dispatches 30D
      icon: mdi:calendar-month

  - type: custom:vertical-stack-in-card
    card_mod:
      style: !include /config/dashboards/infrastructure/card_mod/infra_panel.yaml
    cards:
    - type: custom:button-card
      template: bearstone_infra_panel_header
      name: Latest Activity

    - type: custom:button-card
      template: bearstone_infra_list_row
      entity: sensor.bearclaw_status_telemetry
      name: Latest HA Dispatch
      icon: mdi:robot
      state_display: >
        [[[
          const latest = states['sensor.bearclaw_status_telemetry']?.attributes?.dispatchStats?.latest?.haAutomation || {};
          const source = latest.source || 'none';
          const when = latest.dispatchedAt ? String(latest.dispatchedAt).replace('T', ' ').slice(0, 16) : 'n/a';
          return `${source} | ${when}`;
        ]]]

    - type: custom:button-card
      template: bearstone_infra_list_row
      entity: sensor.bearclaw_status_telemetry
      name: Latest HA Completion
      icon: mdi:check-circle-outline
      state_display: >
        [[[
          const latest = states['sensor.bearclaw_status_telemetry']?.attributes?.dispatchStats?.latest?.haAutomation || {};
          const state = latest.state || 'none';
          const when = latest.completedAt ? String(latest.completedAt).replace('T', ' ').slice(0, 16) : 'n/a';
          return `${state} | ${when}`;
        ]]]

    - type: custom:button-card
      template: bearstone_infra_list_row
      entity: sensor.joanna_all_dispatches_7d
      name: All Dispatches 7D
      icon: mdi:calendar-range

    - type: custom:button-card
      template: bearstone_infra_list_row
      entity: sensor.joanna_all_dispatches_30d
      name: All Dispatches 30D
      icon: mdi:calendar-month

  - type: custom:vertical-stack-in-card
    card_mod:
      style: !include /config/dashboards/infrastructure/card_mod/infra_panel.yaml
    cards:
    - type: custom:button-card
      template: bearstone_infra_panel_header
      name: Runtime & Memory

    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: sensor.bearclaw_scheduled_job_health
      name: Scheduled Jobs
      icon: mdi:calendar-alert
      variables:
        ok_state: ok
        warning_state: warning
        healthy_text: HEALTHY
        warning_text: JOB WARNING
        critical_text: JOB ERROR
      state_display: >
        [[[
          if (entity?.state === 'ok') return 'HEALTHY';
          const errors = Number.parseInt(entity?.attributes?.error_count ?? '0', 10);
          const warnings = Number.parseInt(entity?.attributes?.warning_count ?? '0', 10);
          const parts = [];
          if (Number.isFinite(errors) && errors > 0) parts.push(`${errors} ERROR${errors === 1 ? '' : 'S'}`);
          if (Number.isFinite(warnings) && warnings > 0) parts.push(`${warnings} WARN`);
          return parts.join(' · ') || 'STATUS UNKNOWN';
        ]]]

    - type: custom:button-card
      template: bearstone_infra_alert_row
      entity: sensor.bearclaw_scheduled_job_health
      name: >
        [[[
          const issue = Array.isArray(entity?.attributes?.issues) ? entity.attributes.issues[0] : null;
          return issue?.label || 'Scheduled job needs attention';
        ]]]
      icon: mdi:alert-circle-outline
      variables:
        alert_kind: state_not
        ok_state: ok
        alert_severity: >
          [[[ return entity?.state === 'warning' ? 'warning' : 'critical'; ]]]
        exception_detail: >
          [[[
            const issue = Array.isArray(entity?.attributes?.issues) ? entity.attributes.issues[0] : null;
            return String(issue?.detail || entity?.attributes?.summary || 'SCHEDULED JOB STATUS REQUIRES REVIEW').toUpperCase();
          ]]]
      state_display: >
        [[[ return entity?.state === 'warning' ? 'WARNING' : 'ERROR'; ]]]

    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: sensor.joanna_memory_docs
      name: BearClaw Working Memory
      icon: mdi:database-search
      variables:
        status_severity: >
          [[[ return states['binary_sensor.joanna_memory_index_stale']?.state === 'on' ? 'critical' : 'healthy'; ]]]
      state_display: >
        [[[
          const docs = entity?.state ?? '0';
          const chunks = states['sensor.joanna_memory_chunks']?.state ?? '0';
          const status = states['binary_sensor.joanna_memory_index_stale']?.state === 'on' ? 'STALE' : 'CURRENT';
          return `${status} · ${docs} DOCS · ${chunks} CHUNKS`;
        ]]]

    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: sensor.joanna_onenote_kb_health
      name: Federated OneNote KB
      icon: mdi:notebook-multiple
      variables:
        ok_state: ok
        warning_state: warning
        healthy_text: CURRENT
        warning_text: SYNC STALE
        critical_text: INDEX ERROR
      state_display: >
        [[[
          const docs = Number(entity?.attributes?.docs ?? 0).toLocaleString();
          const chunks = Number(entity?.attributes?.chunks ?? 0).toLocaleString();
          const status = entity?.state === 'ok' ? 'CURRENT' : String(entity?.state ?? 'unknown').toUpperCase();
          return `${status} · ${docs} DOCS · ${chunks} CHUNKS`;
        ]]]

    - type: custom:button-card
      template: bearstone_infra_list_row
      entity: sensor.openai_response
      name: AI Diagnostics
      icon: mdi:message-text-outline
      state_display: OPEN RESPONSE
      tap_action:
        action: navigate
        navigation_path: /dashboard-infrastructure/ai-diagnostics

    - type: custom:button-card
      template: bearstone_infra_list_row
      entity: sensor.bearclaw_status_telemetry
      name: BearClaw Admin
      icon: mdi:shield-crown-outline
      state_display: OPEN ADMIN
      tap_action:
        action: url
        url_path: http://192.168.10.13:8124/admin
