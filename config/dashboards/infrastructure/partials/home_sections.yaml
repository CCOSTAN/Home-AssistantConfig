# Original Repo : https://github.com/CCOSTAN/Home-AssistantConfig
# -------------------------------------------------------------------
# Systems Partial - operations summary
#  House-system health strip, active issues, and datacenter status.
# -------------------------------------------------------------------
# Notes: The health ribbon mirrors the visible dashboard navigation order and labels.
# Notes: DNS and external-monitoring faults roll up under Network instead of duplicating it.
# Notes: Network trend panels live on Network so Overview stays focused on broad house status.
# Notes: Power & Solar shows realtime flow; accumulated history remains in Energy.
# Notes: Scheduled Proxmox maintenance and sustained WAN quality/reset warnings render amber; critical conditions remain red.
# Notes: Active Issue rows enumerate faults, scheduled maintenance, and reset urgency so drill-down is optional for initial triage.
# Notes: Back to Overview is the first control in the landing-view navigation strip.
######################################################################

# -------------------------------------------------------------------
# Category health strip (mandatory first full-width wrapper)
# -------------------------------------------------------------------
- type: grid
  column_span: 4
  columns: 1
  square: false
  cards:
  - type: custom:layout-card
    grid_options:
      columns: full
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(10, minmax(0, 1fr))
      grid-auto-flow: row
      grid-auto-rows: min-content
      grid-gap: 12px
      margin: 0
      mediaquery:
        "(max-width: 900px)":
          grid-template-columns: repeat(2, minmax(0, 1fr))
    cards:
    - type: custom:button-card
      template: bearstone_nav_back
      name: Back to Overview
      icon: mdi:arrow-left
      view_layout:
        grid-column: 1 / -1
      tap_action:
        action: navigate
        navigation_path: /lovelace/home

    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: sensor.infra_dashboard_active_issue_count
      name: Systems
      icon: mdi:shield-check-outline
      variables:
        ok_state: '0'
        healthy_text: ALL CLEAR
        warning_text: WARNING
        raw_suffix: ACTIVE
        warning_entity_ids:
        - binary_sensor.infra_wan_sustained_degradation
        critical_entity_ids:
        - binary_sensor.infra_wan_critical
        - binary_sensor.infra_dns_pihole_degraded
        - binary_sensor.infra_compute_degraded
        - binary_sensor.infra_storage_degraded
        - binary_sensor.infra_external_monitoring_degraded

    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: binary_sensor.garage_phyn_leak_alert
      name: Home Water
      icon: mdi:shield-water-outline
      variables:
        ok_state: 'off'
        healthy_text: CLEAR
        alert_text: LEAK
      tap_action:
        action: navigate
        navigation_path: /dashboard-infrastructure/home-water

    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: sensor.l10s_vacuum_error
      name: Vacuum
      icon: mdi:robot-vacuum
      variables:
        ok_state: no_error
        healthy_text: READY
      tap_action:
        action: navigate
        navigation_path: /dashboard-infrastructure/vacuum

    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: binary_sensor.infra_compute_degraded
      name: ProxMox
      icon: mdi:server-network
      variables:
        ok_state: 'off'
        warning_text: MAINTENANCE
        warning_entity_ids:
        - binary_sensor.node_proxmox1_updates_packages
        - binary_sensor.node_proxmox02_updates_packages
      tap_action:
        action: navigate
        navigation_path: /dashboard-infrastructure/proxmox

    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: binary_sensor.docker_container_telemetry_degraded
      name: Docker
      icon: mdi:docker
      variables:
        ok_state: 'off'
      tap_action:
        action: navigate
        navigation_path: /dashboard-infrastructure/docker

    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: binary_sensor.infra_wan_quality_degraded
      name: Network
      icon: mdi:wan
      variables:
        ok_state: 'off'
        healthy_text: HEALTHY
        warning_text: DEGRADED
        critical_text: DOWN
        warning_entity_ids:
        - binary_sensor.infra_wan_sustained_degradation
        critical_entity_ids:
        - binary_sensor.infra_wan_critical
      tap_action:
        action: navigate
        navigation_path: /dashboard-infrastructure/network

    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: binary_sensor.powerwall_status
      name: Powerwall
      icon: mdi:home-battery-outline
      variables:
        ok_state: 'on'
        healthy_text: ONLINE
        alert_text: OFFLINE
      tap_action:
        action: navigate
        navigation_path: /energy/overview

    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: sensor.mariadb_status
      name: MariaDB
      icon: mdi:database
      variables:
        ok_state: running
        healthy_text: RUNNING
      tap_action:
        action: navigate
        navigation_path: /dashboard-infrastructure/mariadb

    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: binary_sensor.kiosk_devices_need_attention
      name: Kiosks
      icon: mdi:tablet-dashboard
      variables:
        ok_state: 'off'
        healthy_text: ONLINE
        alert_text: ATTENTION
      tap_action:
        action: navigate
        navigation_path: /dashboard-infrastructure/kiosks

    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: sensor.bearclaw_status_telemetry
      name: Joanna
      icon: mdi:robot-outline
      variables:
        ok_state: ok
        healthy_text: HEALTHY
        warning_text: RESET SOON
        critical_text: RESET URGENT
        warning_entity_ids:
        - binary_sensor.codex_reset_credit_expiring_soon
        critical_entity_ids:
        - binary_sensor.codex_reset_credit_expiring_critical
      tap_action:
        action: navigate
        navigation_path: /dashboard-infrastructure/joanna

# -------------------------------------------------------------------
# Active issues and datacenter
# -------------------------------------------------------------------
- type: grid
  column_span: 4
  columns: 1
  square: false
  cards:
  - type: custom:layout-card
    grid_options:
      columns: full
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(3, minmax(0, 1fr))
      grid-auto-flow: row
      grid-auto-rows: min-content
      grid-gap: 12px
      margin: 0
      mediaquery:
        "(max-width: 900px)":
          grid-template-columns: repeat(1, minmax(0, 1fr))
    cards:
    - type: custom:vertical-stack-in-card
      card_mod:
        style: !include /config/dashboards/infrastructure/card_mod/infra_panel.yaml
      cards:
      - type: custom:button-card
        template: bearstone_infra_panel_header
        name: Active Issue

      - type: custom:button-card
        template: bearstone_infra_alert_row
        entity: binary_sensor.infra_wan_quality_degraded
        name: WAN quality degraded
        icon: mdi:wan
        variables:
          alert_kind: binary_on
          warning_entity_ids:
          - binary_sensor.infra_wan_sustained_degradation
          critical_entity_ids:
          - binary_sensor.infra_wan_critical
          exception_detail: >
            [[[
              const value = (id) => {
                const raw = String(states[id]?.state ?? '').toLowerCase();
                if (['unknown', 'unavailable', 'none', ''].includes(raw)) return null;
                const number = Number(raw);
                return Number.isFinite(number) ? number : null;
              };
              const latency = value('sensor.infra_wan_latency_ms');
              const loss = value('sensor.infra_wan_packet_loss');
              const reachability = String(states['sensor.infra_wan_reachability']?.state ?? '').toLowerCase();
              const issues = [];
              if (reachability === 'offline') issues.push('REACHABILITY OFFLINE');
              else if (reachability === 'partial') issues.push('REACHABILITY PARTIAL');
              if ([latency, loss].some((item) => item === null)) issues.push('QUALITY TELEMETRY MISSING');
              if (latency !== null && latency > 80) issues.push(`LATENCY ${latency.toFixed(0)} > 80 ms`);
              if (loss !== null && loss > 5) issues.push(`LOSS ${loss.toFixed(1)}% > 5%`);
              return issues.join(' · ');
            ]]]
        state_display: >
          [[[
            return states['binary_sensor.infra_wan_critical']?.state === 'on'
              ? 'CRITICAL'
              : 'DEGRADED';
          ]]]
        tap_action:
          action: navigate
          navigation_path: /dashboard-infrastructure/network

      - type: custom:button-card
        template: bearstone_infra_alert_row
        entity: binary_sensor.infra_dns_pihole_degraded
        name: Pi-hole DNS degraded
        icon: mdi:dns-outline
        variables:
          alert_kind: binary_on
          exception_detail: >
            [[[
              const labels = {
                'switch.pi_hole': 'PRIMARY BLOCKING',
                'binary_sensor.pi_hole_status': 'PRIMARY SERVICE',
                'switch.pi_hole_2': 'SECONDARY BLOCKING',
                'binary_sensor.pi_hole_status_2': 'SECONDARY SERVICE'
              };
              const raw = entity?.attributes?.problem_entities;
              const ids = Array.isArray(raw) ? raw : [];
              return ids.map((id) => `${labels[id] || id} ${String(states[id]?.state ?? 'unknown').toUpperCase()}`).join(' · ');
            ]]]
        state_display: '[[[ return "ATTENTION"; ]]]'
        tap_action:
          action: navigate
          navigation_path: /dashboard-infrastructure/network

      - type: custom:button-card
        template: bearstone_infra_alert_row
        entity: binary_sensor.garage_phyn_leak_alert
        name: Active water leak
        icon: mdi:pipe-leak
        variables:
          alert_kind: binary_on
          exception_detail: PHYN REPORTED AN ACTIVE LEAK
        state_display: '[[[ return "LEAK"; ]]]'
        tap_action:
          action: navigate
          navigation_path: /dashboard-infrastructure/home-water

      - type: custom:button-card
        template: bearstone_infra_alert_row
        entity: sensor.l10s_vacuum_error
        name: Vacuum needs attention
        icon: mdi:robot-vacuum-alert
        variables:
          alert_kind: state_not
          ok_state: no_error
          exception_detail: >
            [[[ return String(entity?.state ?? 'UNKNOWN').replaceAll('_', ' ').toUpperCase(); ]]]
        state_display: '[[[ return "ATTENTION"; ]]]'
        tap_action:
          action: navigate
          navigation_path: /dashboard-infrastructure/vacuum

      - type: custom:button-card
        template: bearstone_infra_alert_row
        entity: binary_sensor.kiosk_devices_need_attention
        name: Kiosk device needs attention
        icon: mdi:tablet-alert
        variables:
          alert_kind: binary_on
          exception_detail: >
            [[[
              const bedroom = states['binary_sensor.bedroom_kiosk_needs_attention']?.attributes?.status;
              const kitchen = states['binary_sensor.kitchen_kiosk_needs_attention']?.attributes?.status;
              const issues = [];
              if (states['binary_sensor.bedroom_kiosk_needs_attention']?.state === 'on') issues.push(`BEDROOM: ${String(bedroom ?? 'ATTENTION').toUpperCase()}`);
              if (states['binary_sensor.kitchen_kiosk_needs_attention']?.state === 'on') issues.push(`KITCHEN: ${String(kitchen ?? 'ATTENTION').toUpperCase()}`);
              return issues.join(' · ') || 'KIOSK TELEMETRY REQUIRES REVIEW';
            ]]]
        state_display: '[[[ return "ATTENTION"; ]]]'
        tap_action:
          action: navigate
          navigation_path: /dashboard-infrastructure/kiosks

      - type: custom:button-card
        template: bearstone_infra_alert_row
        entity: binary_sensor.proxmox1_runtime_healthy
        name: Proxmox01 runtime unavailable
        icon: mdi:server-off
        variables:
          alert_kind: binary_off
          exception_detail: HOST RUNTIME SENSOR IS OFFLINE
        state_display: '[[[ return "OFFLINE"; ]]]'
        tap_action:
          action: navigate
          navigation_path: /dashboard-infrastructure/proxmox

      - type: custom:button-card
        template: bearstone_infra_alert_row
        entity: binary_sensor.proxmox02_runtime_healthy
        name: Proxmox02 runtime unavailable
        icon: mdi:server-off
        variables:
          alert_kind: binary_off
          exception_detail: HOST RUNTIME SENSOR IS OFFLINE
        state_display: '[[[ return "OFFLINE"; ]]]'
        tap_action:
          action: navigate
          navigation_path: /dashboard-infrastructure/proxmox

      - type: custom:button-card
        template: bearstone_infra_alert_row
        entity: binary_sensor.node_proxmox1_updates_packages
        name: Proxmox01 maintenance pending
        icon: mdi:package-up
        variables:
          alert_kind: binary_on
          warning_only: true
          exception_detail: >
            [[[
              const count = Number.parseInt(states['sensor.node_proxmox1_total_updates']?.state, 10);
              const countText = Number.isFinite(count)
                ? `${count} PKG${count === 1 ? '' : 'S'}`
                : 'PACKAGE COUNT UNKNOWN';
              const next = new Date();
              next.setHours(2, 15, 0, 0);
              if (next <= new Date()) next.setDate(next.getDate() + 1);
              const dateText = next.toLocaleDateString(undefined, {month: 'short', day: 'numeric'}).toUpperCase();
              const timeText = next.toLocaleTimeString(undefined, {hour: 'numeric', minute: '2-digit'});
              return `${countText} · NEXT CHECK ${dateText} ${timeText}`;
            ]]]
        state_display: '[[[ return "SCHEDULED"; ]]]'
        tap_action:
          action: navigate
          navigation_path: /dashboard-infrastructure/proxmox

      - type: custom:button-card
        template: bearstone_infra_alert_row
        entity: binary_sensor.node_proxmox02_updates_packages
        name: Proxmox02 maintenance pending
        icon: mdi:package-up
        variables:
          alert_kind: binary_on
          warning_only: true
          exception_detail: >
            [[[
              const count = Number.parseInt(states['sensor.node_proxmox02_total_updates']?.state, 10);
              const countText = Number.isFinite(count)
                ? `${count} PKG${count === 1 ? '' : 'S'}`
                : 'PACKAGE COUNT UNKNOWN';
              const next = new Date();
              next.setHours(2, 15, 0, 0);
              if (next <= new Date()) next.setDate(next.getDate() + 1);
              const dateText = next.toLocaleDateString(undefined, {month: 'short', day: 'numeric'}).toUpperCase();
              const timeText = next.toLocaleTimeString(undefined, {hour: 'numeric', minute: '2-digit'});
              return `${countText} · NEXT CHECK ${dateText} ${timeText}`;
            ]]]
        state_display: '[[[ return "SCHEDULED"; ]]]'
        tap_action:
          action: navigate
          navigation_path: /dashboard-infrastructure/proxmox

      - type: custom:button-card
        template: bearstone_infra_alert_row
        entity: binary_sensor.docker_container_telemetry_degraded
        name: Docker telemetry degraded
        icon: mdi:docker
        variables:
          alert_kind: binary_on
          exception_detail: >
            [[[
              const unavailable = states['sensor.docker_monitored_unavailable_count']?.state ?? '0';
              const total = states['sensor.docker_monitored_container_count']?.state ?? '0';
              return `${unavailable} OF ${total} MONITORED WORKLOADS UNAVAILABLE`;
            ]]]
        state_display: >
          [[[
            const unavailable = states['sensor.docker_monitored_unavailable_count']?.state ?? '0';
            const total = states['sensor.docker_monitored_container_count']?.state ?? '0';
            return `${unavailable}/${total} unavailable`;
          ]]]
        tap_action:
          action: navigate
          navigation_path: /dashboard-infrastructure/docker

      - type: custom:button-card
        template: bearstone_infra_alert_row
        entity: binary_sensor.infra_storage_degraded
        name: Storage threshold or telemetry problem
        icon: mdi:database-alert-outline
        variables:
          alert_kind: binary_on
          exception_detail: >
            [[[
              const limits = {
                'sensor.disk_use_percent': ['HOME ASSISTANT', 80],
                'sensor.carlo_nvr_volume_1_volume_used': ['NVR', 85],
                'sensor.carlo_nas01_volume_1_volume_used': ['NAS', 85]
              };
              const issues = [];
              for (const [id, [label, limit]] of Object.entries(limits)) {
                const raw = String(states[id]?.state ?? '').toLowerCase();
                const value = Number(raw);
                if (['unknown', 'unavailable', 'none', ''].includes(raw) || !Number.isFinite(value)) {
                  issues.push(`${label} NO DATA`);
                } else if (value > limit) {
                  issues.push(`${label} ${value.toFixed(1)}% > ${limit}%`);
                }
              }
              return issues.join(' · ');
            ]]]
        state_display: '[[[ return "ATTENTION"; ]]]'

      - type: custom:button-card
        template: bearstone_infra_alert_row
        entity: binary_sensor.infra_website_degraded
        name: Website availability degraded
        icon: mdi:web-off
        variables:
          alert_kind: binary_on
          exception_detail: >
            [[[
              const raw = states['sensor.infra_website_down_count']?.attributes?.down_entities;
              const items = Array.isArray(raw) ? raw : [];
              const labels = {
                'binary_sensor.vcloudinfo_com': 'VCLOUDINFO.COM',
                'binary_sensor.ipmer_com': 'IPMER.COM',
                'binary_sensor.fordst_com': 'BEAR STONE',
                'binary_sensor.www_kingcrafthomes_com': 'KINGCRAFTHOMES.COM'
              };
              return items.map((item) => {
                const [id, state] = String(item).split('=');
                return `${labels[id] || id} ${String(state || 'down').toUpperCase()}`;
              }).join(' · ');
            ]]]
        state_display: '[[[ return "DOWN"; ]]]'
        tap_action:
          action: navigate
          navigation_path: /dashboard-infrastructure/network

      - type: custom:button-card
        template: bearstone_infra_alert_row
        entity: binary_sensor.codex_reset_credit_expiring_soon
        name: Codex reset expires soon
        icon: mdi:calendar-alert
        variables:
          alert_kind: binary_on
          warning_entity_ids:
          - binary_sensor.codex_reset_credit_expiring_soon
          critical_entity_ids:
          - binary_sensor.codex_reset_credit_expiring_critical
          exception_detail: >
            [[[
              const raw = states['sensor.codex_reset_credit_next_expiration']?.state;
              const days = Number(states['sensor.codex_reset_credit_min_days_remaining']?.state);
              if (!raw || ['unknown', 'unavailable'].includes(String(raw).toLowerCase())) return 'EXPIRATION DATE UNAVAILABLE';
              const when = new Date(raw).toLocaleString('en-US', {
                month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit'
              });
              return `${when} · ${Number.isFinite(days) ? days.toFixed(1) + ' DAYS' : 'DAYS UNKNOWN'}`;
            ]]]
        state_display: >
          [[[
            return states['binary_sensor.codex_reset_credit_expiring_critical']?.state === 'on'
              ? 'RESET URGENT'
              : 'RESET SOON';
          ]]]
        tap_action:
          action: navigate
          navigation_path: /dashboard-infrastructure/joanna

      - type: custom:button-card
        template: bearstone_infra_alert_row
        entity: sensor.proxmox_garage_average_temperature
        name: Garage compute temperature high
        icon: mdi:thermometer-alert
        variables:
          alert_kind: numeric_high
          threshold: 145
        state_display: >
          [[[ return `${entity.state} °F`; ]]]
        tap_action:
          action: navigate
          navigation_path: /dashboard-infrastructure/proxmox

    - type: custom:vertical-stack-in-card
      card_mod:
        style: !include /config/dashboards/infrastructure/card_mod/infra_panel.yaml
      cards:
      - type: custom:button-card
        template: bearstone_infra_panel_header
        name: Datacenter

      - type: custom:mini-graph-card
        name: Garage Compute Temperature
        icon: mdi:thermometer
        hours_to_show: 24
        points_per_hour: 2
        line_width: 2
        smoothing: true
        show:
          legend: false
          labels: false
          name: true
          icon: true
          state: true
        color_thresholds:
        - value: 80
          color: '#43a047'
        - value: 135
          color: '#f39c12'
        - value: 145
          color: '#c0392b'
        entities:
        - entity: sensor.proxmox_garage_average_temperature
          name: Garage
        card_mod:
          style: !include /config/dashboards/infrastructure/card_mod/infra_card.yaml

      - type: custom:button-card
        template: bearstone_infra_list_row_running
        entity: sensor.garage_ups_status
        name: UPS Status
        icon: mdi:battery-heart-variant

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: sensor.garage_ups_battery_charge
        name: UPS Battery
        icon: mdi:battery-70
        state_display: >
          [[[
            const value = Number(entity?.state);
            return Number.isFinite(value) ? `${value.toFixed(0)}%` : 'NO DATA';
          ]]]

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: sensor.garage_ups_battery_runtime
        name: Runtime Remaining
        icon: mdi:timer-outline
        state_display: >
          [[[
            const seconds = Number(entity?.state);
            if (!Number.isFinite(seconds)) return 'NO DATA';
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            return hours > 0 ? `${hours}h ${minutes}m` : `${minutes}m`;
          ]]]

      - type: custom:button-card
        template: bearstone_infra_list_row
        entity: sensor.garage_ups_status
        name: On Battery
        icon: mdi:battery-alert-variant-outline
        state_display: >
          [[[
            const status = String(entity?.state ?? '').toUpperCase();
            return status ? (status.includes('OB') ? 'YES' : 'NO') : 'NO DATA';
          ]]]

    - type: custom:vertical-stack-in-card
      card_mod:
        style: !include /config/dashboards/infrastructure/card_mod/infra_panel.yaml
      cards:
      - type: custom:button-card
        template: bearstone_infra_panel_header
        name: Power & Solar

      - type: custom:power-flow-card-plus
        dashboard_link: /energy/overview
        dashboard_link_label: Open Energy
        clickable_entities: false
        use_new_flow_rate_model: true
        power_outage:
          entity: binary_sensor.powerwall_grid_status
          state_alert: 'off'
          icon_alert: mdi:transmission-tower-off
          label_alert: GRID OUTAGE
        entities:
          grid:
            entity: sensor.powerwall_site_power
            name: Grid
          solar:
            entity: sensor.powerwall_solar_power
            name: Solar
            color: '#f9a825'
            color_icon: true
            color_value: true
          battery:
            entity: sensor.powerwall_battery_power
            name: Battery
            state_of_charge: sensor.powerwall_charge
          home:
            entity: sensor.powerwall_load_power
            name: Home
        tap_action:
          action: navigate
          navigation_path: /energy/overview
