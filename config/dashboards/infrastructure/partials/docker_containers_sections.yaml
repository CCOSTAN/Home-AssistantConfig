# -------------------------------------------------------------------
# Infrastructure Partial - Docker operations
#  Host health, updates, volumes, active exceptions, and inventory drill-down.
# -------------------------------------------------------------------
# Notes: Healthy stacks and containers live in the hidden Docker Inventory subview.
# Notes: Host maintenance controls remain in the existing confirmed popups.
######################################################################

# -------------------------------------------------------------------
# Docker health strip (mandatory first full-width wrapper)
# -------------------------------------------------------------------
- type: grid
  column_span: 4
  columns: 1
  square: false
  cards:
  - type: custom:layout-card
    grid_options:
      columns: full
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(5, minmax(0, 1fr))
      grid-auto-flow: row
      grid-auto-rows: min-content
      grid-gap: 12px
      margin: 0
      mediaquery:
        "(max-width: 900px)":
          grid-template-columns: repeat(2, minmax(0, 1fr))
    cards:
    - type: custom:button-card
      template: bearstone_infra_kpi
      entity: sensor.docker_monitored_container_count
      name: Monitored
      icon: mdi:docker
      state_display: >
        [[[
          const ids = states['sensor.docker_monitored_switch_inventory']?.attributes?.entity_id;
          const unique = Array.isArray(ids)
            ? ids.filter(id => !String(id).endsWith('_container_2')).length
            : entity.state;
          return `${unique} workloads`;
        ]]]

    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: sensor.docker_monitored_unavailable_count
      name: Unavailable
      icon: mdi:alert-circle-outline
      variables:
        ok_state: '0'
        healthy_text: NONE
        raw_suffix: UNAVAILABLE

    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: binary_sensor.docker_container_telemetry_degraded
      name: Telemetry
      icon: mdi:lan-check
      variables:
        ok_state: 'off'

    - type: custom:button-card
      template: bearstone_infra_kpi
      entity: sensor.carlo_nvr_volume_1_volume_used
      name: NVR Used
      icon: mdi:harddisk

    - type: custom:button-card
      template: bearstone_infra_kpi
      entity: sensor.carlo_nas01_volume_1_volume_used
      name: NAS Used
      icon: mdi:nas

# -------------------------------------------------------------------
# Host maintenance signals and volume telemetry
# -------------------------------------------------------------------
- type: grid
  column_span: 4
  columns: 1
  square: false
  cards:
  - type: custom:layout-card
    grid_options:
      columns: full
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(2, minmax(0, 1fr))
      grid-auto-flow: row
      grid-auto-rows: min-content
      grid-gap: 12px
      margin: 0
      mediaquery:
        "(max-width: 900px)":
          grid-template-columns: repeat(1, minmax(0, 1fr))
    cards:
    - type: custom:vertical-stack-in-card
      card_mod:
        style: !include /config/dashboards/infrastructure/card_mod/infra_panel.yaml
      cards:
      - type: custom:button-card
        template: bearstone_infra_panel_header
        name: Host Updates

      - type: custom:button-card
        template: bearstone_infra_update_row
        entity: sensor.docker_10_apt_status
        name: docker_10
        tap_action:
          action: navigate
          navigation_path: '#infra-docker-10'

      - type: custom:button-card
        template: bearstone_infra_update_row
        entity: sensor.docker_17_apt_status
        name: docker_17
        tap_action:
          action: navigate
          navigation_path: '#infra-docker-17'

      - type: custom:button-card
        template: bearstone_infra_update_row
        entity: sensor.docker_69_apt_status
        name: docker_69
        tap_action:
          action: navigate
          navigation_path: '#infra-docker-69'

      - type: custom:button-card
        template: bearstone_infra_update_row
        entity: sensor.docker_14_apt_status
        name: docker_14
        tap_action:
          action: navigate
          navigation_path: '#infra-docker-14'

    - type: custom:vertical-stack-in-card
      card_mod:
        style: !include /config/dashboards/infrastructure/card_mod/infra_panel.yaml
      cards:
      - type: custom:button-card
        template: bearstone_infra_panel_header
        name: Docker Volumes

      - type: custom:button-card
        template: bearstone_infra_docker_volume_row
        entity: sensor.carlo_hass_volume_disk_usage_total_size
        name: docker_10
        variables:
          total_entity: sensor.carlo_hass_volume_disk_usage_total_size

      - type: custom:button-card
        template: bearstone_infra_docker_volume_row
