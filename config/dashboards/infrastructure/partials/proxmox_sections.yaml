# -------------------------------------------------------------------
# Infrastructure Partial - Proxmox
#  Runtime/update status with one-metric host, VM, and temperature trends.
# -------------------------------------------------------------------
# Notes: All graphs use 24-hour windows and explicit threshold colors.
# Notes: Pending updates remain windowed maintenance signals, not runtime failures.
######################################################################

# -------------------------------------------------------------------
# Host status strip (mandatory first full-width wrapper)
# -------------------------------------------------------------------
- type: grid
  column_span: 4
  columns: 1
  square: false
  cards:
  - type: custom:layout-card
    grid_options:
      columns: full
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(4, minmax(0, 1fr))
      grid-auto-flow: row
      grid-auto-rows: min-content
      grid-gap: 12px
      margin: 0
      mediaquery:
        "(max-width: 900px)":
          grid-template-columns: repeat(2, minmax(0, 1fr))
    cards:
    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: binary_sensor.proxmox1_runtime_healthy
      name: Proxmox01 Runtime
      icon: mdi:server
      variables:
        ok_state: 'on'
        healthy_text: ONLINE
        alert_text: OFFLINE

    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: binary_sensor.proxmox02_runtime_healthy
      name: Proxmox02 Runtime
      icon: mdi:server
      variables:
        ok_state: 'on'
        healthy_text: ONLINE
        alert_text: OFFLINE

    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: binary_sensor.node_proxmox1_updates_packages
      name: Proxmox01 Updates
      icon: mdi:package-up
      variables:
        ok_state: 'off'
        healthy_text: CURRENT
        alert_text: PENDING

    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: binary_sensor.node_proxmox02_updates_packages
      name: Proxmox02 Updates
      icon: mdi:package-up
      variables:
        ok_state: 'off'
        healthy_text: CURRENT
        alert_text: PENDING

# -------------------------------------------------------------------
# Host resource trends
# -------------------------------------------------------------------
- type: grid
  column_span: 4
  columns: 1
  square: false
  cards:
  - type: custom:layout-card
    grid_options:
      columns: full
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(2, minmax(0, 1fr))
      grid-auto-flow: dense
      grid-auto-rows: min-content
      grid-gap: 12px
      margin: 0
      mediaquery:
        "(max-width: 900px)":
          grid-template-columns: repeat(1, minmax(0, 1fr))
    cards:
    - type: custom:vertical-stack-in-card
      card_mod:
        style: !include /config/dashboards/infrastructure/card_mod/infra_panel.yaml
      cards:
      - type: custom:button-card
        template: bearstone_infra_panel_header
        name: Proxmox01

      - type: custom:mini-graph-card
        name: CPU Utilization
        icon: mdi:cpu-64-bit
        hours_to_show: 24
        points_per_hour: 2
        line_width: 2
        smoothing: true
        show:
          legend: false
          labels: false
          name: true
          icon: true
          state: true
        color_thresholds:
        - value: 0
          color: '#43a047'
        - value: 60
          color: '#f39c12'
        - value: 85
          color: '#c0392b'
        entities:
        - entity: sensor.node_proxmox1_cpu_used
          name: CPU
        card_mod:
          style: !include /config/dashboards/infrastructure/card_mod/infra_card.yaml

      - type: custom:mini-graph-card
        name: Memory Utilization
        icon: mdi:memory
        hours_to_show: 24
        points_per_hour: 2
        line_width: 2
        smoothing: true
        show:
          legend: false
          labels: false
          name: true
          icon: true
          state: true
        color_thresholds:
        - value: 0
          color: '#43a047'
        - value: 70
          color: '#f39c12'
        - value: 90
          color: '#c0392b'
        entities:
        - entity: sensor.node_proxmox1_memory_used_percentage
          name: Memory
        card_mod:
          style: !include /config/dashboards/infrastructure/card_mod/infra_card.yaml

      - type: custom:mini-graph-card
