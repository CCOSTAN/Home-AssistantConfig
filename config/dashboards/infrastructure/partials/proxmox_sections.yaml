        hours_to_show: 24
        points_per_hour: 2
        line_width: 2
        smoothing: true
        show:
          legend: false
          labels: false
          name: true
          icon: true
          state: true
        color_thresholds:
        - value: 0
          color: '#43a047'
        - value: 70
          color: '#f39c12'
        - value: 85
          color: '#c0392b'
        entities:
        - entity: sensor.proxmox1_disk_used_percentage
          name: Disk
        card_mod:
          style: !include /config/dashboards/infrastructure/card_mod/infra_card.yaml

    - type: custom:vertical-stack-in-card
      card_mod:
        style: !include /config/dashboards/infrastructure/card_mod/infra_panel.yaml
      cards:
      - type: custom:button-card
        template: bearstone_infra_panel_header
        name: Proxmox02

      - type: custom:mini-graph-card
        name: CPU Utilization
        icon: mdi:cpu-64-bit
        hours_to_show: 24
        points_per_hour: 2
        line_width: 2
        smoothing: true
        show:
          legend: false
          labels: false
          name: true
          icon: true
          state: true
        color_thresholds:
        - value: 0
          color: '#43a047'
        - value: 60
          color: '#f39c12'
        - value: 85
          color: '#c0392b'
        entities:
        - entity: sensor.node_proxmox02_cpu_used
          name: CPU
        card_mod:
          style: !include /config/dashboards/infrastructure/card_mod/infra_card.yaml

      - type: custom:mini-graph-card
        name: Memory Utilization
        icon: mdi:memory
        hours_to_show: 24
        points_per_hour: 2
        line_width: 2
        smoothing: true
        show:
          legend: false
          labels: false
          name: true
          icon: true
          state: true
        color_thresholds:
        - value: 0
          color: '#43a047'
        - value: 70
          color: '#f39c12'
        - value: 90
          color: '#c0392b'
        entities:
        - entity: sensor.node_proxmox02_memory_used_percentage
          name: Memory
        card_mod:
