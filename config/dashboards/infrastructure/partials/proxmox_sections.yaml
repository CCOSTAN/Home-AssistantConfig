# -------------------------------------------------------------------
# Garage server CPU package temperatures (hardware, not ambient)
# -------------------------------------------------------------------
- type: grid
  column_span: 4
  columns: 3
  square: false
  cards:
  - type: custom:mini-graph-card
    name: ProxMox1 CPU Temperature
    icon: mdi:thermometer
    hours_to_show: 24
    points_per_hour: 2
    line_width: 2
    height: 160
    show:
      legend: false
      labels: false
      state: true
    color_thresholds:
    - value: 0
      color: "#43a047"
    - value: 176
      color: "#f39c12"
    - value: 194
      color: "#c0392b"
    entities:
    - entity: sensor.proxmox1_package_id_0_temperature
      name: ProxMox1 CPU Temperature

  - type: custom:mini-graph-card
    name: ProxMox02 CPU Temperature
    icon: mdi:thermometer
