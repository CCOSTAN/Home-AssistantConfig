# -------------------------------------------------------------------
# Infrastructure Partial - Proxmox
#  Runtime/update status with compact host utilization and CPU temperature trends.
# -------------------------------------------------------------------
# Notes: All graphs use 24-hour windows and explicit threshold colors.
# Notes: Host utilization uses a shared 0-100 percent scale and 5-minute averages.
# Notes: Pending updates remain windowed maintenance signals, not runtime failures.
# Notes: Recorder retains the nine displayed utilization metrics; all three hosts have history.
######################################################################

# -------------------------------------------------------------------
# Host status strip (mandatory first full-width wrapper)
# -------------------------------------------------------------------
- type: grid
  column_span: 4
  columns: 1
  square: false
  cards:
  - type: custom:layout-card
    grid_options:
      columns: full
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(3, minmax(0, 1fr))
      grid-auto-flow: row
      grid-auto-rows: min-content
      grid-gap: 12px
      margin: 0
      mediaquery:
        "(max-width: 900px)":
          grid-template-columns: repeat(2, minmax(0, 1fr))
    cards:
    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: binary_sensor.proxmox1_runtime_healthy
      name: Proxmox01 Runtime
      icon: mdi:server
      variables:
        ok_state: 'on'
        healthy_text: ONLINE
        alert_text: OFFLINE

    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: binary_sensor.proxmox02_runtime_healthy
      name: Proxmox02 Runtime
      icon: mdi:server
      variables:
        ok_state: 'on'
        healthy_text: ONLINE
        alert_text: OFFLINE

    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: binary_sensor.node_proxmox03_status
      name: Proxmox03 Runtime
      icon: mdi:server
      variables:
        ok_state: 'on'
        healthy_text: ONLINE
        alert_text: OFFLINE

    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: binary_sensor.node_proxmox1_updates_packages
      name: Proxmox01 Updates
      icon: mdi:package-up
      variables:
        ok_state: 'off'
        warning_state: 'on'
        healthy_text: CURRENT
        warning_text: SCHEDULED
        alert_text: PENDING
        pending_detail: true
        pending_count_entity: sensor.node_proxmox1_total_updates
        pending_schedule_hour: 2
        pending_schedule_minute: 15

    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: binary_sensor.node_proxmox02_updates_packages
      name: Proxmox02 Updates
      icon: mdi:package-up
      variables:
        ok_state: 'off'
        warning_state: 'on'
        healthy_text: CURRENT
        warning_text: SCHEDULED
        alert_text: PENDING
        pending_detail: true
        pending_count_entity: sensor.node_proxmox02_total_updates
        pending_schedule_hour: 2
        pending_schedule_minute: 15

    - type: custom:button-card
      template: bearstone_infra_status_kpi
      entity: binary_sensor.node_proxmox03_updates_packages
      name: Proxmox03 Updates
      icon: mdi:package-up
      variables:
        ok_state: 'off'
        warning_state: 'on'
        healthy_text: CURRENT
        warning_text: SCHEDULED
        alert_text: PENDING
        pending_detail: true
        pending_count_entity: sensor.node_proxmox03_total_updates
        pending_schedule_hour: 2
        pending_schedule_minute: 15

# -------------------------------------------------------------------
# Host resource trends
# -------------------------------------------------------------------
- type: grid
  column_span: 4
  columns: 1
  square: false
  cards:
  - type: custom:layout-card
    grid_options:
      columns: full
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(3, minmax(0, 1fr))
      grid-auto-flow: dense
      grid-auto-rows: min-content
      grid-gap: 12px
      margin: 0
      mediaquery:
        "(max-width: 600px)":
          grid-template-columns: minmax(0, 1fr)
        "(max-width: 900px)":
          grid-template-columns: repeat(2, minmax(0, 1fr))
    cards:
    - type: custom:mini-graph-card
      name: Proxmox01 CPU
      icon: mdi:cpu-64-bit
      hours_to_show: 24
      points_per_hour: 12
      line_width: 2
      smoothing: false
      lower_bound: 0
      upper_bound: 100
      decimals: 1
      height: 160
      show:
        legend: false
        labels: true
        fill: false
        name: true
        icon: true
        state: true
      color_thresholds:
      - value: 0
        color: '#43a047'
      - value: 60
        color: '#f39c12'
      - value: 85
        color: '#c0392b'
      entities:
      - entity: sensor.node_proxmox1_cpu_used
        name: CPU
      card_mod:
        style: !include /config/dashboards/infrastructure/card_mod/infra_card.yaml

