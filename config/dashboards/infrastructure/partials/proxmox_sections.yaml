# -------------------------------------------------------------------
# VM and thermal trends (same-unit series only)
# -------------------------------------------------------------------
- type: grid
  column_span: 4
  columns: 3
  square: false
  cards:
  - type: custom:mini-graph-card
    name: VM CPU Utilization
    icon: mdi:chart-line
    hours_to_show: 24
    points_per_hour: 2
    line_width: 2
    smoothing: true
    show:
      legend: true
      labels: false
      name: true
      icon: true
      state: false
    entities:
    - entity: sensor.qemu_docker69_169_cpu_used
      name: Docker69
    - entity: sensor.qemu_carlo_hass_105_cpu_used
      name: Home Assistant
    - entity: sensor.qemu_docker2_101_cpu_used
      name: Frigate
    card_mod:
      style: !include /config/dashboards/infrastructure/card_mod/infra_card.yaml

  - type: custom:mini-graph-card
    name: VM Memory Utilization
    icon: mdi:memory
    hours_to_show: 24
    points_per_hour: 2
    line_width: 2
    smoothing: true
    show:
      legend: true
      labels: false
      name: true
      icon: true
      state: false
    entities:
    - entity: sensor.qemu_docker69_169_memory_used_percentage
      name: Docker69
    - entity: sensor.qemu_carlo_hass_105_memory_used_percentage
      name: Home Assistant
    - entity: sensor.qemu_docker2_101_memory_used_percentage
      name: Frigate
    card_mod:
      style: !include /config/dashboards/infrastructure/card_mod/infra_card.yaml

  - type: custom:mini-graph-card
    name: Garage Temperature
    icon: mdi:thermometer
    hours_to_show: 24
    points_per_hour: 2
    line_width: 2
    smoothing: true
    show:
      legend: true
      labels: false
      name: true
      icon: true
      state: true
    color_thresholds:
    - value: 80
      color: '#43a047'
    - value: 135
      color: '#f39c12'
    - value: 145
      color: '#c0392b'
    entities:
    - entity: sensor.proxmox_garage_average_temperature
      name: Garage
    - entity: sensor.pirateweather_temperature
      name: Outside
    card_mod:
      style: !include /config/dashboards/infrastructure/card_mod/infra_card.yaml
