      - type: custom:mini-graph-card
        name: Disk Utilization
        icon: mdi:harddisk
        hours_to_show: 24
        points_per_hour: 2
        line_width: 2
        smoothing: true
        show:
          legend: false
          labels: false
          name: true
          icon: true
          state: true
        color_thresholds:
        - value: 0
