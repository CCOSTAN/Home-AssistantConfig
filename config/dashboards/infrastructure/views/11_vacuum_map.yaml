# -------------------------------------------------------------------
# Systems Subview - Vacuum Map
#  Full interactive Dreame map for zone, point, and room cleaning.
# -------------------------------------------------------------------
# Notes: Specialized map card is retained because native cards do not expose interactive vacuum-map cleaning.
# Notes: Use the current-map camera; the saved-map image endpoint can return an error in Dreame v2.0.0.
# Notes: Read calibration from the rendered camera so map selection stays aligned with current coordinates.
# Notes: Explicit live-run tiles avoid obsolete autogenerated settings and duplicate lifetime totals.
# Notes: Room mode uses current-map room selectors; regenerate the partial after remapping rooms.
# Notes: Panel view is intentional so the single interactive map can use the full available canvas.
######################################################################

title: Vacuum Map
path: vacuum-map
subview: true
back_path: /dashboard-infrastructure/vacuum
type: panel
icon: mdi:map-outline
theme: default
cards:
# Fallback card: the installed vacuum map card provides device-specific interactive map controls.
- type: custom:xiaomi-vacuum-map-card
  grid_options:
    columns: full
  map_source:
    camera: camera.l10s_vacuum_map
  calibration_source:
    camera: true
  entity: vacuum.l10s_vacuum
  vacuum_platform: Tasshack/dreame-vacuum
  tiles:
  - entity: vacuum.l10s_vacuum
    label: Robot
    icon: mdi:robot-vacuum
  - entity: sensor.l10s_vacuum_battery_level
    label: Battery
    icon: mdi:battery
    unit: '%'
  - entity: sensor.l10s_vacuum_current_room
    label: Room
    icon: mdi:map-marker-radius-outline
  - entity: vacuum.l10s_vacuum
    attribute: cleaned_area
    label: Cleaned Area
    icon: mdi:ruler-square
    unit: m2
  - entity: vacuum.l10s_vacuum
    attribute: cleaning_time
    label: Cleaning Time
    icon: mdi:timer-outline
    unit: min
  map_modes:
  - template: vacuum_clean_segment
    run_immediately: false
    predefined_selections: !include /config/dashboards/infrastructure/partials/vacuum_map_rooms.yaml
  - template: vacuum_clean_zone
  - template: vacuum_clean_point
