# Original Repo : https://github.com/CCOSTAN/Home-AssistantConfig
# -------------------------------------------------------------------
# Infrastructure Subview - Living Room Roku Remote
# Related Issue: 2030
#  Native Roku navigation, playback, and the Raven app launcher.
# -------------------------------------------------------------------
# Notes: Open from the Raven card or device panel on Systems > Kiosks.
# Notes: Each tap sends one Roku command; Back/Home exit Raven natively.
# Notes: TV menus remain on the separate Samsung TV Remote subview.
# Notes: Reuses the existing large mobile controls and launch action.
######################################################################

path: roku-remote
title: Roku Remote
icon: mdi:remote-tv
subview: true
type: sections
max_columns: 4
badges: []
sections:
- type: grid
  column_span: 4
  columns: 1
  square: false
  cards:
  - type: custom:layout-card
    grid_options:
      columns: full
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(6, minmax(0, 1fr))
      grid-auto-flow: row
      grid-auto-rows: min-content
      align-items: stretch
      grid-gap: 10px
      margin: 0
    cards:
    - type: custom:button-card
      template: bearstone_mobile_header
      name: Living Room Roku
      icon: mdi:television
      view_layout:
        grid-column: 1 / -1

    - type: custom:button-card
      template: bearstone_mobile_control
      entity: media_player.living_room_ultra
      name: Raven
      icon: mdi:view-dashboard-outline
      show_state: false
      variables:
        status_severity: healthy
      view_layout:
        grid-column: 1 / -1
      tap_action:
        action: perform-action
        perform_action: rest_command.samsung_living_room_launch_haven
      hold_action:
        action: none
      double_tap_action:
        action: none

    # Roku controls never send Samsung input or menu commands.
    - type: custom:button-card
      template: bearstone_mobile_control
      entity: remote.living_room_ultra
      name: Roku Home
      icon: mdi:home-outline
      show_state: false
      variables:
        status_severity: active
      view_layout:
        grid-column: span 3
      tap_action:
        action: perform-action
        perform_action: remote.send_command
        target:
          entity_id: remote.living_room_ultra
        data:
          command: home
      hold_action:
        action: none
      double_tap_action:
        action: none

    - type: custom:button-card
      template: bearstone_mobile_control
      entity: remote.living_room_ultra
      name: Options
      icon: mdi:dots-horizontal
      show_state: false
      variables:
        status_severity: active
      view_layout:
        grid-column: span 3
      tap_action:
        action: perform-action
        perform_action: remote.send_command
        target:
          entity_id: remote.living_room_ultra
        data:
          command: info
      hold_action:
        action: none
      double_tap_action:
        action: none

    # Full-width Up and Down keep every touch target large without spacers.
    - type: custom:button-card
      template: bearstone_mobile_control
      entity: remote.living_room_ultra
      name: Up
      icon: mdi:arrow-up-bold
      show_state: false
      variables:
        status_severity: active
      view_layout:
        grid-column: 1 / -1
      tap_action:
        action: perform-action
        perform_action: remote.send_command
        target:
          entity_id: remote.living_room_ultra
        data:
          command: up
      hold_action:
        action: none
      double_tap_action:
        action: none

    - type: custom:button-card
      template: bearstone_mobile_control
      entity: remote.living_room_ultra
      name: Left
      icon: mdi:arrow-left-bold
      show_state: false
      variables:
        status_severity: active
      view_layout:
        grid-column: span 2
      tap_action:
        action: perform-action
        perform_action: remote.send_command
        target:
          entity_id: remote.living_room_ultra
        data:
          command: left
      hold_action:
        action: none
      double_tap_action:
        action: none

    - type: custom:button-card
      template: bearstone_mobile_control
      entity: remote.living_room_ultra
      name: OK
      icon: mdi:check-bold
      show_state: false
      variables:
        status_severity: healthy
      view_layout:
        grid-column: span 2
      tap_action:
        action: perform-action
        perform_action: remote.send_command
        target:
          entity_id: remote.living_room_ultra
        data:
          command: select
      hold_action:
        action: none
      double_tap_action:
        action: none

    - type: custom:button-card
      template: bearstone_mobile_control
      entity: remote.living_room_ultra
      name: Right
      icon: mdi:arrow-right-bold
      show_state: false
      variables:
        status_severity: active
      view_layout:
        grid-column: span 2
      tap_action:
        action: perform-action
        perform_action: remote.send_command
        target:
          entity_id: remote.living_room_ultra
        data:
          command: right
      hold_action:
        action: none
      double_tap_action:
        action: none

    - type: custom:button-card
      template: bearstone_mobile_control
      entity: remote.living_room_ultra
      name: Down
      icon: mdi:arrow-down-bold
      show_state: false
      variables:
        status_severity: active
      view_layout:
        grid-column: 1 / -1
      tap_action:
        action: perform-action
        perform_action: remote.send_command
        target:
          entity_id: remote.living_room_ultra
        data:
          command: down
      hold_action:
        action: none
      double_tap_action:
        action: none

    # Back exits Raven; playback controls act on the current Roku app.
    - type: custom:button-card
      template: bearstone_mobile_control
      entity: remote.living_room_ultra
      name: Back
      icon: mdi:undo
      show_state: false
      variables:
        status_severity: active
      view_layout:
        grid-column: span 3
      tap_action:
        action: perform-action
        perform_action: remote.send_command
        target:
          entity_id: remote.living_room_ultra
        data:
          command: back
      hold_action:
        action: none
      double_tap_action:
        action: none

    - type: custom:button-card
      template: bearstone_mobile_control
      entity: remote.living_room_ultra
      name: Play / Pause
      icon: mdi:play-pause
      show_state: false
      variables:
        status_severity: active
      view_layout:
        grid-column: span 3
      tap_action:
        action: perform-action
        perform_action: remote.send_command
        target:
          entity_id: remote.living_room_ultra
        data:
          command: play
      hold_action:
        action: none
      double_tap_action:
        action: none
cards: []
