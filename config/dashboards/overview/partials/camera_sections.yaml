# -------------------------------------------------------------------
# Overview Partial - camera sections
#  Standardized access ribbon followed by live exterior cameras.
# -------------------------------------------------------------------
# Notes: Entry controls reuse the same shared template as the Home ribbon.
# Notes: Desktop keeps three upper cameras and four second-row cameras beside the doorbell.
# Notes: A full-width responsive grid prevents section wrapping; narrow screens use two columns.
# Notes: Camera tiles open live camera details; thumbnails play individual clips.
# Notes: The full recording timeline is available on the dedicated Clips view.
######################################################################

- type: grid
  column_span: 4
  columns: 1
  square: false
  cards:
  - type: custom:layout-card
    grid_options:
      columns: full
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(3, minmax(0, 1fr))
      grid-auto-flow: row
      grid-auto-rows: min-content
      align-items: center
      grid-gap: 10px
      margin: 0
      mediaquery:
        "(max-width: 900px)":
          grid-template-columns: repeat(2, minmax(0, 1fr))
    cards:
    - type: custom:button-card
      template: bearstone_overview_ribbon_control
      entity: cover.large_garage_door
      name: Large Garage
      icon: mdi:garage
      variables:
        ok_states:
        - closed
        warning_states:
        - opening
        - closing

    - type: custom:button-card
      template: bearstone_overview_ribbon_control
      entity: cover.small_garage_door
      name: Small Garage
      icon: mdi:garage
      variables:
        ok_states:
        - closed
        warning_states:
        - opening
        - closing

    - type: custom:button-card
      template: bearstone_overview_ribbon_control
      entity: lock.front_door
      name: Front Door
      icon: mdi:door-closed-lock
      variables:
        ok_states:
        - locked

# Picture-glance supplies previews and live camera dialogs; button-card cannot.
- type: grid
  column_span: 4
  cards:
  - type: custom:layout-card
    grid_options:
      columns: full
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(16, minmax(0, 1fr))
      grid-template-areas: |
        "door door door door garage garage garage garage lawn lawn lawn lawn drive drive drive drive"
        "door door door door kids kids kids bedroom bedroom bedroom filter filter filter conico conico conico"
        "pool pool pool pool events events events events events events events events events events events events"
      grid-template-rows: min-content min-content min-content
      align-items: start
      grid-gap: 8px
      margin: 0
      mediaquery:
        "(max-width: 900px)":
          grid-template-columns: repeat(2, minmax(0, 1fr))
          grid-template-areas: |
            "door garage"
            "pool lawn"
            "drive kids"
            "bedroom filter"
            "conico conico"
            "events events"
    cards:
    - type: picture-glance
      camera_image: camera.frontdoorbell
      tap_action:
        action: more-info
      hold_action:
        action: more-info
      camera_view: auto
      aspect_ratio: '4:5'
      entities: []
      view_layout:
        grid-area: door
    - type: picture-glance
      camera_image: camera.poolcam
      tap_action:
        action: more-info
      hold_action:
        action: more-info
      camera_view: auto
      aspect_ratio: '16:9'
      entities: []
      view_layout:
        grid-area: pool
        place-self: start stretch
    - type: picture-glance
      camera_image: camera.garagecam
      tap_action:
        action: more-info
      hold_action:
        action: more-info
      camera_view: auto
      entities: []
      view_layout:
        grid-area: garage
    - type: picture-glance
      camera_image: camera.frontlawn
      tap_action:
        action: more-info
      hold_action:
        action: more-info
      camera_view: auto
      entities: []
      view_layout:
        grid-area: lawn
    - type: picture-glance
      camera_image: camera.driveway
      tap_action:
        action: more-info
      hold_action:
        action: more-info
      camera_view: auto
      entities: []
      view_layout:
        grid-area: drive
    - type: picture-glance
      camera_image: camera.kidsgate
      tap_action:
        action: more-info
      hold_action:
        action: more-info
      camera_view: auto
      entities: []
      view_layout:
        grid-area: kids
    - type: picture-glance
      camera_image: camera.bedroomgate
      tap_action:
        action: more-info
      hold_action:
        action: more-info
      camera_view: auto
      entities: []
      view_layout:
        grid-area: bedroom
    - type: picture-glance
      camera_image: camera.filtergate
      tap_action:
        action: more-info
      hold_action:
        action: more-info
      camera_view: auto
      entities: []
      view_layout:
        grid-area: filter
    - type: picture-glance
      camera_image: camera.conico_wireless
      tap_action:
        action: more-info
      hold_action:
        action: more-info
      camera_view: auto
      entities: []
      view_layout:
        grid-area: conico
    # Eight thumbnail-only previews keep the live grid compact; use Clips for review.
    - type: custom:frigate-events-card
      frigate_client_id: frigate
      cameras: !include /config/dashboards/overview/partials/frigate_camera_names.yaml
      review_clips: true
      show_timeline: false
      timeline_on_click: false
      layout: grid
      scroll: false
      event_count: 8
      review_compact: true
      grid_max_height: 215px
      video: true
      video_on_hover: true
      view_layout:
        grid-area: events
