# -------------------------------------------------------------------
# Lighting - Everyday controls
#  Shared Home and Lighting-menu cards; native tiles show the current state and support keyboard activation.
# -------------------------------------------------------------------
# Notes: Living Room includes accents; Kitchen includes Sink via existing membership.
######################################################################

- type: tile
  entity: light.living_room_lighting
  name: Living Room
  icon: mdi:sofa-outline
  state_content: state
  icon_tap_action:
    action: none
  card_mod: !include /config/dashboards/overview/partials/lighting_tile_card_mod.yaml
  tap_action:
    action: toggle
  hold_action:
    action: more-info
- type: tile
  entity: light.kitchen_lights
  name: Kitchen
  icon: mdi:ceiling-light-outline
  state_content: state
  icon_tap_action:
