# -------------------------------------------------------------------
# Lighting - Everyday controls
#  Shared Home and Lighting-menu cards; existing mobile templates own the styling.
# -------------------------------------------------------------------
# Notes: Living Room includes accents; Kitchen includes Sink via existing membership.
######################################################################

- type: custom:button-card
  template: bearstone_mobile_control
  entity: light.living_room_lighting
  name: Living Room
  icon: mdi:sofa-outline
  variables:
    ok_states:
    - 'off'
    active_states:
    - 'on'
    state_labels:
      unavailable: OFFLINE
      unknown: UNKNOWN
  tap_action:
    action: toggle
  hold_action:
    action: more-info
