# -------------------------------------------------------------------
# Overview Partial - cameras cards
#  Recording gallery with direct access to the shared timeline player.
# -------------------------------------------------------------------
# Notes: Pages through recorded clips; each clip opens its exact event time.
######################################################################

# The event card provides recording playback and scrubbing beyond button-card.
- type: custom:frigate-events-card
  title: Camera Clips
  frigate_client_id: frigate
  cameras: !include /config/dashboards/overview/partials/frigate_camera_names.yaml
  review_clips: true
  show_timeline: true
  timeline_on_click: true
  video: true
  video_on_hover: true
  layout: grid
  scroll: false
  event_count: 60
  grid_max_height: 75vh
