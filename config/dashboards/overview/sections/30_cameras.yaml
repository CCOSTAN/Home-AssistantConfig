# -------------------------------------------------------------------
# Overview Section - camera and weather awareness
#  Keeps security views and outdoor context together in one column.
# -------------------------------------------------------------------
# Notes: Birdseye opens Live Cameras; the recording timeline lives on Clips.
# Notes: Pirate Weather shows current/hourly weather; the lower card is daily-only.
######################################################################

cards:
- type: custom:frigate-events-card
  frigate_client_id: frigate
  cameras: !include /config/dashboards/overview/partials/frigate_camera_names.yaml
  show_timeline: false
  timeline_on_click: false
  event_count: 5
  video: true
  video_on_hover: true

- type: picture-entity
  entity: camera.birdseye
  show_state: true
  show_name: true
  camera_view: live
  tap_action:
    action: navigate
    navigation_path: /lovelace/live-cameras
  hold_action:
    action: more-info

- type: weather-forecast
  show_current: true
  show_forecast: true
  entity: weather.pirateweather
  forecast_type: hourly
  secondary_info_attribute: humidity

# Retain the weather card's daily temperature bars using its v3 section options.
- type: custom:clock-weather-card
  entity: weather.pirateweather
  weather_icon_type: fill
  locale: en-GB
  sections:
    header:
      hide: true
    forecast_strip:
      hide: true
    forecast_list:
      hide: false
      forecast_type: daily
      count: 5

column_span: 1
