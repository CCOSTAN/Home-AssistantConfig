# For more info visit https://www.vcloudinfo.com/click-here
# Original Repo : https://github.com/CCOSTAN/Home-AssistantConfig
# -------------------------------------------------------------------
# Overview View - Mobile
#  Mobile-first access, climate, and exception status.
# -------------------------------------------------------------------
# Notes: Visible second Overview tab, after Home and before Camera.
# Notes: Tap access and climate tiles for Home Assistant's native controls.
# Notes: Two-column 112px tiles and large text prioritize use without glasses.
# Notes: Odd final tiles span both columns to avoid small orphan controls.
# Notes: The top Back to Home button preserves visible-tab navigation.
# Video: https://youtu.be/ujP-zYLEso8
# Companion Post: https://www.vcloudinfo.com/2026/07/home-assistant-mobile-dashboard-big-buttons.html
######################################################################

path: mobile
title: Mobile
icon: mdi:cellphone
show_icon_and_title: true
theme: Backend-selected
type: sections
max_columns: 4
dense_section_placement: true
badges: []
sections:

# -------------------------------------------------------------------
# Quick access
# -------------------------------------------------------------------
- type: grid
  column_span: 4
  columns: 1
  square: false
  cards:
  - type: custom:layout-card
    grid_options:
      columns: full
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(2, minmax(0, 1fr))
      grid-auto-flow: row
      grid-auto-rows: min-content
      align-items: stretch
      grid-gap: 12px
      margin: 0
    cards:
    - type: custom:button-card
      template: bearstone_nav_back
      name: Back to Home
      icon: mdi:arrow-left
      view_layout:
        grid-column: 1 / -1
      tap_action:
        action: navigate
        navigation_path: /lovelace/home

    - type: custom:button-card
      template: bearstone_mobile_header
      name: Quick Access
      icon: mdi:gesture-tap-button
      view_layout:
        grid-column: 1 / -1

    - type: custom:button-card
      template: bearstone_mobile_control
      entity: cover.large_garage_door
      name: Large Garage
      icon: mdi:garage
      variables:
        ok_states:
        - closed
        warning_states:
        - opening
        - closing

    - type: custom:button-card
      template: bearstone_mobile_control
      entity: cover.small_garage_door
      name: Small Garage
      icon: mdi:garage
      variables:
        ok_states:
        - closed
        warning_states:
        - opening
        - closing

    - type: custom:button-card
      template: bearstone_mobile_control
      entity: lock.front_door
      name: Front Door
      icon: mdi:door-closed-lock
      view_layout:
        grid-column: 1 / -1
      variables:
        ok_states:
        - locked

# -------------------------------------------------------------------
# Climate
# -------------------------------------------------------------------
- type: grid
  column_span: 4
  columns: 1
  square: false
  cards:
  - type: custom:layout-card
    grid_options:
      columns: full
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(2, minmax(0, 1fr))
      grid-auto-flow: row
      grid-auto-rows: min-content
      align-items: stretch
      grid-gap: 12px
      margin: 0
    cards:
    - type: custom:button-card
      template: bearstone_mobile_header
      name: Climate
      icon: mdi:thermostat
      view_layout:
        grid-column: 1 / -1

    - type: custom:button-card
      template: bearstone_mobile_control
      entity: climate.downstairs
      name: Downstairs
      icon: mdi:thermostat
      variables:
        display_mode: climate
        humidity_entity: sensor.downstairs_humidity
        cooling_entity: binary_sensor.downstairs_ac_is_cooling
        ok_states:
        - auto
        - cool
        - dry
        - fan_only
        - heat
        - heat_cool
        - 'off'

    - type: custom:button-card
      template: bearstone_mobile_control
      entity: climate.upstairs
      name: Upstairs
      icon: mdi:thermostat
      variables:
        display_mode: climate
        humidity_entity: sensor.upstairs_humidity
        cooling_entity: binary_sensor.upstairs_ac_is_cooling
        ok_states:
        - auto
        - cool
        - dry
        - fan_only
        - heat
        - heat_cool
        - 'off'

# -------------------------------------------------------------------
# Alerts and status
# -------------------------------------------------------------------
- type: grid
  column_span: 4
  columns: 1
  square: false
  cards:
  - type: custom:layout-card
    grid_options:
      columns: full
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(2, minmax(0, 1fr))
      grid-auto-flow: row
      grid-auto-rows: min-content
      align-items: stretch
      grid-gap: 12px
      margin: 0
    cards:
    - type: custom:button-card
      template: bearstone_mobile_header
      name: Alerts and Status
      icon: mdi:alert-circle-outline
      view_layout:
        grid-column: 1 / -1

    - type: custom:button-card
      template: bearstone_mobile_control
      entity: sensor.infra_dashboard_active_issue_count
      name: Systems
      icon: mdi:server-network
      variables:
        ok_states:
        - '0'
        state_labels:
          '0': ALL CLEAR
        raw_suffix: ACTIVE
        warning_entity_ids:
        - binary_sensor.infra_wan_sustained_degradation
        - binary_sensor.rheem_wh_telemetry_stale
        - binary_sensor.docker_host_maintenance_attention
        - binary_sensor.hvac_maintenance_due
        critical_entity_ids:
        - binary_sensor.infra_wan_critical
        - binary_sensor.infra_dns_pihole_degraded
        - binary_sensor.infra_compute_degraded
        - binary_sensor.infra_storage_degraded
        - binary_sensor.infra_external_monitoring_degraded
      tap_action:
        action: navigate
        navigation_path: /dashboard-infrastructure/home

    - type: custom:button-card
      template: bearstone_mobile_control
      entity: group.entry_points
      name: Entry Points
      icon: mdi:window-closed-variant
      variables:
        ok_states:
        - 'off'
        state_labels:
          'off': SECURE
          'on': OPEN
      tap_action:
        action: navigate
        navigation_path: /lovelace/windows

    - type: custom:button-card
      template: bearstone_mobile_control
      entity: binary_sensor.front_door_packages_present
      name: Packages
      icon: mdi:package-variant-closed
      view_layout:
        grid-column: 1 / -1
      variables:
        ok_states:
        - 'off'
        state_labels:
          'off': CLEAR
          'on': WAITING
      tap_action:
        action: more-info
        entity: camera.frontdoorbell
cards: []
