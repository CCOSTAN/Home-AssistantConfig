# -------------------------------------------------------------------
# Overview Subview - Indoor Lighting
#  Room controls and lamp outlets from existing indoor and bedtime lighting groups.
# -------------------------------------------------------------------
# Notes: Lighting scope follows the indoor/exterior groups and bedtime routines.
# Notes: Tap a named light/group to toggle; hold for brightness/color/details.
# Notes: Reuses existing mobile templates; offline controls remain visible.
######################################################################

path: lights-indoor
title: Indoor Lighting
icon: mdi:lightbulb-group
subview: true
back_path: /lovelace/lights
type: sections
max_columns: 4
dense_section_placement: true
badges: []
sections:
- type: grid
  column_span: 4
  columns: 1
  square: false
  cards:
  - type: custom:layout-card
    grid_options:
      columns: full
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(2, minmax(0, 1fr))
      grid-auto-flow: row
      grid-auto-rows: min-content
      align-items: stretch
      grid-gap: 12px
      margin: 0
      mediaquery:
        '(max-width: 700px)':
          grid-template-columns: repeat(2, minmax(0, 1fr))
    cards:
    - type: custom:button-card
      template: bearstone_mobile_header
      name: Indoor Lights
      icon: mdi:home-lightbulb-outline
      view_layout:
        grid-column: 1 / -1
    - type: custom:button-card
      template: bearstone_nav_back
      name: Back to Lighting
      icon: mdi:arrow-left
      show_state: false
      view_layout:
        grid-column: 1 / -1
      tap_action:
        action: navigate
        navigation_path: /lovelace/lights
