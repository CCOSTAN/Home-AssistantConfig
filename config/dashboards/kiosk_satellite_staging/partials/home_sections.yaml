######################################################################
# @CCOSTAN - Follow Me on X
# For more info visit https://www.vcloudinfo.com/click-here
# Original Repo : https://github.com/CCOSTAN/Home-AssistantConfig
# -------------------------------------------------------------------
# Kiosk Satellite Partial - Ambient kitchen display
#  Enlarged camera feeds plus rotating household reminders, cruise countdown, and locations.
# -------------------------------------------------------------------
# Related Issue: 1890
# Related Issue: 1895
# Notes: Three-row landscape layout uses full-width clock and alert banners around the camera row.
# Notes: Camera cards use automatic streaming to limit idle tablet load.
# Notes: Native Garage and Front Door views take over for their matching live states.
# Notes: Kitchen Show Kiosk Satellite imports the HA camera sources and prefers HLS for native camera playback on Fire/WebView displays.
# Notes: Nearby rain or lightning starts a five-minute NOAA radar view only while the sun is above the horizon.
# Notes: After radar returns to the ambient wall, Storms Approaching offers another five-minute replay from the lower banner.
# Notes: Actionable banner slides open one shared full-screen detail surface and return automatically to the ambient wall.
# Notes: Family detail centers only the selected person and includes the prior 24-hour trail; Phyn detail includes a confirmed main-valve restore action.
# Notes: Rheem problem telemetry adds a red/amber water-heater slide and enriches the existing hot-water detail.
# Notes: The large-format lower panel otherwise mirrors read-only household fact entities.
# Notes: The clock uses oversized time text and places live conditions beneath the current-weather icon.
######################################################################

# Clock and camera wall
- type: grid
  column_span: 4
  columns: 1
  square: false
  cards:
    - type: custom:layout-card
      grid_options:
        columns: full
      layout_type: custom:grid-layout
      layout:
        grid-template-columns: repeat(2, minmax(0, 1fr))
        grid-template-areas: |
          "clock clock"
          "frontlawn driveway"
          "ambient ambient"
        align-items: stretch
        grid-gap: 6px
        margin: 0 36px
        padding: 0
        "--masonry-view-card-margin": 0px
        mediaquery:
          "(max-width: 700px)":
            grid-template-columns: 1fr
            grid-template-areas: |
              "clock"
              "frontlawn"
              "driveway"
              "ambient"
      cards:
        # The established clock-weather-card supplies a live clock; button-card has no minute ticker.
        - type: custom:clock-weather-card
          entity: weather.pirateweather
          sun_entity: sun.sun
          weather_icon_type: fill
          animated_icon: true
          forecast_rows: 3
          locale: en-US
          time_pattern: h:mm
          time_format: 12
          date_pattern: DDDD
          hide_today_section: false
          hide_forecast_section: false
          hide_clock: false
          hide_date: false
          use_browser_time: true
          card_mod:
            style: |
              ha-card {
                display: block !important;
                height: 150px !important;
                padding: 12px 24px !important;
                box-sizing: border-box !important;
                overflow: hidden !important;
              }
              ha-card > div {
                display: grid !important;
                grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr);
                align-items: center;
                gap: 24px;
                height: 126px;
              }
              clock-weather-card-today {
                height: 126px !important;
                position: relative !important;
              }
              clock-weather-card-today-left {
                align-items: flex-start !important;
                justify-content: center !important;
              }
              clock-weather-card-today-left .grow-img {
                width: 96px !important;
                height: 96px !important;
                flex: 0 0 96px !important;
              }
              clock-weather-card-today-right,
              clock-weather-card-today-right-wrap {
                position: static !important;
              }
              clock-weather-card-today-right-wrap {
                height: 126px !important;
                justify-content: center !important;
              }
              clock-weather-card-today-right-wrap-top {
                position: absolute !important;
                left: 0;
                bottom: 3px;
                width: 35% !important;
                height: 24px !important;
                font-size: 18px !important;
                font-weight: 600 !important;
                line-height: 24px !important;
                text-align: center !important;
              }
              clock-weather-card-today-right-wrap-center {
                min-height: 78px !important;
                font-size: 76px !important;
                font-weight: 500 !important;
                line-height: 1 !important;
              }
              clock-weather-card-today-right-wrap-bottom {
                font-size: 16px !important;
                line-height: 20px !important;
              }
              clock-weather-card-forecast {
                max-height: 126px;
                overflow: hidden;
              }
              @media (max-width: 700px) {
                ha-card > div {
                  grid-template-columns: 1fr;
                }
                clock-weather-card-forecast {
                  display: none;
                }
              }
          view_layout:
            grid-area: clock

        # Built-in picture-glance is required because button-card cannot render HA camera streams.
        - type: picture-glance
          title: Driveway
          camera_image: camera.driveway
          camera_view: auto
          aspect_ratio: "21:9"
          entities: []
          view_layout:
            grid-area: driveway

        - type: picture-glance
          title: Front Lawn
          camera_image: camera.frontlawn
          camera_view: auto
          aspect_ratio: "21:9"
          entities: []
          view_layout:
            grid-area: frontlawn

        # CSS animation rotates only the currently relevant, read-only household facts.
        - type: custom:button-card
          show_icon: false
          show_name: false
          show_state: false
          tap_action:
            action: none
          hold_action:
            action: none
          double_tap_action:
            action: none
          triggers_update:
            - binary_sensor.garage_phyn_battery_alert
            - binary_sensor.garage_phyn_freeze_warning_alert
            - binary_sensor.garage_phyn_high_pressure_alert
            - binary_sensor.garage_phyn_leak_alert
            - binary_sensor.garage_phyn_offline_leak_shutoff_alert
            - binary_sensor.garage_phyn_pinhole_leak_alert
            - binary_sensor.garage_phyn_recurring_flow_alert
            - binary_sensor.garage_phyn_temperature_alert
            - valve.phyn_shutoff_valve
            - sensor.phyn_current_water_pressure
            - sensor.phyn_average_water_flow_rate
            - sensor.nws_alerts_alerts
            - group.garage_doors
            - group.entry_points
            - group.locks
            - binary_sensor.front_door_packages_present
            - sensor.rheem_wh_available_hot_water
            - sensor.rheem_wh_alert_count
            - sensor.rheem_wh_diagnostic_status
            - binary_sensor.rheem_wh_problem
            - binary_sensor.rheem_wh_active_alert
            - binary_sensor.rheem_wh_telemetry_stale
            - binary_sensor.rheem_wh_running
            - sensor.rheem_wh_tank_health
            - sensor.rheem_wh_compressor_health
            - water_heater.rheem_wh
            - input_boolean.garbage_cans_out
            - input_datetime.water_delivery_date
            - sensor.water_softener_salt_days_since_last_add
            - sensor.water_softener_salt_average_days_between_refills
            - sensor.spaceship_battery_level
            - switch.spaceship_charge
            - input_datetime.tesla_model_y_last_garage_close
            - input_datetime.tesla_model_y_plug_in_snooze_until
            - sensor.next_booked_cruise_countdown
            - person.carlo
            - person.stacey
            - person.justin
            - person.paige
            - sensor.carlo_location_display
            - sensor.stacey_location_display
            - sensor.justin_location_display
            - sensor.paige_location_display
            - binary_sensor.kiosk_rain_radar_weather_event
            - binary_sensor.kiosk_rain_radar_active
            - timer.kitchen_kiosk_radar_display
            - input_text.kitchen_kiosk_detail_view
            - timer.kitchen_kiosk_detail_display
            - camera.frontdoorbell
          custom_fields:
            ambient: >
              [[[
                const state = (entityId) => states[entityId]?.state;
                const valid = (value) => !['unknown', 'unavailable', 'none', '', undefined].includes(value);
                const pretty = (value) => String(value || 'Unknown').replaceAll('_', ' ');
                const dateKey = (date) => {
                  const year = date.getFullYear();
                  const month = String(date.getMonth() + 1).padStart(2, '0');
                  const day = String(date.getDate()).padStart(2, '0');
                  return `${year}-${month}-${day}`;
                };
                const items = [];
                const now = new Date();
                const detailValue = valid(state('input_text.kitchen_kiosk_detail_view'))
                  ? state('input_text.kitchen_kiosk_detail_view')
                  : 'none';
                const [detailType, detailSubject = ''] = detailValue.split('|');
                const detailActive = state('timer.kitchen_kiosk_detail_display') === 'active' && detailType !== 'none';
                const callScript = (service, data = {}) =>
                  hass.callService('script', service, data);
                const closeDetail = (event) => {
                  event?.stopPropagation();
                  hass.callService('timer', 'cancel', {}, {
                    entity_id: 'timer.kitchen_kiosk_detail_display'
                  });
                };

                const radarWeatherEvent = states['binary_sensor.kiosk_rain_radar_weather_event'];
                const radarDisplayTimer = states['timer.kitchen_kiosk_radar_display'];
                const radarReplayReady =
                  radarWeatherEvent?.state === 'on' &&
                  state('binary_sensor.kiosk_rain_radar_active') !== 'on' &&
                  radarDisplayTimer?.state === 'idle' &&
                  new Date(radarDisplayTimer.last_changed).getTime() >
                    new Date(radarWeatherEvent.last_changed).getTime();
                if (radarReplayReady) {
                  items.push({
                    kicker: 'WEATHER RADAR',
                    title: 'Storms Approaching',
                    detail: 'Tap for radar',
                    icon: 'mdi:radar',
                    accent: '#0288d1',
                    action: {
                      service: 'kitchen_kiosk_show_event',
                      data: {event_type: 'radar'}
                    }
                  });
                }

                const phynAlerts = [
                  'binary_sensor.garage_phyn_battery_alert',
                  'binary_sensor.garage_phyn_freeze_warning_alert',
                  'binary_sensor.garage_phyn_high_pressure_alert',
                  'binary_sensor.garage_phyn_leak_alert',
                  'binary_sensor.garage_phyn_offline_leak_shutoff_alert',
                  'binary_sensor.garage_phyn_pinhole_leak_alert',
                  'binary_sensor.garage_phyn_recurring_flow_alert',
                  'binary_sensor.garage_phyn_temperature_alert'
                ].filter((entityId) => state(entityId) === 'on');
                const phynValveState = state('valve.phyn_shutoff_valve');
                if (phynAlerts.length > 0 || (valid(phynValveState) && phynValveState !== 'open')) {
                  const alertNames = phynAlerts.map((entityId) =>
                    states[entityId]?.attributes?.friendly_name || pretty(entityId.split('.')[1])
                  );
                  items.push({
                    kicker: 'WATER SYSTEM',
                    title: phynValveState === 'closed' ? 'Main water is off' : 'Phyn needs attention',
                    detail: `${alertNames.join(' · ') || `Valve is ${pretty(phynValveState)}`} · Tap for water details`,
                    icon: 'mdi:water-alert-outline',
                    accent: '#c62828',
                    action: {
                      service: 'kitchen_kiosk_show_detail',
                      data: {detail_type: 'phyn'}
                    }
                  });
                }

                const weatherAlertEntity = states['sensor.nws_alerts_alerts'];
                const weatherAlertCount = Number.parseInt(weatherAlertEntity?.state, 10);
                const weatherAlerts = Array.isArray(weatherAlertEntity?.attributes?.Alerts)
                  ? weatherAlertEntity.attributes.Alerts
                  : [];
                const cleanAlertText = (value) => String(value || '').replace(/\s+/g, ' ').trim();
                const alertSection = (description, label) => {
                  const pattern = new RegExp(
                    `\\*\\s*${label}\\.{3}\\s*([\\s\\S]*?)(?=\\n\\s*\\n\\s*\\*\\s*[A-Z ]+\\.{3}|$)`,
                    'i'
                  );
                  return cleanAlertText(String(description || '').match(pattern)?.[1]);
                };
                const limitAlertText = (value, maxLength = 240) => {
                  const text = cleanAlertText(value);
                  if (text.length <= maxLength) return text;
                  return `${text.slice(0, maxLength - 3).replace(/\s+\S*$/, '')}...`;
                };
                const severityOrder = { Extreme: 0, Severe: 1, Moderate: 2, Minor: 3, Unknown: 4 };
                const severityColors = {
                  Extreme: '#b71c1c',
                  Severe: '#c62828',
                  Moderate: '#d84315',
                  Minor: '#f9a825',
                  Unknown: '#546e7a'
                };
                const uniqueWeatherAlerts = weatherAlerts
                  .filter((alert, index, alerts) => {
                    const alertKey = alert.ID || alert.URL || `${alert.Event}|${alert.Expires}`;
                    return alerts.findIndex((candidate) =>
                      (candidate.ID || candidate.URL || `${candidate.Event}|${candidate.Expires}`) === alertKey
                    ) === index;
                  })
                  .sort((left, right) =>
                    (severityOrder[left.Severity] ?? severityOrder.Unknown)
                    - (severityOrder[right.Severity] ?? severityOrder.Unknown)
                  );

                if (uniqueWeatherAlerts.length > 0) {
                  uniqueWeatherAlerts.forEach((alert, index) => {
                    const severity = severityColors[alert.Severity] ? alert.Severity : 'Unknown';
                    const detailParts = [
                      alertSection(alert.Description, 'WHAT'),
                      alertSection(alert.Description, 'WHERE'),
                      alertSection(alert.Description, 'WHEN')
                    ].filter(Boolean);
                    const detail = detailParts.length > 0
                      ? detailParts.join(' · ')
                      : alert.Headline || alert.Description || 'Active National Weather Service alert';
                    const position = uniqueWeatherAlerts.length > 1
                      ? ` ${index + 1}/${uniqueWeatherAlerts.length}`
                      : '';
                    items.push({
                      kicker: `WEATHER ALERT${position} · ${severity.toUpperCase()}`,
                      title: alert.Event || `${weatherAlertCount} active alerts`,
                      detail: limitAlertText(detail),
                      icon: 'mdi:weather-lightning-rainy',
                      accent: severityColors[severity],
                      action: {
                        service: 'kitchen_kiosk_show_detail',
                        data: {
                          detail_type: 'weather',
                          detail_subject: String(alert.ID || index)
                        }
                      }
                    });
                  });
                } else if (Number.isFinite(weatherAlertCount) && weatherAlertCount > 0) {
                  items.push({
                    kicker: 'WEATHER ALERT',
                    title: `${weatherAlertCount} active ${weatherAlertCount === 1 ? 'alert' : 'alerts'}`,
                    detail: 'Alert details are temporarily unavailable',
                    icon: 'mdi:weather-lightning-rainy',
                    accent: severityColors.Unknown,
                    action: {
                      service: 'kitchen_kiosk_show_detail',
                      data: {detail_type: 'weather', detail_subject: '0'}
                    }
                  });
                }

                if (valid(state('group.garage_doors')) && !['closed', 'off'].includes(state('group.garage_doors'))) {
                  const openGarages = ['cover.large_garage_door', 'cover.small_garage_door']
                    .filter((entityId) => valid(state(entityId)) && state(entityId) !== 'closed')
                    .map((entityId) => states[entityId]?.attributes?.friendly_name || pretty(entityId.split('.')[1]));
                  items.push({
                    kicker: 'GARAGE',
                    title: 'Garage door open',
                    detail: openGarages.join(' · ') || 'Check both garage doors',
                    icon: 'mdi:garage-open-variant',
                    accent: '#ef6c00'
                  });
                }

                if (state('group.entry_points') === 'on') {
                  const openEntries = (states['group.entry_points']?.attributes?.entity_id || [])
                    .filter((entityId) => state(entityId) === 'on')
                    .map((entityId) => states[entityId]?.attributes?.friendly_name || pretty(entityId.split('.')[1]));
                  const extraCount = Math.max(0, openEntries.length - 3);
                  const entryDetail = openEntries.slice(0, 3).join(' · ') + (extraCount ? ` · +${extraCount} more` : '');
                  items.push({
                    kicker: 'ENTRY POINT',
                    title: openEntries.length === 1 ? 'Door or window open' : `${openEntries.length} openings detected`,
                    detail: entryDetail || 'Check the exterior doors and windows',
                    icon: 'mdi:door-open',
                    accent: '#ef6c00',
                    action: {
                      service: 'kitchen_kiosk_show_detail',
                      data: {detail_type: 'entry_points'}
                    }
                  });
                }

                if (valid(state('group.locks')) && state('group.locks') !== 'locked') {
                  items.push({
                    kicker: 'SECURITY',
                    title: 'Check the front door lock',
                    detail: `Lock group is ${pretty(state('group.locks'))}`,
                    icon: 'mdi:lock-alert-outline',
                    accent: '#c62828'
                  });
                }

                if (state('binary_sensor.front_door_packages_present') === 'on') {
                  items.push({
                    kicker: 'FRONT DOOR',
                    title: 'Package waiting',
                    detail: 'Tap for the front door view',
                    icon: 'mdi:package-variant-closed',
                    accent: '#8e5a2b',
                    action: {
                      service: 'kitchen_kiosk_show_detail',
                      data: {detail_type: 'package'}
                    }
                  });
                }

                const rheemAlertCount = Number.parseInt(state('sensor.rheem_wh_alert_count'), 10);
                const rheemStatus = state('sensor.rheem_wh_diagnostic_status');
                const rheemProblem = state('binary_sensor.rheem_wh_problem') === 'on';
                if (rheemProblem) {
                  const activeAlert = state('binary_sensor.rheem_wh_active_alert') === 'on';
                  const telemetryStale = state('binary_sensor.rheem_wh_telemetry_stale') === 'on';
                  items.push({
                    kicker: telemetryStale && !activeAlert ? 'WATER HEATER TELEMETRY' : 'WATER HEATER ALERT',
                    title: activeAlert && Number.isFinite(rheemAlertCount)
                      ? `${rheemAlertCount} active ${rheemAlertCount === 1 ? 'alert' : 'alerts'}`
                      : `Rheem status: ${pretty(rheemStatus)}`,
                    detail: telemetryStale
                      ? 'EcoNet data has been unavailable for 10 minutes · Tap for diagnostics'
                      : 'Home Assistant Repairs has the diagnostic snapshot · Tap for details',
                    icon: 'mdi:water-boiler-alert',
                    accent: telemetryStale && !activeAlert ? '#ef6c00' : '#c62828',
                    action: {
                      service: 'kitchen_kiosk_show_detail',
                      data: {detail_type: 'hot_water'}
                    }
                  });
                }

                const hotWater = Number.parseFloat(state('sensor.rheem_wh_available_hot_water'));
                if (!rheemProblem && Number.isFinite(hotWater) && hotWater < 30) {
                  items.push({
                    kicker: 'HOT WATER',
                    title: 'Hot water is running low',
                    detail: `${Math.round(hotWater)}% available · Tap for recovery details`,
                    icon: 'mdi:water-thermometer-outline',
                    accent: '#0277bd',
                    action: {
                      service: 'kitchen_kiosk_show_detail',
                      data: {detail_type: 'hot_water'}
                    }
                  });
                }

                const weekday = now.toLocaleDateString('en-US', {weekday: 'short'});
                if (['Wed', 'Sun'].includes(weekday) && state('input_boolean.garbage_cans_out') !== 'on') {
                  items.push({
                    kicker: 'TODAY',
                    title: weekday === 'Wed' ? 'Garbage + recycling day' : 'Garbage day',
                    detail: 'Put the cans at the curb',
                    icon: 'mdi:trash-can-outline',
                    accent: '#2e7d32'
                  });
                }

                const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
                if (state('input_datetime.water_delivery_date') === dateKey(tomorrow)) {
                  items.push({
                    kicker: 'WATER DELIVERY TOMORROW',
                    title: 'Put the bottles out',
                    detail: 'Stage them before leaving the house',
                    icon: 'mdi:bottle-soda-classic-outline',
                    accent: '#0277bd'
                  });
                }

                const battery = Number.parseFloat(state('sensor.spaceship_battery_level'));
                const lastClose = new Date(String(state('input_datetime.tesla_model_y_last_garage_close')).replace(' ', 'T'));
                const snoozeUntil = new Date(String(state('input_datetime.tesla_model_y_plug_in_snooze_until')).replace(' ', 'T'));
                const recentArrival = Number.isFinite(lastClose.getTime()) && (now.getTime() - lastClose.getTime()) < 43200000;
                const snoozeExpired = !Number.isFinite(snoozeUntil.getTime()) || snoozeUntil <= now;
                if (
                  Number.isFinite(battery) && battery < 50 && recentArrival && snoozeExpired &&
                  state('switch.spaceship_charge') === 'off' &&
                  state('person.carlo') === 'home' && state('person.stacey') === 'home'
                ) {
                  items.push({
                    kicker: 'MODEL Y',
                    title: 'Plug in the Tesla',
                    detail: `${Math.round(battery)}% battery after the latest garage arrival`,
                    icon: 'mdi:ev-plug-tesla',
                    accent: '#c62828'
                  });
                }

                const saltDays = Number.parseFloat(state('sensor.water_softener_salt_days_since_last_add'));
                const saltAverage = Number.parseFloat(state('sensor.water_softener_salt_average_days_between_refills'));
                if (
                  Number.isFinite(saltDays) && Number.isFinite(saltAverage) && saltAverage > 0 &&
                  saltDays >= saltAverage * 0.9
                ) {
                  items.push({
                    kicker: 'WATER SOFTENER',
                    title: 'Salt refill coming due',
                    detail: `${Math.round(saltDays)} days since the last refill`,
                    icon: 'mdi:shaker-outline',
                    accent: '#00838f'
                  });
                }

                const cruiseDays = Number.parseInt(state('sensor.next_booked_cruise_countdown'), 10);
                const cruiseEntity = states['sensor.next_booked_cruise_countdown'];
                const cruiseShip = String(cruiseEntity?.attributes?.ship || '').trim();
                const cruiseDate = String(cruiseEntity?.attributes?.sail_date || '').trim();
                if (Number.isInteger(cruiseDays) && cruiseDays >= 0 && cruiseShip && cruiseDate) {
                  const sailDate = new Date(`${cruiseDate}T12:00:00`);
                  const sailLabel = Number.isFinite(sailDate.getTime())
                    ? sailDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
                    : cruiseDate;
                  const cruiseNights = Number.parseInt(cruiseEntity?.attributes?.nights, 10);
                  const cruisePort = String(cruiseEntity?.attributes?.port || '').trim();
                  const detail = [
                    `Departs ${sailLabel}`,
                    Number.isInteger(cruiseNights) && cruiseNights > 0
                      ? `${cruiseNights} ${cruiseNights === 1 ? 'night' : 'nights'}`
                      : '',
                    cruisePort
                  ].filter(Boolean).join(' · ');
                  items.push({
                    kicker: 'NEXT BOOKED CRUISE',
                    title: cruiseDays === 0
                      ? `${cruiseShip} sails today`
                      : `${cruiseDays} ${cruiseDays === 1 ? 'day' : 'days'} until ${cruiseShip}`,
                    detail,
                    icon: 'mdi:ferry',
                    accent: '#00838f'
                  });
                }

                [
                  ['Carlo', 'person.carlo', 'sensor.carlo_location_display'],
                  ['Stacey', 'person.stacey', 'sensor.stacey_location_display'],
                  ['Justin', 'person.justin', 'sensor.justin_location_display'],
                  ['Paige', 'person.paige', 'sensor.paige_location_display']
                ].forEach(([name, personId, locationId]) => {
                  const personState = state(personId);
                  if (valid(personState) && personState !== 'home') {
                    const locationEntity = states[locationId];
                    const rawLocation = pretty(valid(state(locationId)) ? state(locationId) : personState);
                    const withoutName = rawLocation.replace(new RegExp(`^${name}\\s+`, 'i'), '');
                    const sinceMatch = withoutName.match(/\s*\(since\s+([^)]+)\)\s*$/i);
                    const location = withoutName.replace(/\s*\(since\s+[^)]+\)\s*$/i, '').trim();
                    const changedAt = new Date(locationEntity?.last_changed || states[personId]?.last_changed);
                    const since = sinceMatch?.[1] || (
                      Number.isFinite(changedAt.getTime())
                        ? changedAt.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })
                        : 'recently'
                    );
                    items.push({
                      kicker: 'FAMILY LOCATION',
                      title: `${name} - ${location || pretty(personState)}`,
                      detail: `Since ${since}`,
                      icon: 'mdi:map-marker-account-outline',
                      accent: '#6a1b9a',
                      action: {
                        service: 'kitchen_kiosk_show_detail',
                        data: {detail_type: 'family', detail_subject: personId}
                      }
                    });
                  }
                });

                if (items.length === 0) {
                  items.push({
                    kicker: 'HOUSEHOLD',
                    title: 'Everything is handled',
                    detail: 'Everyone is home and there are no active reminders',
                    icon: 'mdi:check-circle-outline',
                    accent: '#2e7d32'
                  });
                }

                const formatSince = (entity) => {
                  const changed = new Date(entity?.last_changed);
                  if (!Number.isFinite(changed.getTime())) return 'recently';
                  const minutes = Math.max(0, Math.floor((Date.now() - changed.getTime()) / 60000));
                  if (minutes < 1) return 'just now';
                  if (minutes < 60) return `${minutes} min ago`;
                  const hours = Math.floor(minutes / 60);
                  return `${hours} hr${hours === 1 ? '' : 's'} ago`;
                };
                const renderDetail = () => {
                  let kicker = 'HOUSEHOLD DETAIL';
                  let title = 'Current status';
                  let icon = 'mdi:information-outline';
                  let body = html`<div class="kitchen-detail-message">This detail is no longer active.</div>`;

                  if (detailType === 'weather') {
                    const alert = uniqueWeatherAlerts.find((candidate, index) =>
                      String(candidate.ID || index) === detailSubject
                    ) || uniqueWeatherAlerts[0];
                    kicker = `NWS WEATHER ALERT · ${String(alert?.Severity || 'Unknown').toUpperCase()}`;
                    title = alert?.Event || 'Weather alert';
                    icon = 'mdi:weather-lightning-rainy';
                    if (alert) {
                      const sections = [
                        ['WHAT', alertSection(alert.Description, 'WHAT')],
                        ['WHERE', alertSection(alert.Description, 'WHERE')],
                        ['WHEN', alertSection(alert.Description, 'WHEN')],
                        ['IMPACTS', alertSection(alert.Description, 'IMPACTS')]
                      ].filter(([, value]) => value);
                      const instructions = limitAlertText(alert.Instruction, 220);
                      body = html`
                        <div class="kitchen-detail-weather-headline">${cleanAlertText(alert.Headline)}</div>
                        <div class="kitchen-detail-grid weather">
                          ${sections.map(([label, value]) => html`
                            <div class="kitchen-detail-tile">
                              <div class="kitchen-detail-label">${label}</div>
                              <div class="kitchen-detail-value">${value}</div>
                            </div>
                          `)}
                        </div>
                        ${instructions ? html`
                          <div class="kitchen-detail-instructions">
                            <strong>STAY SAFE</strong> · ${instructions}
                          </div>
                        ` : ''}
                      `;
                    }
                  } else if (detailType === 'package') {
                    const camera = states['camera.frontdoorbell'];
                    const packageEntity = states['binary_sensor.front_door_packages_present'];
                    const picture = String(camera?.attributes?.entity_picture || '');
                    kicker = 'FRONT DOOR';
                    title = 'Package waiting';
                    icon = 'mdi:package-variant-closed';
                    body = html`
                      <div class="kitchen-detail-camera">
                        ${picture ? html`<img src="${picture}${picture.includes('?') ? '&' : '?'}kiosk=${Date.now()}" alt="Front door camera">` : ''}
                        <div class="kitchen-detail-camera-caption">
                          Last checked ${packageEntity?.attributes?.last_run || 'recently'}
                        </div>
                      </div>
                    `;
                  } else if (detailType === 'family') {
                    const person = states[detailSubject];
                    const locationEntityId = {
                      'person.carlo': 'sensor.carlo_location_display',
                      'person.stacey': 'sensor.stacey_location_display',
                      'person.justin': 'sensor.justin_location_display',
                      'person.paige': 'sensor.paige_location_display'
                    }[detailSubject];
                    const personName = person?.attributes?.friendly_name || pretty(detailSubject.split('.')[1]);
                    const rawLocation = pretty(state(locationEntityId));
                    const withoutName = rawLocation.replace(new RegExp(`^${personName}\s+`, 'i'), '');
                    const location = withoutName.replace(/\s*\(since\s+[^)]+\)\s*$/i, '').trim();
                    kicker = 'FAMILY LOCATION';
                    title = `${personName} · ${location || pretty(person?.state)}`;
                    icon = 'mdi:map-marker-account-outline';
                    body = html`<div class="kitchen-detail-map-caption">Updated ${formatSince(person)} · 24-hour trail</div>`;
                  } else if (detailType === 'entry_points') {
                    const openEntries = (states['group.entry_points']?.attributes?.entity_id || [])
                      .map((entityId) => states[entityId])
                      .filter((entry) => entry?.state === 'on');
                    kicker = 'ENTRY POINTS';
                    title = `${openEntries.length} ${openEntries.length === 1 ? 'opening' : 'openings'} detected`;
                    icon = 'mdi:door-open';
                    body = html`
                      <div class="kitchen-detail-grid entries">
                        ${openEntries.map((entry) => html`
                          <div class="kitchen-detail-tile entry">
                            <ha-icon icon="mdi:door-open"></ha-icon>
                            <div>
                              <div class="kitchen-detail-entry-name">${entry.attributes?.friendly_name || 'Open entry'}</div>
                              <div class="kitchen-detail-entry-since">Open ${formatSince(entry)}</div>
                            </div>
                          </div>
                        `)}
                      </div>
                    `;
                  } else if (detailType === 'phyn') {
                    const valveState = state('valve.phyn_shutoff_valve');
                    const flow = Number.parseFloat(state('sensor.phyn_average_water_flow_rate'));
                    const pressure = Number.parseFloat(state('sensor.phyn_current_water_pressure'));
                    const alerts = phynAlerts.map((entityId) =>
                      states[entityId]?.attributes?.friendly_name || pretty(entityId.split('.')[1])
                    );
                    kicker = 'PHYN WATER SYSTEM';
                    title = valveState === 'closed' ? 'Main water is off' : 'Water system needs attention';
                    icon = 'mdi:water-alert-outline';
                    body = html`
                      <div class="kitchen-detail-grid metrics">
                        <div class="kitchen-detail-metric">
                          <span>MAIN VALVE</span><strong>${pretty(valveState)}</strong>
                        </div>
                        <div class="kitchen-detail-metric">
                          <span>FLOW</span><strong>${Number.isFinite(flow) ? `${flow.toFixed(1)} gal/min` : 'Unknown'}</strong>
                        </div>
                        <div class="kitchen-detail-metric">
                          <span>PRESSURE</span><strong>${Number.isFinite(pressure) ? `${pressure.toFixed(0)} psi` : 'Unknown'}</strong>
                        </div>
                      </div>
                      <div class="kitchen-detail-alert-list">
                        ${alerts.length ? alerts.join(' · ') : 'No active Phyn alert text is available.'}
                      </div>
                      ${valveState === 'closed' ? html`
                        <button
                          class="kitchen-detail-water-button"
                          @click=${(event) => {
                            event.stopPropagation();
                            if (window.confirm('Turn the Phyn main water supply ON? Confirm the leak is safe first.')) {
                              callScript('kitchen_kiosk_restore_phyn_water');
                            }
                          }}
                        >TURN WATER ON</button>
                      ` : html`<div class="kitchen-detail-safe-state">Main water is ${pretty(valveState)}</div>`}
                    `;
                  } else if (detailType === 'hot_water') {
                    const available = Number.parseFloat(state('sensor.rheem_wh_available_hot_water'));
                    const alertCount = Number.parseInt(state('sensor.rheem_wh_alert_count'), 10);
                    const diagnosticStatus = state('sensor.rheem_wh_diagnostic_status');
                    const rheemProblem = state('binary_sensor.rheem_wh_problem') === 'on';
                    const heater = states['water_heater.rheem_wh'];
                    const running = state('binary_sensor.rheem_wh_running') === 'on';
                    const target = Number.parseFloat(heater?.attributes?.temperature);
                    const mode = pretty(heater?.attributes?.operation_mode || heater?.state);
                    const tankHealth = Number.parseFloat(state('sensor.rheem_wh_tank_health'));
                    const compressorHealth = Number.parseFloat(state('sensor.rheem_wh_compressor_health'));
                    kicker = rheemProblem ? 'WATER HEATER ALERT' : 'HOT WATER RECOVERY';
                    title = rheemProblem && Number.isFinite(alertCount) && alertCount > 0
                      ? `${alertCount} active ${alertCount === 1 ? 'alert' : 'alerts'}`
                      : (running ? 'Heating now' : 'Standing by');
                    icon = rheemProblem ? 'mdi:water-boiler-alert' : 'mdi:water-boiler';
                    body = html`
                      <div class="kitchen-detail-hot-water">
                        <div class="kitchen-detail-hot-percent">${Number.isFinite(available) ? Math.round(available) : '--'}<span>%</span></div>
                        <div class="kitchen-detail-hot-label">HOT WATER AVAILABLE</div>
                        <div class="kitchen-detail-grid metrics hot">
                          <div class="kitchen-detail-metric"><span>MODE</span><strong>${mode}</strong></div>
                          <div class="kitchen-detail-metric"><span>TARGET</span><strong>${Number.isFinite(target) ? `${Math.round(target)}°F` : 'Unknown'}</strong></div>
                          <div class="kitchen-detail-metric"><span>TANK HEALTH</span><strong>${Number.isFinite(tankHealth) ? `${Math.round(tankHealth)}%` : 'Unknown'}</strong></div>
                          <div class="kitchen-detail-metric"><span>COMPRESSOR</span><strong>${Number.isFinite(compressorHealth) ? `${Math.round(compressorHealth)}%` : 'Unknown'}</strong></div>
                        </div>
                        ${rheemProblem ? html`
                          <div class="kitchen-detail-alert-list">
                            STATUS: ${pretty(diagnosticStatus)} · ACTIVE ALERTS: ${Number.isFinite(alertCount) ? alertCount : 'Unknown'} · Check Repairs or the Rheem message for the vendor error text.
                          </div>
                        ` : ''}
                      </div>
                    `;
                  }

                  return html`
                    <div class="kitchen-detail-overlay ${detailType === 'family' ? 'family' : ''}" @click=${(event) => event.stopPropagation()}>
                      <div class="kitchen-detail-header">
                        <div class="kitchen-detail-header-icon"><ha-icon .icon=${icon}></ha-icon></div>
                        <div class="kitchen-detail-header-copy">
                          <div class="kitchen-detail-kicker">${kicker}</div>
                          <div class="kitchen-detail-title">${title}</div>
                        </div>
                        <button class="kitchen-detail-close" @click=${closeDetail} aria-label="Return to dashboard">×</button>
                      </div>
                      <div class="kitchen-detail-body">${body}</div>
                    </div>
                  `;
                };

                const secondsPerSlide = 10;
                const duration = items.length * secondsPerSlide;
                const phase = Math.floor(now.getTime() / 1000) % duration;
                const slot = 100 / items.length;
                const fade = Math.min(4, slot * 0.18);
                const handleAmbientTap = (event) => {
                  const visibleSlides = [...event.currentTarget.querySelectorAll('.kitchen-ambient-slide')]
                    .map((slide, index) => ({
                      index,
                      opacity: Number.parseFloat(getComputedStyle(slide).opacity) || 0
                    }))
                    .sort((left, right) => right.opacity - left.opacity);
                  const activeItem = items[visibleSlides[0]?.index ?? 0] || items[0];
                  if (!activeItem?.action) return;
                  event.stopPropagation();
                  callScript(activeItem.action.service, activeItem.action.data);
                };
                return html`
                  <style>
                    @keyframes kitchen-ambient-cycle {
                      0% { opacity: 0; transform: translateY(12px); }
                      ${fade}% { opacity: 1; transform: translateY(0); }
                      ${slot - fade}% { opacity: 1; transform: translateY(0); }
                      ${slot}% { opacity: 0; transform: translateY(-12px); }
                      100% { opacity: 0; transform: translateY(-12px); }
                    }
                    .kitchen-ambient-rotator {
                      position: relative;
                      width: 100%;
                      height: 100%;
                      cursor: pointer;
                    }
                    .kitchen-ambient-slide {
                      position: absolute;
                      inset: 0;
                      display: grid;
                      grid-template-columns: 132px minmax(0, 1fr);
                      grid-template-areas: 'icon copy';
                      align-items: center;
                      gap: 30px;
                      padding: 2px 36px;
                      box-sizing: border-box;
                      opacity: 0;
                      animation-name: kitchen-ambient-cycle;
                      animation-timing-function: linear;
                      animation-iteration-count: infinite;
                    }
                    .kitchen-ambient-slide.single {
                      opacity: 1;
                      animation: none;
                    }
                    .kitchen-ambient-icon {
                      grid-area: icon;
                      display: grid;
                      place-items: center;
                      width: 112px;
                      height: 112px;
                      border-radius: 28px;
                      color: var(--accent);
                      background: color-mix(in srgb, var(--accent) 14%, transparent);
                    }
                    .kitchen-ambient-icon ha-icon { --mdc-icon-size: 72px; }
                    .kitchen-ambient-copy {
                      grid-area: copy;
                      min-width: 0;
                      text-align: left;
                    }
                    .kitchen-ambient-kicker {
                      color: var(--accent);
                      font-size: 24px;
                      font-weight: 800;
                      line-height: 1.1;
                      letter-spacing: 0.1em;
                    }
                    .kitchen-ambient-title {
                      margin-top: 6px;
                      color: var(--primary-text-color);
                      font-size: var(--title-size, 52px);
                      font-weight: 700;
                      line-height: 1.02;
                      display: -webkit-box;
                      -webkit-box-orient: vertical;
                      -webkit-line-clamp: 2;
                      white-space: normal;
                      overflow-wrap: anywhere;
                      overflow: hidden;
                    }
                    .kitchen-ambient-detail {
                      margin-top: 6px;
                      color: var(--secondary-text-color);
                      font-size: 40px;
                      font-weight: 600;
                      line-height: 1.08;
                      display: -webkit-box;
                      -webkit-box-orient: vertical;
                      -webkit-line-clamp: 3;
                      white-space: normal;
                      overflow-wrap: anywhere;
                      overflow: hidden;
                    }
                    .kitchen-detail-overlay {
                      position: fixed;
                      inset: 0;
                      z-index: 10000;
                      box-sizing: border-box;
                      padding: 22px 36px;
                      color: #f3f6fb;
                      background: radial-gradient(circle at top right, #172235 0%, #080e16 55%);
                      overflow: hidden;
                      text-align: left;
                    }
                    .kitchen-detail-overlay.family {
                      background: transparent;
                      pointer-events: none;
                    }
                    .kitchen-detail-overlay.family .kitchen-detail-header {
                      padding: 12px 18px;
                      border: 1px solid rgba(255,255,255,0.18);
                      border-radius: 20px;
                      background: rgba(8,14,22,0.92);
                      box-shadow: 0 10px 28px rgba(0,0,0,0.45);
                      pointer-events: auto;
                    }
                    .kitchen-detail-overlay.family .kitchen-detail-body {
                      pointer-events: none;
                    }
                    .kitchen-detail-header {
                      display: grid;
                      grid-template-columns: 76px minmax(0, 1fr) 68px;
                      align-items: center;
                      gap: 20px;
                      min-height: 100px;
                      padding-bottom: 18px;
                      border-bottom: 2px solid rgba(255,255,255,0.16);
                    }
                    .kitchen-detail-header-icon {
                      display: grid;
                      place-items: center;
                      width: 72px;
                      height: 72px;
                      border-radius: 20px;
                      color: #4fc3f7;
                      background: rgba(79,195,247,0.14);
                    }
                    .kitchen-detail-header-icon ha-icon { --mdc-icon-size: 48px; }
                    .kitchen-detail-kicker {
                      color: #4fc3f7;
                      font-size: 22px;
                      font-weight: 800;
                      letter-spacing: 0.1em;
                    }
                    .kitchen-detail-title {
                      margin-top: 4px;
                      font-size: 48px;
                      font-weight: 750;
                      line-height: 1;
                      overflow: hidden;
                      text-overflow: ellipsis;
                      white-space: nowrap;
                    }
                    .kitchen-detail-close {
                      width: 64px;
                      height: 64px;
                      border: 2px solid rgba(255,255,255,0.25);
                      border-radius: 20px;
                      color: #fff;
                      background: rgba(255,255,255,0.08);
                      font-size: 46px;
                      line-height: 52px;
                    }
                    .kitchen-detail-body {
                      height: calc(100vh - 164px);
                      padding-top: 18px;
                      box-sizing: border-box;
                      overflow: hidden;
                    }
                    .kitchen-detail-weather-headline {
                      margin-bottom: 14px;
                      color: #ffca70;
                      font-size: 24px;
                      font-weight: 700;
                      line-height: 1.15;
                      white-space: normal;
                      display: -webkit-box;
                      -webkit-box-orient: vertical;
                      -webkit-line-clamp: 2;
                      overflow: hidden;
                    }
                    .kitchen-detail-grid {
                      display: grid;
                      gap: 14px;
                    }
                    .kitchen-detail-grid.weather { grid-template-columns: repeat(2, minmax(0, 1fr)); }
                    .kitchen-detail-grid.entries { grid-template-columns: repeat(3, minmax(0, 1fr)); }
                    .kitchen-detail-grid.metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); }
                    .kitchen-detail-grid.metrics.hot { grid-template-columns: repeat(4, minmax(0, 1fr)); }
                    .kitchen-detail-tile,
                    .kitchen-detail-metric {
                      padding: 18px 22px;
                      border: 1px solid rgba(255,255,255,0.14);
                      border-radius: 18px;
                      background: rgba(255,255,255,0.06);
                      overflow: hidden;
                    }
                    .kitchen-detail-label,
                    .kitchen-detail-metric span,
                    .kitchen-detail-hot-label {
                      color: #7fd7ff;
                      font-size: 20px;
                      font-weight: 800;
                      letter-spacing: 0.08em;
                    }
                    .kitchen-detail-value {
                      margin-top: 7px;
                      font-size: 23px;
                      font-weight: 600;
                      line-height: 1.18;
                      white-space: normal;
                      overflow-wrap: anywhere;
                      display: -webkit-box;
                      -webkit-box-orient: vertical;
                      -webkit-line-clamp: 3;
                      overflow: hidden;
                    }
                    .kitchen-detail-instructions,
                    .kitchen-detail-alert-list,
                    .kitchen-detail-safe-state {
                      margin-top: 16px;
                      padding: 17px 22px;
                      border-radius: 18px;
                      background: rgba(255,193,7,0.12);
                      font-size: 22px;
                      font-weight: 600;
                      line-height: 1.2;
                      white-space: normal;
                      overflow-wrap: anywhere;
                      display: -webkit-box;
                      -webkit-box-orient: vertical;
                      -webkit-line-clamp: 2;
                      overflow: hidden;
                    }
                    .kitchen-detail-tile.entry {
                      display: grid;
                      grid-template-columns: 48px 1fr;
                      align-items: center;
                      gap: 14px;
                    }
                    .kitchen-detail-tile.entry ha-icon { --mdc-icon-size: 42px; color: #ffb74d; }
                    .kitchen-detail-entry-name { font-size: 28px; font-weight: 700; }
                    .kitchen-detail-entry-since { margin-top: 4px; color: #aeb9c8; font-size: 22px; }
                    .kitchen-detail-metric span { display: block; }
                    .kitchen-detail-metric strong {
                      display: block;
                      margin-top: 10px;
                      font-size: 38px;
                      line-height: 1.05;
                    }
                    .kitchen-detail-camera {
                      position: relative;
                      width: 100%;
                      height: 100%;
                      overflow: hidden;
                      border-radius: 20px;
                      background: #03070b;
                    }
                    .kitchen-detail-camera img {
                      width: 100%;
                      height: 100%;
                      object-fit: contain;
                    }
                    .kitchen-detail-camera-caption,
                    .kitchen-detail-map-caption {
                      position: absolute;
                      left: 22px;
                      bottom: 20px;
                      padding: 12px 18px;
                      border-radius: 14px;
                      color: #fff;
                      background: rgba(0,0,0,0.72);
                      font-size: 26px;
                      font-weight: 700;
                    }
                    .kitchen-detail-map-caption {
                      z-index: 10002;
                      pointer-events: none;
                    }
                    .kitchen-detail-water-button {
                      display: block;
                      width: 100%;
                      margin-top: 20px;
                      padding: 24px;
                      border: 3px solid #29b6f6;
                      border-radius: 20px;
                      color: #fff;
                      background: #0277bd;
                      font-size: 36px;
                      font-weight: 800;
                    }
                    .kitchen-detail-safe-state {
                      color: #b9f6ca;
                      background: rgba(76,175,80,0.16);
                    }
                    .kitchen-detail-hot-water { text-align: center; }
                    .kitchen-detail-hot-percent {
                      margin-top: 4px;
                      font-size: 170px;
                      font-weight: 750;
                      line-height: 0.92;
                    }
                    .kitchen-detail-hot-percent span { font-size: 78px; }
                    .kitchen-detail-hot-label { margin: 8px 0 24px; }
                    .kitchen-detail-message {
                      display: grid;
                      place-items: center;
                      height: 100%;
                      font-size: 38px;
                      font-weight: 700;
                    }
                  </style>
                  <div class="kitchen-ambient-rotator" @click=${handleAmbientTap}>
                    ${items.map((item, index) => html`
                      <div
                        class="kitchen-ambient-slide ${items.length === 1 ? 'single' : ''}"
                        style="--accent:${item.accent};--title-size:${String(item.title || '').length > 58 ? '40px' : String(item.title || '').length > 38 ? '46px' : '52px'};animation-duration:${duration}s;animation-delay:${index * secondsPerSlide - phase}s"
                      >
                        <div class="kitchen-ambient-icon"><ha-icon .icon=${item.icon}></ha-icon></div>
                        <div class="kitchen-ambient-copy">
                          <div class="kitchen-ambient-kicker">${item.kicker}</div>
                          <div class="kitchen-ambient-title">${item.title}</div>
                          <div class="kitchen-ambient-detail">${item.detail}</div>
                        </div>
                      </div>
                    `)}
                  </div>
                  ${detailActive ? renderDetail() : ''}
                `;
              ]]]
          styles:
            card:
              - height: 235px
              - padding: 0
              - overflow: hidden
              - border-radius: 18px
              - background: linear-gradient(120deg, rgba(33, 150, 243, 0.08), rgba(103, 58, 183, 0.08))
            grid:
              - grid-template-areas: '"ambient"'
              - grid-template-columns: 1fr
              - grid-template-rows: 1fr
            custom_fields:
              ambient:
                - width: 100%
                - height: 100%
                - pointer-events: auto
          view_layout:
            grid-area: ambient

        # Core map cards are required because only HA's history subscription can render Recorder-backed trails.
        - type: conditional
          conditions:
            - &kitchen_family_detail_timer_active
              entity: timer.kitchen_kiosk_detail_display
              state: active
            - entity: input_text.kitchen_kiosk_detail_view
              state: "family|person.carlo"
          card:
            type: map
            entities:
              - person.carlo
            hours_to_show: 24
            theme_mode: dark
            card_mod:
              style: &kitchen_family_history_map_style |
                ha-card {
                  position: fixed !important;
                  inset: 0 !important;
                  z-index: 9999 !important;
                  width: 100vw !important;
                  height: 100vh !important;
                  margin: 0 !important;
                  border: 0 !important;
                  border-radius: 0 !important;
                  background: #03070b !important;
                }
                #root {
                  height: 100vh !important;
                  padding-bottom: 0 !important;
                }
                #buttons {
                  top: 145px !important;
                }
          view_layout:
            grid-area: 1 / 1 / 4 / 3

        - type: conditional
          conditions:
            - *kitchen_family_detail_timer_active
            - entity: input_text.kitchen_kiosk_detail_view
              state: "family|person.stacey"
          card:
            type: map
            entities:
              - person.stacey
            hours_to_show: 24
            theme_mode: dark
            card_mod:
              style: *kitchen_family_history_map_style
          view_layout:
            grid-area: 1 / 1 / 4 / 3

        - type: conditional
          conditions:
            - *kitchen_family_detail_timer_active
            - entity: input_text.kitchen_kiosk_detail_view
              state: "family|person.justin"
          card:
            type: map
            entities:
              - person.justin
            hours_to_show: 24
            theme_mode: dark
            card_mod:
              style: *kitchen_family_history_map_style
          view_layout:
            grid-area: 1 / 1 / 4 / 3

        - type: conditional
          conditions:
            - *kitchen_family_detail_timer_active
            - entity: input_text.kitchen_kiosk_detail_view
              state: "family|person.paige"
          card:
            type: map
            entities:
              - person.paige
            hours_to_show: 24
            theme_mode: dark
            card_mod:
              style: *kitchen_family_history_map_style
          view_layout:
            grid-area: 1 / 1 / 4 / 3

        # NOAA is the single radar path; native Kiosk Satellite camera overlays retain priority.
        - type: conditional
          conditions:
            - entity: binary_sensor.kiosk_rain_radar_active
              state: "on"
          card:
            type: custom:weather-radar-card
            data_source: NOAA
            map_style: Dark
            zoom_level: 7
            past_minutes: 20
            frame_stride_minutes: 5
            frame_delay: 650
            restart_delay: 1400
            smooth_animation: true
            smooth_overlap: 0
            motion_compensation: false
            static_map: true
            double_tap_action: none
            show_zoom: false
            show_playback: false
            show_recenter: false
            show_scale: true
            show_range: false
            show_color_bar: true
            show_progress_bar: true
            show_loading_spinner: true
            show_alerts: false
            show_lightning: false
            height: 560px
            width: 100%
          view_layout:
            grid-area: 1 / 1 / 4 / 3
