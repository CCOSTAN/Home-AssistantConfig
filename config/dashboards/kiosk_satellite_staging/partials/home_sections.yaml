# Kiosk Satellite Partial - Ambient kitchen display
# Related Issue: 1926
#  Enlarged camera feeds plus rotating household reminders, bowling results, cruise countdown, and locations.
# -------------------------------------------------------------------
# Related Issue: 1890
# Related Issue: 1895
# Notes: Three-row landscape layout uses full-width clock and alert banners around the camera row.
# Notes: Camera cards use automatic streaming to limit idle tablet load.
# Notes: Native Garage and Front Door views take over for their matching live states.
# Notes: Driveway alerts use a full-view live card until occupancy clears or ten minutes elapse.
# Notes: Kitchen Show Kiosk Satellite imports the HA camera sources and prefers HLS for native camera playback on Fire/WebView displays.
# Notes: Nearby rain or lightning starts a five-minute NOAA radar view only while the sun is above the horizon.
# Notes: After radar returns to the ambient wall, Storms Approaching offers another five-minute replay from the lower banner.
# Notes: Actionable banner slides open one shared full-screen detail surface and return automatically to the ambient wall.
# Notes: The idle event layer passes taps through to the banner; active overlay cards handle their own input.
# Notes: Family detail centers only the selected person and includes the prior 24-hour trail; Phyn detail includes a confirmed main-valve restore action.
# Notes: Rheem problem telemetry adds a red/amber water-heater slide and enriches the existing hot-water detail.
# Notes: New LeagueSecretary results add Carlo and Stacey slides for 48 hours; other bowlers stay out of the kiosk payload.
# Notes: Verified Health Coach personal bests add Carlo and Stacey slides for seven days.
# Notes: Sink unavailable adds a wall-switch reminder that clears when the light reconnects.
# Notes: The large-format lower panel otherwise mirrors read-only household fact entities.
# Notes: The clock uses oversized time text and places live conditions beneath the current-weather icon.
######################################################################

# Clock and camera wall
- type: grid
  column_span: 4
  columns: 1
  square: false
  cards:
    - type: custom:layout-card
      grid_options:
        columns: full
      layout_type: custom:grid-layout
      card_mod:
        style:
          "grid-layout $": |
            hui-vertical-stack-card { pointer-events: none !important; }
      layout:
        grid-template-columns: repeat(2, minmax(0, 1fr))
        grid-template-areas: |
          "clock clock"
          "frontlawn driveway"
          "ambient ambient"
        align-items: stretch
        grid-gap: 6px
        margin: 0 36px
        padding: 0
        "--masonry-view-card-margin": 0px
        mediaquery:
          "(max-width: 700px)":
            grid-template-columns: 1fr
            grid-template-areas: |
              "clock"
              "frontlawn"
              "driveway"
              "ambient"
      cards:
        # The established clock-weather-card supplies a live clock; button-card has no minute ticker.
        - type: custom:clock-weather-card
          entity: weather.pirateweather
          sun_entity: sun.sun
          weather_icon_type: fill
          animated_icon: true
          forecast_rows: 3
          locale: en-US
          time_pattern: h:mm
          time_format: 12
          date_pattern: DDDD
          hide_today_section: false
          hide_forecast_section: false
          hide_clock: false
          hide_date: false
          use_browser_time: true
          card_mod:
            style: |
              ha-card {
                display: block !important;
                height: 150px !important;
                padding: 12px 24px !important;
                box-sizing: border-box !important;
                overflow: hidden !important;
              }
              ha-card > div {
                display: grid !important;
                grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr);
                align-items: center;
                gap: 24px;
                height: 126px;
              }
              clock-weather-card-today {
                height: 126px !important;
                position: relative !important;
              }
              clock-weather-card-today-left {
                align-items: flex-start !important;
                justify-content: center !important;
              }
              clock-weather-card-today-left .grow-img {
                width: 96px !important;
                height: 96px !important;
                flex: 0 0 96px !important;
              }
              clock-weather-card-today-right,
              clock-weather-card-today-right-wrap {
                position: static !important;
              }
              clock-weather-card-today-right-wrap {
                height: 126px !important;
                justify-content: center !important;
              }
              clock-weather-card-today-right-wrap-top {
                position: absolute !important;
                left: 0;
                bottom: 3px;
                width: 35% !important;
                height: 24px !important;
                font-size: 18px !important;
                font-weight: 600 !important;
                line-height: 24px !important;
                text-align: center !important;
              }
              clock-weather-card-today-right-wrap-center {
                min-height: 78px !important;
                font-size: 76px !important;
                font-weight: 500 !important;
                line-height: 1 !important;
              }
              clock-weather-card-today-right-wrap-bottom {
                font-size: 16px !important;
                line-height: 20px !important;
              }
              clock-weather-card-forecast {
                max-height: 126px;
                overflow: hidden;
              }
              @media (max-width: 700px) {
                ha-card > div {
                  grid-template-columns: 1fr;
                }
                clock-weather-card-forecast {
                  display: none;
                }
              }
          view_layout:
            grid-area: clock

        # Built-in picture-glance is required because button-card cannot render HA camera streams.
        - type: picture-glance
          title: Driveway
          camera_image: camera.driveway
          camera_view: auto
          aspect_ratio: "21:9"
          entities: []
          view_layout:
            grid-area: driveway

        - type: picture-glance
          title: Front Lawn
          camera_image: camera.frontlawn
          camera_view: auto
          aspect_ratio: "21:9"
          entities: []
          view_layout:
            grid-area: frontlawn

        # Shared alert semantics; default presentation preserves the Kitchen wall.
        - type: custom:button-card
          template: kiosk_ambient_alerts
          view_layout:
            grid-area: ambient

        - type: vertical-stack
          cards: !include /config/dashboards/kiosk_satellite_staging/partials/event_overlays.yaml
          view_layout:
            grid-area: 1 / 1 / 4 / 3
