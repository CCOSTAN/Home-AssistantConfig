# Original Repo : https://github.com/CCOSTAN/Home-AssistantConfig
# -------------------------------------------------------------------
# Kiosk Satellite Templates - Shared alerts and compact Echo Show 5
# Related Issue: 2029
#  One household alert renderer with opt-in small-screen presentation.
# -------------------------------------------------------------------
# Notes: Kitchen keeps its existing dimensions and interactive details.
# Notes: Echo Show 5 uses compact interactive alerts and minute-updated time.
# Notes: Shared phone notifications retain the source feed's expiry and sent times.
# Notes: Direct touch release handles kiosk taps before button-card suppresses synthetic clicks.
# Notes: Shared holiday accents decorate ambient panels only; alert colors retain their meaning.
######################################################################

kiosk_ambient_alerts:
  variables:
    compact: false
    read_only: false
  show_icon: false
  show_name: false
  show_state: false
  tap_action:
    action: none
  hold_action:
    action: none
  double_tap_action:
    action: none
  # Model dependencies may grow; a bounded refresh keeps every Show current.
  update_timer: 5s
  triggers_update: update_timer
  custom_fields:
    ambient: >
      [[[
        const now = new Date();
        const model = window.BearStoneKioskAmbient;
        if (!model) return html`<div>Loading household notifications...</div>`;
        const feed = model.build(states, now);
        const seasonal = model.seasonal ? model.seasonal(states) : {mode: 'standard'};
        const {items, state, valid, pretty, dateKey, cleanAlertText, alertSection, limitAlertText, uniqueWeatherAlerts, phynAlerts, rheemProblem} = feed;
        const detailValue = valid(state('input_text.kitchen_kiosk_detail_view'))
          ? state('input_text.kitchen_kiosk_detail_view')
          : 'none';
        const [detailType, detailSubject = ''] = detailValue.split('|');
        const detailActive = !variables.read_only && state('timer.kitchen_kiosk_detail_display') === 'active'
          && detailType !== 'none' && state('sensor.kiosk_active_camera_view') === 'none'
          && state('binary_sensor.kiosk_rain_radar_active') !== 'on';
        const callScript = (service, data = {}) =>
          hass.callService('script', service, data);
        const closeDetail = (event) => {
          if (event?.type === 'touchend') event.preventDefault();
          event?.stopPropagation();
          hass.callService('timer', 'cancel', {}, {
            entity_id: 'timer.kitchen_kiosk_detail_display'
          });
        };

        const formatSince = (entity) => {
          const changed = new Date(entity?.last_changed);
          if (!Number.isFinite(changed.getTime())) return 'recently';
          const minutes = Math.max(0, Math.floor((Date.now() - changed.getTime()) / 60000));
          if (minutes < 1) return 'just now';
          if (minutes < 60) return `${minutes} min ago`;
          const hours = Math.floor(minutes / 60);
          return `${hours} hr${hours === 1 ? '' : 's'} ago`;
        };
        const renderDetail = () => {
          let kicker = 'HOUSEHOLD DETAIL';
          let title = 'Current status';
          let icon = 'mdi:information-outline';
          let body = html`<div class="kitchen-detail-message">This detail is no longer active.</div>`;

          if (detailType === 'weather') {
            const alert = uniqueWeatherAlerts.find((candidate, index) =>
              String(candidate.ID || index) === detailSubject
            ) || uniqueWeatherAlerts[0];
            kicker = `NWS WEATHER ALERT · ${String(alert?.Severity || 'Unknown').toUpperCase()}`;
            title = alert?.Event || 'Weather alert';
            icon = 'mdi:weather-lightning-rainy';
            if (alert) {
              const sections = [
                ['WHAT', alertSection(alert.Description, 'WHAT')],
                ['WHERE', alertSection(alert.Description, 'WHERE')],
                ['WHEN', alertSection(alert.Description, 'WHEN')],
                ['IMPACTS', alertSection(alert.Description, 'IMPACTS')]
              ].filter(([, value]) => value);
              const instructions = limitAlertText(alert.Instruction, 220);
              body = html`
                <div class="kitchen-detail-weather-headline">${cleanAlertText(alert.Headline)}</div>
                <div class="kitchen-detail-grid weather">
                  ${sections.map(([label, value]) => html`
                    <div class="kitchen-detail-tile">
                      <div class="kitchen-detail-label">${label}</div>
                      <div class="kitchen-detail-value">${value}</div>
                    </div>
                  `)}
                </div>
                ${instructions ? html`
                  <div class="kitchen-detail-instructions">
                    <strong>STAY SAFE</strong> · ${instructions}
                  </div>
                ` : ''}
              `;
            }
          } else if (detailType === 'package') {
            const camera = states['camera.frontdoorbell'];
            const packageEntity = states['binary_sensor.front_door_packages_present'];
            const picture = String(camera?.attributes?.entity_picture || '');
            kicker = 'FRONT DOOR';
            title = 'Package waiting';
            icon = 'mdi:package-variant-closed';
            body = html`
              <div class="kitchen-detail-camera">
                ${picture ? html`<img src="${picture}${picture.includes('?') ? '&' : '?'}kiosk=${Date.now()}" alt="Front door camera">` : ''}
                <div class="kitchen-detail-camera-caption">
                  Last checked ${packageEntity?.attributes?.last_run || 'recently'}
                </div>
              </div>
            `;
          } else if (detailType === 'family') {
            const person = states[detailSubject];
            const locationEntityId = {
              'person.carlo': 'sensor.carlo_location_display',
              'person.stacey': 'sensor.stacey_location_display',
              'person.justin': 'sensor.justin_location_display',
              'person.paige': 'sensor.paige_location_display'
            }[detailSubject];
            const personName = person?.attributes?.friendly_name || pretty(detailSubject.split('.')[1]);
            const rawLocation = pretty(state(locationEntityId));
            const withoutName = rawLocation.replace(new RegExp(`^${personName}\s+`, 'i'), '');
            const location = withoutName.replace(/\s*\(since\s+[^)]+\)\s*$/i, '').trim();
            kicker = 'FAMILY LOCATION';
            title = `${personName} · ${location || pretty(person?.state)}`;
            icon = 'mdi:map-marker-account-outline';
            body = html`<div class="kitchen-detail-map-caption">Updated ${formatSince(person)} · 24-hour trail</div>`;
          } else if (detailType === 'entry_points') {
            const openEntries = (states['group.entry_points']?.attributes?.entity_id || [])
              .map((entityId) => states[entityId])
              .filter((entry) => entry?.state === 'on');
            kicker = 'ENTRY POINTS';
            title = `${openEntries.length} ${openEntries.length === 1 ? 'opening' : 'openings'} detected`;
            icon = 'mdi:door-open';
            body = html`
              <div class="kitchen-detail-grid entries">
                ${openEntries.map((entry) => html`
                  <div class="kitchen-detail-tile entry">
                    <ha-icon icon="mdi:door-open"></ha-icon>
                    <div>
                      <div class="kitchen-detail-entry-name">${entry.attributes?.friendly_name || 'Open entry'}</div>
                      <div class="kitchen-detail-entry-since">Open ${formatSince(entry)}</div>
                    </div>
                  </div>
                `)}
              </div>
            `;
          } else if (detailType === 'phyn') {
            const valveState = state('valve.phyn_shutoff_valve');
            const flow = Number.parseFloat(state('sensor.phyn_average_water_flow_rate'));
            const pressure = Number.parseFloat(state('sensor.phyn_current_water_pressure'));
            const alerts = phynAlerts.map((entityId) =>
              states[entityId]?.attributes?.friendly_name || pretty(entityId.split('.')[1])
            );
            kicker = 'PHYN WATER SYSTEM';
            title = valveState === 'closed' ? 'Main water is off' : 'Water system needs attention';
            icon = 'mdi:water-alert-outline';
            body = html`
              <div class="kitchen-detail-grid metrics">
                <div class="kitchen-detail-metric">
                  <span>MAIN VALVE</span><strong>${pretty(valveState)}</strong>
                </div>
                <div class="kitchen-detail-metric">
                  <span>FLOW</span><strong>${Number.isFinite(flow) ? `${flow.toFixed(1)} gal/min` : 'Unknown'}</strong>
                </div>
                <div class="kitchen-detail-metric">
                  <span>PRESSURE</span><strong>${Number.isFinite(pressure) ? `${pressure.toFixed(0)} psi` : 'Unknown'}</strong>
                </div>
              </div>
              <div class="kitchen-detail-alert-list">
                ${alerts.length ? alerts.join(' · ') : 'No active Phyn alert text is available.'}
              </div>
              ${valveState === 'closed' ? html`
                <button
                  class="kitchen-detail-water-button"
                  @click=${(event) => {
                    event.stopPropagation();
                    if (window.confirm('Turn the Phyn main water supply ON? Confirm the leak is safe first.')) {
                      callScript('kitchen_kiosk_restore_phyn_water');
                    }
                  }}
                >TURN WATER ON</button>
              ` : html`<div class="kitchen-detail-safe-state">Main water is ${pretty(valveState)}</div>`}
            `;
          } else if (detailType === 'hot_water') {
            const available = Number.parseFloat(state('sensor.rheem_wh_available_hot_water'));
            const alertCount = Number.parseInt(state('sensor.rheem_wh_alert_count'), 10);
            const diagnosticStatus = state('sensor.rheem_wh_diagnostic_status');
            const rheemProblem = state('binary_sensor.rheem_wh_problem') === 'on';
            const heater = states['water_heater.rheem_wh'];
            const running = state('binary_sensor.rheem_wh_running') === 'on';
            const target = Number.parseFloat(heater?.attributes?.temperature);
            const mode = pretty(heater?.attributes?.operation_mode || heater?.state);
            const tankHealth = Number.parseFloat(state('sensor.rheem_wh_tank_health'));
            const compressorHealth = Number.parseFloat(state('sensor.rheem_wh_compressor_health'));
            kicker = rheemProblem ? 'WATER HEATER ALERT' : 'HOT WATER RECOVERY';
            title = rheemProblem && Number.isFinite(alertCount) && alertCount > 0
              ? `${alertCount} active ${alertCount === 1 ? 'alert' : 'alerts'}`
              : (running ? 'Heating now' : 'Standing by');
            icon = rheemProblem ? 'mdi:water-boiler-alert' : 'mdi:water-boiler';
            body = html`
              <div class="kitchen-detail-hot-water">
                <div class="kitchen-detail-hot-percent">${Number.isFinite(available) ? Math.round(available) : '--'}<span>%</span></div>
                <div class="kitchen-detail-hot-label">HOT WATER AVAILABLE</div>
                <div class="kitchen-detail-grid metrics hot">
                  <div class="kitchen-detail-metric"><span>MODE</span><strong>${mode}</strong></div>
                  <div class="kitchen-detail-metric"><span>TARGET</span><strong>${Number.isFinite(target) ? `${Math.round(target)}°F` : 'Unknown'}</strong></div>
                  <div class="kitchen-detail-metric"><span>TANK HEALTH</span><strong>${Number.isFinite(tankHealth) ? `${Math.round(tankHealth)}%` : 'Unknown'}</strong></div>
                  <div class="kitchen-detail-metric"><span>COMPRESSOR</span><strong>${Number.isFinite(compressorHealth) ? `${Math.round(compressorHealth)}%` : 'Unknown'}</strong></div>
                </div>
                ${rheemProblem ? html`
                  <div class="kitchen-detail-alert-list">
                    STATUS: ${pretty(diagnosticStatus)} · ACTIVE ALERTS: ${Number.isFinite(alertCount) ? alertCount : 'Unknown'} · Check Repairs or the Rheem message for the vendor error text.
                  </div>
                ` : ''}
              </div>
            `;
          }

          return html`
            <div class="kitchen-detail-overlay ${detailType === 'family' ? 'family' : ''} ${variables.compact ? 'compact' : ''}" @click=${(event) => event.stopPropagation()}>
              <div class="kitchen-detail-header">
                <div class="kitchen-detail-header-icon"><ha-icon .icon=${icon}></ha-icon></div>
                <div class="kitchen-detail-header-copy">
                  <div class="kitchen-detail-kicker">${kicker}</div>
                  <div class="kitchen-detail-title">${title}</div>
                </div>
                <button class="kitchen-detail-close" @touchend=${closeDetail} @click=${closeDetail} aria-label="Return to dashboard">×</button>
              </div>
              <div class="kitchen-detail-body">${body}</div>
            </div>
          `;
        };

        const secondsPerSlide = 10;
        const duration = items.length * secondsPerSlide;
        const phase = Math.floor(now.getTime() / 1000) % duration;
        const slot = 100 / items.length;
        const fade = Math.min(4, slot * 0.18);
        const handleAmbientTap = (event) => {
          if (variables.read_only) return;
          if (event.type === 'touchend') event.preventDefault();
          const visibleSlides = [...event.currentTarget.querySelectorAll('.kitchen-ambient-slide')]
            .map((slide, index) => ({
              index,
              opacity: Number.parseFloat(getComputedStyle(slide).opacity) || 0
            }))
            .sort((left, right) => right.opacity - left.opacity);
          const activeItem = items[visibleSlides[0]?.index ?? 0] || items[0];
          if (!activeItem?.action) return;
          event.stopPropagation();
          callScript(activeItem.action.service, activeItem.action.data);
        };
        return html`
          <style>
            @keyframes kitchen-ambient-cycle {
              0% { opacity: 0; transform: translateY(12px); }
              ${fade}% { opacity: 1; transform: translateY(0); }
              ${slot - fade}% { opacity: 1; transform: translateY(0); }
              ${slot}% { opacity: 0; transform: translateY(-12px); }
              100% { opacity: 0; transform: translateY(-12px); }
            }
            .kitchen-ambient-rotator {
              position: relative;
              width: 100%;
              height: 100%;
              cursor: pointer;
            }
            .kitchen-ambient-slide {
              position: absolute;
              inset: 0;
              display: grid;
              grid-template-columns: 132px minmax(0, 1fr);
              grid-template-areas: 'icon copy';
              align-items: center;
              gap: 30px;
              padding: 2px 36px;
              box-sizing: border-box;
              opacity: 0;
              animation-name: kitchen-ambient-cycle;
              animation-timing-function: linear;
              animation-iteration-count: infinite;
            }
            .kitchen-ambient-slide.single {
              opacity: 1;
              animation: none;
            }
            .kitchen-ambient-icon {
              grid-area: icon;
              display: grid;
              place-items: center;
              width: 112px;
              height: 112px;
              border-radius: 28px;
              color: var(--accent);
              background: color-mix(in srgb, var(--accent) 14%, transparent);
            }
            .kitchen-ambient-icon ha-icon { --mdc-icon-size: 72px; }
            .kitchen-ambient-copy {
              grid-area: copy;
              min-width: 0;
              text-align: left;
            }
            .kitchen-ambient-kicker {
              color: var(--accent);
              font-size: 24px;
              font-weight: 800;
              line-height: 1.1;
              letter-spacing: 0.1em;
            }
            .kitchen-ambient-rotator.seasonal .kitchen-ambient-kicker { padding-right: 92px; }
            .kitchen-ambient-rotator.compact.seasonal .kitchen-ambient-kicker { padding-right: 56px; }
            .kitchen-ambient-title {
              margin-top: 6px;
              color: var(--primary-text-color);
              font-size: var(--title-size, 52px);
              font-weight: 700;
              line-height: 1.02;
              display: -webkit-box;
              -webkit-box-orient: vertical;
              -webkit-line-clamp: 2;
              white-space: normal;
              overflow-wrap: anywhere;
              overflow: hidden;
            }
            .kitchen-ambient-detail {
              margin-top: 6px;
              color: var(--secondary-text-color);
              font-size: 40px;
              font-weight: 600;
              line-height: 1.08;
              display: -webkit-box;
              -webkit-box-orient: vertical;
              -webkit-line-clamp: 3;
              white-space: normal;
              overflow-wrap: anywhere;
              overflow: hidden;
            }
            .kitchen-ambient-rotator.compact .kitchen-ambient-slide {
              grid-template-columns: 44px minmax(0, 1fr);
              gap: 10px;
              padding: 8px 12px;
            }
            .kitchen-ambient-rotator.compact .kitchen-ambient-icon {
              width: 44px;
              height: 44px;
              border-radius: 12px;
            }
            .kitchen-ambient-rotator.compact .kitchen-ambient-icon ha-icon { --mdc-icon-size: 30px; }
            .kitchen-ambient-rotator.compact .kitchen-ambient-kicker { font-size: 12px; letter-spacing: 0.06em; }
            .kitchen-ambient-rotator.compact .kitchen-ambient-title { margin-top: 2px; font-size: 24px; line-height: 1.05; }
            .kitchen-ambient-rotator.compact .kitchen-ambient-detail { margin-top: 3px; font-size: 16px; line-height: 1.15; -webkit-line-clamp: 2; }
            .kitchen-detail-overlay {
              position: fixed;
              inset: 0;
              z-index: 10000;
              box-sizing: border-box;
              padding: 22px 36px;
              color: #f3f6fb;
              background: radial-gradient(circle at top right, #172235 0%, #080e16 55%);
              overflow: hidden;
              text-align: left;
            }
            .kitchen-detail-overlay.family {
              background: transparent;
              pointer-events: none;
            }
            .kitchen-detail-overlay.family .kitchen-detail-header {
              padding: 12px 18px;
              border: 1px solid rgba(255,255,255,0.18);
              border-radius: 20px;
              background: rgba(8,14,22,0.92);
              box-shadow: 0 10px 28px rgba(0,0,0,0.45);
              pointer-events: auto;
            }
            .kitchen-detail-overlay.family .kitchen-detail-body {
              pointer-events: none;
            }
            .kitchen-detail-header {
              display: grid;
              grid-template-columns: 76px minmax(0, 1fr) 68px;
              align-items: center;
              gap: 20px;
              min-height: 100px;
              padding-bottom: 18px;
              border-bottom: 2px solid rgba(255,255,255,0.16);
            }
            .kitchen-detail-header-icon {
              display: grid;
              place-items: center;
              width: 72px;
              height: 72px;
              border-radius: 20px;
              color: #4fc3f7;
              background: rgba(79,195,247,0.14);
            }
            .kitchen-detail-header-icon ha-icon { --mdc-icon-size: 48px; }
            .kitchen-detail-kicker {
              color: #4fc3f7;
              font-size: 22px;
              font-weight: 800;
              letter-spacing: 0.1em;
            }
            .kitchen-detail-title {
              margin-top: 4px;
              font-size: 48px;
              font-weight: 750;
              line-height: 1;
              overflow: hidden;
              text-overflow: ellipsis;
              white-space: nowrap;
            }
            .kitchen-detail-close {
              width: 64px;
              height: 64px;
              border: 2px solid rgba(255,255,255,0.25);
              border-radius: 20px;
              color: #fff;
              background: rgba(255,255,255,0.08);
              font-size: 46px;
              line-height: 52px;
            }
            .kitchen-detail-body {
              height: calc(100vh - 164px);
              padding-top: 18px;
              box-sizing: border-box;
              overflow: hidden;
            }
            .kitchen-detail-weather-headline {
              margin-bottom: 14px;
              color: #ffca70;
              font-size: 24px;
              font-weight: 700;
              line-height: 1.15;
              white-space: normal;
              display: -webkit-box;
              -webkit-box-orient: vertical;
              -webkit-line-clamp: 2;
              overflow: hidden;
            }
            .kitchen-detail-grid {
              display: grid;
              gap: 14px;
            }
            .kitchen-detail-grid.weather { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .kitchen-detail-grid.entries { grid-template-columns: repeat(3, minmax(0, 1fr)); }
            .kitchen-detail-grid.metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); }
            .kitchen-detail-grid.metrics.hot { grid-template-columns: repeat(4, minmax(0, 1fr)); }
            .kitchen-detail-tile,
            .kitchen-detail-metric {
              padding: 18px 22px;
              border: 1px solid rgba(255,255,255,0.14);
              border-radius: 18px;
              background: rgba(255,255,255,0.06);
              overflow: hidden;
            }
            .kitchen-detail-label,
            .kitchen-detail-metric span,
            .kitchen-detail-hot-label {
              color: #7fd7ff;
              font-size: 20px;
              font-weight: 800;
              letter-spacing: 0.08em;
            }
            .kitchen-detail-value {
              margin-top: 7px;
              font-size: 23px;
              font-weight: 600;
              line-height: 1.18;
              white-space: normal;
              overflow-wrap: anywhere;
              display: -webkit-box;
              -webkit-box-orient: vertical;
              -webkit-line-clamp: 3;
              overflow: hidden;
            }
            .kitchen-detail-instructions,
            .kitchen-detail-alert-list,
            .kitchen-detail-safe-state {
              margin-top: 16px;
              padding: 17px 22px;
              border-radius: 18px;
              background: rgba(255,193,7,0.12);
              font-size: 22px;
              font-weight: 600;
              line-height: 1.2;
              white-space: normal;
              overflow-wrap: anywhere;
              display: -webkit-box;
              -webkit-box-orient: vertical;
              -webkit-line-clamp: 2;
              overflow: hidden;
            }
            .kitchen-detail-tile.entry {
              display: grid;
              grid-template-columns: 48px 1fr;
              align-items: center;
              gap: 14px;
            }
            .kitchen-detail-tile.entry ha-icon { --mdc-icon-size: 42px; color: #ffb74d; }
            .kitchen-detail-entry-name { font-size: 28px; font-weight: 700; }
            .kitchen-detail-entry-since { margin-top: 4px; color: #aeb9c8; font-size: 22px; }
            .kitchen-detail-metric span { display: block; }
            .kitchen-detail-metric strong {
              display: block;
              margin-top: 10px;
              font-size: 38px;
              line-height: 1.05;
            }
            .kitchen-detail-camera {
              position: relative;
              width: 100%;
              height: 100%;
              overflow: hidden;
              border-radius: 20px;
              background: #03070b;
            }
            .kitchen-detail-camera img {
              width: 100%;
              height: 100%;
              object-fit: contain;
            }
            .kitchen-detail-camera-caption,
            .kitchen-detail-map-caption {
              position: absolute;
              left: 22px;
              bottom: 20px;
              padding: 12px 18px;
              border-radius: 14px;
              color: #fff;
              background: rgba(0,0,0,0.72);
              font-size: 26px;
              font-weight: 700;
            }
            .kitchen-detail-map-caption {
              z-index: 10002;
              pointer-events: none;
            }
            .kitchen-detail-water-button {
              display: block;
              width: 100%;
              margin-top: 20px;
              padding: 24px;
              border: 3px solid #29b6f6;
              border-radius: 20px;
              color: #fff;
              background: #0277bd;
              font-size: 36px;
              font-weight: 800;
            }
            .kitchen-detail-safe-state {
              color: #b9f6ca;
              background: rgba(76,175,80,0.16);
            }
            .kitchen-detail-hot-water { text-align: center; }
            .kitchen-detail-hot-percent {
              margin-top: 4px;
              font-size: 170px;
              font-weight: 750;
              line-height: 0.92;
            }
            .kitchen-detail-hot-percent span { font-size: 78px; }
            .kitchen-detail-hot-label { margin: 8px 0 24px; }
            .kitchen-detail-message {
              display: grid;
              place-items: center;
              height: 100%;
              font-size: 38px;
              font-weight: 700;
            }
            .kitchen-detail-overlay.compact { padding: 12px 18px; }
            .kitchen-detail-overlay.compact .kitchen-detail-header { min-height: 64px; grid-template-columns: 54px minmax(0, 1fr) 50px; gap: 12px; padding-bottom: 10px; }
            .kitchen-detail-overlay.compact .kitchen-detail-title { font-size: 32px; }
            .kitchen-detail-overlay.compact .kitchen-detail-kicker { font-size: 16px; }
            .kitchen-detail-overlay.compact .kitchen-detail-header-icon { width: 50px; height: 50px; }
            .kitchen-detail-overlay.compact .kitchen-detail-header-icon ha-icon { --mdc-icon-size: 34px; }
            .kitchen-detail-overlay.compact .kitchen-detail-close { width: 48px; height: 48px; font-size: 32px; line-height: 38px; }
            .kitchen-detail-overlay.compact .kitchen-detail-body { height: calc(100vh - 104px); padding-top: 10px; overflow: auto; }
            .kitchen-detail-overlay.compact .kitchen-detail-tile,
            .kitchen-detail-overlay.compact .kitchen-detail-metric { padding: 10px 12px; }
            .kitchen-detail-overlay.compact .kitchen-detail-value,
            .kitchen-detail-overlay.compact .kitchen-detail-entry-name { font-size: 22px; }
            .kitchen-detail-overlay.compact .kitchen-detail-metric strong { font-size: 26px; }
            .kitchen-detail-overlay.compact .kitchen-detail-hot-percent { font-size: 90px; }
            .kitchen-detail-overlay.compact .kitchen-detail-hot-percent span { font-size: 44px; }
          </style>
          <div class="kitchen-ambient-rotator ${variables.compact ? 'compact' : ''} ${seasonal.mode !== 'standard' ? 'seasonal' : ''}" style=${detailActive ? 'visibility:hidden' : ''} @touchend=${handleAmbientTap} @click=${handleAmbientTap}>
            ${items.map((item, index) => html`
              <div
                class="kitchen-ambient-slide ${items.length === 1 ? 'single' : ''}"
                style="--accent:${item.accent};--title-size:${String(item.title || '').length > 58 ? '40px' : String(item.title || '').length > 38 ? '46px' : '52px'};animation-duration:${duration}s;animation-delay:${index * secondsPerSlide - phase}s"
              >
                <div class="kitchen-ambient-icon"><ha-icon .icon=${item.icon}></ha-icon></div>
                <div class="kitchen-ambient-copy">
                  <div class="kitchen-ambient-kicker">${item.kicker}</div>
                  <div class="kitchen-ambient-title">${item.title}</div>
                  <div class="kitchen-ambient-detail">${item.detail}</div>
                </div>
              </div>
            `)}
          </div>
          ${detailActive ? renderDetail() : ''}
        `;
      ]]]
  styles:
    card:
      - height: '[[[ return variables.compact ? "126px" : "235px"; ]]]'
      - padding: 0
      - overflow: hidden
      - border-radius: 18px
      - background: >
          [[[
            if (states['timer.kitchen_kiosk_detail_display']?.state === 'active') return 'transparent';
            const seasonal = window.BearStoneKioskAmbient?.seasonal?.(states);
            return seasonal && seasonal.wash !== 'none' ? (variables.compact ? seasonal.compactBackground : seasonal.background)
              : 'linear-gradient(120deg, rgba(33, 150, 243, 0.08), rgba(103, 58, 183, 0.08))';
          ]]]
      - box-shadow: >
          [[[ return states['timer.kitchen_kiosk_detail_display']?.state === 'active' ? 'none'
            : window.BearStoneKioskAmbient?.seasonal?.(states)?.edge || 'none'; ]]]
    grid:
      - grid-template-areas: '"ambient"'
      - grid-template-columns: 1fr
      - grid-template-rows: 1fr
    custom_fields:
      ambient:
        - width: 100%
        - height: 100%
        - pointer-events: '[[[ return variables.read_only ? "none" : "auto"; ]]]'

kiosk_echo5_surface:
  show_icon: false
  show_name: false
  show_state: false
  triggers_update:
    - timer.kitchen_kiosk_detail_display
    - sensor.kiosk_active_camera_view
    - binary_sensor.kiosk_rain_radar_active
  tap_action:
    action: none
  hold_action:
    action: none
  styles:
    card:
      - height: calc(100vh - 8px)
      - box-sizing: border-box
      - padding: 4px
      - border: 0
      - border-radius: 0
      - background: var(--lovelace-background)
      - box-shadow: none
    grid:
      - grid-template-areas: '"clock ambient" "cameras cameras"'
      - grid-template-columns: minmax(0, 0.33fr) minmax(0, 0.67fr)
      - grid-template-rows: 126px minmax(0, 1fr)
      - gap: 6px
    custom_fields:
      clock:
        - min-width: 0
        - align-self: stretch
      ambient:
        - min-width: 0
        - align-self: stretch
        # Raise the interactive detail above the map's sibling stacking context.
        - position: relative
        - z-index: >
            [[[ return states['timer.kitchen_kiosk_detail_display']?.state === 'active'
              && states['sensor.kiosk_active_camera_view']?.state === 'none'
              && states['binary_sensor.kiosk_rain_radar_active']?.state !== 'on' ? 10000 : 'auto'; ]]]
      cameras:
        - min-width: 0
        - align-self: start
      events:
        - position: absolute
        - inset: 0
        - pointer-events: none
        - z-index: 9999

kiosk_echo5_clock:
  # The requested icon is current weather status beside the time, with no forecast.
  show_icon: true
  show_name: false
  show_state: false
  icon: >
    [[[
      const icons = {
        'clear-night': 'mdi:weather-night', sunny: 'mdi:weather-sunny',
        partlycloudy: 'mdi:weather-partly-cloudy', cloudy: 'mdi:weather-cloudy',
        fog: 'mdi:weather-fog', rainy: 'mdi:weather-rainy', pouring: 'mdi:weather-pouring',
        lightning: 'mdi:weather-lightning', 'lightning-rainy': 'mdi:weather-lightning-rainy',
        snowy: 'mdi:weather-snowy', 'snowy-rainy': 'mdi:weather-snowy-rainy',
        hail: 'mdi:weather-hail', windy: 'mdi:weather-windy',
        'windy-variant': 'mdi:weather-windy-variant', exceptional: 'mdi:alert-outline'
      };
      return icons[states[variables.weather_entity]?.state] || 'mdi:help-circle-outline';
    ]]]
  tap_action:
    action: none
  hold_action:
    action: none
  custom_fields:
    time: >
      [[[
        const value = entity?.state || '';
        if (!/^\d{2}:\d{2}$/.test(value)) return '--:--';
        const [hour, minute] = value.split(':');
        return `${Number(hour) % 12 || 12}:${minute}`;
      ]]]
    date: >
      [[[
        const value = states[variables.date_entity]?.state || '';
        if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return '';
        return new Date(`${value}T12:00:00`).toLocaleDateString('en-US', {
          weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
        });
      ]]]
  styles:
    card:
      - height: 126px
      - padding: 4px 8px
      - box-sizing: border-box
      - border: 0
      - background: transparent
      - box-shadow: none
    grid:
      - grid-template-areas: '"i time" "date date"'
      - grid-template-columns: 46px minmax(0, 1fr)
      - grid-template-rows: 1fr auto
      - column-gap: 8px
    icon:
      - width: 42px
      - color: '#b6d8f3'
    custom_fields:
      time:
        - justify-self: start
        - align-self: center
        - font-size: 64px
        - font-weight: 600
        - line-height: 1
        - font-variant-numeric: tabular-nums
        - color: var(--primary-text-color)
      date:
        - justify-self: start
        - text-align: left
        - white-space: normal
        - font-size: 14px
        - line-height: 1.3
        - font-weight: 500
        - color: var(--secondary-text-color)
