# -------------------------------------------------------------------
# Kiosk Satellite Theme - Automatic day and night palette
#  Follows the Kiosk Satellite client theme schedule for shared kiosk views.
# -------------------------------------------------------------------
# Notes: Kitchen Show switches light/dark variants at 07:00/19:00 device time.
######################################################################

kiosk_satellite_auto:
  modes:
    light:
      primary-background-color: "#f4f6f8"
      secondary-background-color: "#ffffff"
      card-background-color: "#ffffff"
      primary-text-color: "#15181d"
      secondary-text-color: "#5d6673"
      divider-color: "rgba(0, 0, 0, 0.12)"
      lovelace-background: "#f4f6f8"
    dark:
      primary-background-color: "#0b0f14"
      secondary-background-color: "#111821"
      card-background-color: "#151d27"
      primary-text-color: "#f3f6fa"
      secondary-text-color: "#aab6c5"
      divider-color: "rgba(255, 255, 255, 0.12)"
      lovelace-background: "#0b0f14"
