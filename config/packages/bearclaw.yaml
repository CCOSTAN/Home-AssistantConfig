        state: >-
          {% set health = state_attr('sensor.bearclaw_status_telemetry', 'healthInsights') | default({}, true) %}
          {{ health.get('users', {}).get('carlo', {}).get('personalRecords', {}).get('latest', {}).get('label', 'No records') }}
        attributes:
          display_value: >-
            {% set health = state_attr('sensor.bearclaw_status_telemetry', 'healthInsights') | default({}, true) %}
            {{ health.get('users', {}).get('carlo', {}).get('personalRecords', {}).get('latest', {}).get('displayValue') }}
          activity_type: >-
            {% set health = state_attr('sensor.bearclaw_status_telemetry', 'healthInsights') | default({}, true) %}
            {{ health.get('users', {}).get('carlo', {}).get('personalRecords', {}).get('latest', {}).get('activityType') }}
          achieved_on: >-
            {% set health = state_attr('sensor.bearclaw_status_telemetry', 'healthInsights') | default({}, true) %}
            {{ health.get('users', {}).get('carlo', {}).get('personalRecords', {}).get('latest', {}).get('dayKey') }}
          record_count: >-
            {% set health = state_attr('sensor.bearclaw_status_telemetry', 'healthInsights') | default({}, true) %}
            {{ health.get('users', {}).get('carlo', {}).get('personalRecords', {}).get('count', 0) | int(0) }}

      - name: Joanna Stacey Latest Personal Record
        unique_id: joanna_stacey_latest_personal_record
        icon: mdi:trophy-outline
        availability: >-
          {% set health = state_attr('sensor.bearclaw_status_telemetry', 'healthInsights') | default({}, true) %}
          {{ health.get('users', {}).get('stacey', {}).get('personalRecords', {}).get('latest') is mapping }}
        state: >-
          {% set health = state_attr('sensor.bearclaw_status_telemetry', 'healthInsights') | default({}, true) %}
          {{ health.get('users', {}).get('stacey', {}).get('personalRecords', {}).get('latest', {}).get('label', 'No records') }}
        attributes:
          display_value: >-
            {% set health = state_attr('sensor.bearclaw_status_telemetry', 'healthInsights') | default({}, true) %}
            {{ health.get('users', {}).get('stacey', {}).get('personalRecords', {}).get('latest', {}).get('displayValue') }}
          activity_type: >-
            {% set health = state_attr('sensor.bearclaw_status_telemetry', 'healthInsights') | default({}, true) %}
            {{ health.get('users', {}).get('stacey', {}).get('personalRecords', {}).get('latest', {}).get('activityType') }}
          achieved_on: >-
            {% set health = state_attr('sensor.bearclaw_status_telemetry', 'healthInsights') | default({}, true) %}
            {{ health.get('users', {}).get('stacey', {}).get('personalRecords', {}).get('latest', {}).get('dayKey') }}
          record_count: >-
            {% set health = state_attr('sensor.bearclaw_status_telemetry', 'healthInsights') | default({}, true) %}
            {{ health.get('users', {}).get('stacey', {}).get('personalRecords', {}).get('count', 0) | int(0) }}

  - binary_sensor:
      - name: Joanna Mini App Problem
        unique_id: joanna_mini_app_problem
        device_class: problem
        icon: mdi:web-check
        delay_on: "00:03:00"
        delay_off: "00:01:00"
        state: >-
          {% set checked = as_timestamp(state_attr('sensor.joanna_mini_app_probe', 'checked_at'), 0) %}
          {{ not is_state('sensor.joanna_mini_app_probe', 'ok') or as_timestamp(now()) - checked > 180 }}
        attributes:
          origin: "{{ state_attr('sensor.joanna_mini_app_probe', 'origin') }}"
          public: "{{ state_attr('sensor.joanna_mini_app_probe', 'public') }}"
          summary: >-
            {% set checked = as_timestamp(state_attr('sensor.joanna_mini_app_probe', 'checked_at'), 0) %}
            {{ 'Mini App probe is stale or unavailable' if as_timestamp(now()) - checked > 180
               else state_attr('sensor.joanna_mini_app_probe', 'summary') }}

      - name: Joanna Session Source Indexed
        unique_id: joanna_session_source_indexed
        icon: mdi:message-text-clock-outline
        state: >-
          {% set memory = state_attr('sensor.bearclaw_status_telemetry', 'memoryIndex') | default({}, true) %}
          {% set options = memory.get('options', {}) if memory is mapping else {} %}
          {{ options.get('includeSessionSource', false) in [true, 'true', 'True', 'on', 'yes', 1, '1'] }}

      - name: Joanna Memory Index Stale
        unique_id: joanna_memory_index_stale
        icon: mdi:database-alert-outline
        state: >-
          {% set memory = state_attr('sensor.bearclaw_status_telemetry', 'memoryIndex') | default({}, true) %}
          {{ memory.get('stale', false) in [true, 'true', 'True', 'on', 'yes', 1, '1'] }}

automation:
  - id: joanna_mini_app_health_monitor
    alias: Joanna Mini App Health Monitor
    description: Independent origin/edge monitoring, durable incident deduplication, and recovery cleanup.
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.joanna_mini_app_problem
        to: "on"
      - platform: state
        entity_id: binary_sensor.joanna_mini_app_problem
        to: "off"
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/5"
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.joanna_mini_app_problem
                state: "on"
              - condition: state
                entity_id: input_boolean.joanna_mini_app_incident_active
                state: "off"
            sequence:
              - service: repairs.create
                data:
                  issue_id: joanna_mini_app_unavailable
                  title: Joanna Mini App unavailable
                  severity: error
                  persistent: true
                  description: >-
                    The independent Mini App checks have failed for at least three minutes.
                    {{ state_attr('binary_sensor.joanna_mini_app_problem', 'summary') }}.
                    Open Systems > Joanna for current local-server and public-route status.
                    Check the app listener when origin fails; check the public route when only public fails.
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.joanna_mini_app_incident_active
              - service: script.notify_engine
                continue_on_error: true
                data:
                  who: carlo
                  title: Joanna Mini App needs attention
                  value1: "{{ state_attr('binary_sensor.joanna_mini_app_problem', 'summary') }}. Open Systems > Joanna."
                  group: infrastructure
                  tag: joanna_mini_app_health
                  level: active
              - service: script.send_to_logbook
                continue_on_error: true
                data:
                  topic: JOANNA
                  message: "Mini App Repair opened: {{ state_attr('binary_sensor.joanna_mini_app_problem', 'summary') }}"
              - if:
                  - condition: state
                    entity_id: sensor.bearclaw_status_telemetry
                    state: ok
                  - condition: template
                    value_template: "{{ as_timestamp(now()) - as_timestamp(states.sensor.bearclaw_status_telemetry.last_reported, 0) < 180 }}"
                then:
                  - service: script.joanna_dispatch
                    continue_on_error: true
                    data:
                      source: home_assistant_automation.joanna_mini_app_health_monitor
                      trigger_context: Mini App origin/public health failed for three minutes
                      summary: Joanna Mini App needs investigation
                      entity_ids:
                        - sensor.joanna_mini_app_probe
                        - binary_sensor.joanna_mini_app_problem
                      diagnostics: "{{ state_attr('sensor.joanna_mini_app_probe', 'checks') }}"
                      request: >-
                        Diagnose the failed Mini App hop from current listener, container, and public-route evidence.
                        Report the cause and the smallest recovery action. Preserve any active deployment.
                        This monitor authorizes diagnosis only, not restarts, rebuilds, DNS, tunnel, Access, or firewall changes.
          - conditions:
              - condition: state
                entity_id: binary_sensor.joanna_mini_app_problem
                state: "off"
              - condition: state
                entity_id: input_boolean.joanna_mini_app_incident_active
                state: "on"
            sequence:
              - service: repairs.remove
                continue_on_error: true
                data:
                  issue_id: joanna_mini_app_unavailable
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.joanna_mini_app_incident_active
              - service: script.send_to_logbook
                continue_on_error: true
                data:
                  topic: JOANNA
                  message: Mini App local server and public route recovered; Repair cleared.
              - service: script.notify_engine
                continue_on_error: true
                data:
                  who: carlo
                  title: Joanna Mini App recovered
                  value1: Local server and public route checks are healthy again.
                  group: infrastructure
                  tag: joanna_mini_app_health
                  level: passive

  - id: bearclaw_lifecycle_webhook
    alias: BearClaw Lifecycle Webhook
    description: Receives structured BearClaw lifecycle callbacks for HA-triggered work.
    mode: queued
    trigger:
      - platform: webhook
        webhook_id: !secret bearclaw_reply_webhook_id
        allowed_methods:
          - POST
        local_only: true
    action:
      - variables:
          event_type: "{{ trigger.json.event_type | default('progress') | lower }}"
          status: "{{ trigger.json.status | default(event_type, true) | lower }}"
          source: "{{ trigger.json.source | default('homeassistant', true) | string | lower | trim }}"
          severity: "{{ trigger.json.severity | default('active', true) | string | lower | trim }}"
          summary: "{{ trigger.json.summary | default('Joanna lifecycle callback', true) }}"
          message: "{{ trigger.json.message | default(summary, true) }}"
          job_id: "{{ trigger.json.job_id | default('', true) }}"
          run_id: "{{ trigger.json.run_id | default('', true) }}"
          logbook_message: >-
            {% set compact = (event_type ~ ' | ' ~ summary ~ ' | ' ~ message) | replace('\r', ' ') | replace('\n', ' ') | trim %}
            {% if compact | length > 240 %}
              {{ compact[:237] ~ '...' }}
            {% else %}
              {{ compact }}
            {% endif %}
      - service: script.send_to_logbook
        data:
          topic: JOANNA
          message: "{{ status | upper }}: {{ logbook_message }}"
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ source == 'scheduler_tesla_road_trip'
                     and status in ['progress', 'arrival', 'completed'] }}
            sequence:
              - service: script.notify_engine
                data:
                  title: >-
                    {% if status == 'progress' %}
                      Tesla road-trip update
                    {% elif status == 'arrival' %}
                      Arrived at road-trip destination
                    {% else %}
                      Tesla road trip complete
                    {% endif %}
                  value1: >-
                    {% set compact = (message if message | trim != '' else summary) | replace('\r', ' ') | replace('\n', ' ') | trim %}
                    {% if compact | length > 180 %}
                      {{ compact[:177] ~ '...' }}
                    {% else %}
                      {{ compact }}
                    {% endif %}
                  who: family
                  group: Tesla_Model_Y
                  level: active
              - if:
                  - condition: template
                    value_template: "{{ status in ['progress', 'arrival'] }}"
                then:
                  - event: tesla_road_trip_active
                    event_data:
                      report_id: "{{ trigger.json.report_id | default('', true) }}"
                      trip_name: "{{ trigger.json.trip_name | default('', true) }}"
                      trip_destination: "{{ trigger.json.trip_destination | default('', true) }}"
                      milestone_miles: "{{ trigger.json.milestone_miles | default(0, true) | int(0) }}"
          - conditions:
              - condition: template
                value_template: >-
                  {{ source == 'home_assistant_automation.vacation_house_status_digest'
                     and status == 'completed' }}
            sequence:
              - service: script.notify_engine
                data:
                  title: Vacation digest review
                  value1: >-
                    {% set compact = (message if message | trim != '' else summary) | replace('\r', ' ') | replace('\n', ' ') | trim %}
                    {% if compact | length > 420 %}
                      {{ compact[:417] ~ '...' }}
                    {% else %}
                      {{ compact }}
                    {% endif %}
                  who: carlo
                  group: vacation
                  level: active
          - conditions:
              - condition: template
                value_template: "{{ severity in ['warning', 'error', 'critical'] or status in ['failed', 'canceled'] }}"
            sequence:
              - service: script.notify_engine
                data:
                  notification_icon: "mdi:robot"
                  color: "#C2410C"
                  title: Joanna Alert
                  value1: >-
                    {{ summary }}
                    {% if job_id | trim != '' %}
                      (job={{ job_id }})
                    {% endif %}
                    {% if run_id | trim != '' %}
                      run={{ run_id }}
                    {% endif %}
                    {{ '\n' ~ message if message | trim != '' else '' }}
