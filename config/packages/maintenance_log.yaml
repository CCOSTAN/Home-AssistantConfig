# For more info visit https://www.vcloudinfo.com/click-here
# Original Repo : https://github.com/CCOSTAN/Home-AssistantConfig
# -------------------------------------------------------------------
# Maintenance Logging - webhook ingest + graphable HA history
# Related Issue: 519, 1816
#  Stores water softener salt maintenance events in recorder-backed helpers.
# -------------------------------------------------------------------
# Video: https://youtu.be/_OqTv9i-jAs
# Blog: https://www.vcloudinfo.com/2026/07/home-assistant-water-softener-salt-automation.html
# Notes: Webhook id is bearclaw_maintenance_log_v1; internal maintenance_log events reuse the same queued processor.
# Notes: The water-softener NFC tag uses a short single-run guard to suppress duplicate phone scans.
# Notes: The restored refill journal deduplicates by event ID; late entries count toward totals without replacing a newer refill.
# Notes: Typical duration uses up to ten chronological refills. Short input_text fields are compatibility displays.
# Notes: Recent event history string format is "YYYY-MM-DD HH:MM:SS|amount|note||...".
# Notes: Long-term stats live on template sensors; helpers are internal state for restore/calculation.
######################################################################

input_number:
  water_softener_salt_last_amount_lb:
    name: "Softener salt last amount"
    min: 0
    max: 1000
    step: 0.1
    mode: box
    unit_of_measurement: lb
    icon: mdi:shaker

  water_softener_salt_total_added_lb:
    name: "Softener salt total added"
    min: 0
    max: 100000
    step: 0.1
    mode: box
    unit_of_measurement: lb
    icon: mdi:chart-line

counter:
  water_softener_salt_event_count:
    name: "Softener salt event count"
    step: 1
    icon: mdi:counter

input_datetime:
  water_softener_salt_last_occurred_at:
    name: "Softener salt last occurred at"
    has_date: true
    has_time: true
    icon: mdi:calendar-clock

input_text:
  water_softener_salt_last_note:
    name: "Softener salt last note"
    max: 255
    icon: mdi:text-box-outline

  water_softener_salt_recent_event_ids:
    name: "Softener salt recent event ids"
    max: 255
    icon: mdi:identifier

  water_softener_salt_recent_events:
    name: "Softener salt recent events"
    max: 255
    icon: mdi:history

template:
  - sensor:
      - name: "Water Softener Salt Days Since Last Add"
        unique_id: water_softener_salt_days_since_last_add
        unit_of_measurement: d
        availability: >-
          {% set raw = states('input_datetime.water_softener_salt_last_occurred_at') %}
          {% if raw in ['unknown', 'unavailable', 'none', ''] %}
            false
          {% else %}
            {{ as_timestamp(as_local(as_datetime(raw)), default=none) is not none }}
          {% endif %}
        state: >-
          {% set raw = states('input_datetime.water_softener_salt_last_occurred_at') %}
          {% set event_ts = as_timestamp(as_local(as_datetime(raw)), default=none) %}
          {% if event_ts is not none %}
            {{ [((as_timestamp(now()) - event_ts) / 86400), 0] | max | round(1) }}
          {% else %}
            0
          {% endif %}

      - name: "Water Softener Salt Last Summary"
        unique_id: water_softener_salt_last_summary
        icon: mdi:clipboard-text-clock-outline
        state: >-
          {% set raw = states('input_datetime.water_softener_salt_last_occurred_at') %}
          {% set amount = states('input_number.water_softener_salt_last_amount_lb') | float(0) %}
          {% set note = states('input_text.water_softener_salt_last_note') %}
          {% if raw in ['unknown', 'unavailable', 'none', ''] %}
            No salt events logged yet.
          {% else %}
            {% set when = as_datetime(raw).astimezone().strftime('%a %b %d, %Y %I:%M %p') | replace(' 0', ' ') %}
            {% if note in ['unknown', 'unavailable', 'none', ''] %}
              {{ amount | round(1) }} lb on {{ when }}
            {% else %}
              {{ ((amount | round(1)) ~ ' lb on ' ~ when ~ ' - ' ~ note)[:255] }}
            {% endif %}
          {% endif %}

      - name: "Water Softener Salt Average Days Between Refills"
        unique_id: water_softener_salt_average_days_between_refills
        unit_of_measurement: d
        state_class: measurement
        state: >-
          {% set journal = state_attr('sensor.water_softener_salt_refill_journal', 'journal') %}
          {% if journal is none %}
            {% from 'softener_salt.jinja' import legacy_journal %}
            {% if has_value('counter.water_softener_salt_event_count')
                  and has_value('input_number.water_softener_salt_total_added_lb') %}
              {% set journal = (legacy_journal | as_function)() %}
            {% endif %}
          {% endif %}
          {% set recent = journal.records[:10] if journal is mapping else [] %}
          {{ ((recent[0].at - recent[-1].at) / 86400 / (recent | length - 1)) | round(1)
             if recent | length > 1 else none }}

      - name: "Water Softener Salt Refill Count"
        unique_id: water_softener_salt_refill_count
        icon: mdi:counter
        state_class: total
        state: "{{ states('counter.water_softener_salt_event_count') | int(0) }}"

      - name: "Water Softener Salt Total Added"
        unique_id: water_softener_salt_total_added
        unit_of_measurement: lb
        device_class: weight
        state_class: total
        state: "{{ states('input_number.water_softener_salt_total_added_lb') | float(0) | round(1) }}"

  # Trigger-based template sensors restore their state and attributes after restart.
  - triggers:
      - trigger: event
        event_type: water_softener_salt_journal_updated
    sensor:
      - name: Water Softener Salt Refill Journal
        unique_id: water_softener_salt_refill_journal
        state: "{{ trigger.event.data.journal['count'] }}"
        attributes:
          journal: "{{ trigger.event.data.journal }}"

automation:
  - alias: "Maintenance Log - Water Softener Salt NFC"
    id: water_softener_salt_nfc_refill
    description: Log one 80 lb salt refill when the bound water-softener NFC sticker is scanned
    mode: single
    max_exceeded: silent

    trigger:
      - platform: tag
        tag_id: d7d89d9a-5351-44fc-a26c-011f197e9433

    action:
      - event: maintenance_log
        event_data:
          item_key: water_softener_salt
          action: add
          amount_value: 80
          amount_unit: lb
          event_id: "nfc_water_softener_salt_{{ trigger.event.context.id }}"
          occurred_at: "{{ now().isoformat() }}"
          actor: home_assistant_nfc
          raw_text: "Water softener salt refill NFC sticker scanned."
          parse_confidence: deterministic

      - delay: "00:00:10"

  - alias: "Maintenance Log - Joanna Webhook Ingest"
    id: 1c9fba4f-fef5-4da9-82d4-4049deff17cf
    description: Process webhook and internal maintenance events through one deduplicated recorder-backed path
    mode: queued
    max: 30

    trigger:
      - platform: webhook
        id: webhook
        webhook_id: bearclaw_maintenance_log_v1
        allowed_methods:
          - POST
          - PUT
        local_only: false
      - platform: event
        id: internal_event
        event_type: maintenance_log

    variables:
      payload: >-
        {% if trigger.id == 'webhook' and trigger.json is mapping %}
          {{ trigger.json }}
        {% elif trigger.id == 'internal_event' and trigger.event.data is mapping %}
          {{ trigger.event.data }}
        {% else %}
          {{ dict() }}
        {% endif %}
      source_item: "{{ payload.item_key | default('', true) | string | trim | lower }}"
      item_key: >-
        {% set aliases = {
          'water_softener_salt': 'water_softener_salt',
          'softener_salt': 'water_softener_salt',
          'water_softener': 'water_softener_salt',
          'softener': 'water_softener_salt',
          'water softener salt': 'water_softener_salt',
          'salt': 'water_softener_salt',
          'softner': 'water_softener_salt'
        } %}
        {{ aliases.get(source_item, source_item) }}
      action: "{{ payload.action | default('add', true) | string | trim | lower }}"
      source_unit: "{{ payload.amount_unit | default('lb', true) | string | trim | lower }}"
      unit: >-
        {% set units = {
          'lb': 'lb',
          'lbs': 'lb',
          'pound': 'lb',
          'pounds': 'lb'
        } %}
        {{ units.get(source_unit, source_unit) }}
      amount_value: "{{ payload.amount_value | default(0, true) | float(0) }}"
      amount_lb: >-
        {% if unit == 'lb' %}
          {{ amount_value | round(2) }}
        {% else %}
          0
        {% endif %}
      occurred_at_raw: "{{ payload.occurred_at | default(now().isoformat(), true) }}"
      occurred_at: >-
        {% set parsed = as_datetime(occurred_at_raw, default=none) %}
        {% if parsed is none %}
          {{ now().isoformat() }}
        {% else %}
          {{ parsed.isoformat() }}
        {% endif %}
      occurred_local_datetime: >-
        {% set dt = as_local(as_datetime(occurred_at, default=now())) %}
        {{ dt.strftime('%Y-%m-%d %H:%M:%S') }}
      occurred_display: >-
        {% set dt = as_datetime(occurred_local_datetime, default=now()) %}
        {{ dt.strftime('%Y-%m-%d %I:%M %p') | replace(' 0', ' ') }}
      actor: "{{ payload.actor | default('unknown', true) | string | trim }}"
      raw_text: "{{ payload.raw_text | default('', true) | string | replace('|', '/') | trim }}"
      event_id: >-
        {% set raw_id = payload.event_id | default('', true) | string | trim %}
        {% if raw_id %}
          {{ raw_id }}
        {% elif as_timestamp(payload.occurred_at | default(none), none) is not none %}
          refill_{{ [as_timestamp(occurred_at), actor, raw_text] | to_json | sha256 }}
        {% else %}
          maint_{{ trigger.event.context.id if trigger.id == 'internal_event' else now().isoformat() }}
        {% endif %}
      parse_confidence: "{{ payload.parse_confidence | default('unknown', true) | string | trim }}"
      is_supported_item: "{{ item_key == 'water_softener_salt' }}"
      is_add_action: "{{ action in ['add', 'top_off', 'refill'] }}"
      effective_amount_lb: >-
        {% if item_key == 'water_softener_salt' and action in ['add', 'top_off', 'refill'] %}
          80
        {% else %}
          {{ amount_lb }}
        {% endif %}
      note_value: >-
        {% set text = raw_text if raw_text else 'Logged by Joanna webhook.' %}
        {{ (text | string)[:255] }}

    action:
      # Read the helpers and journal only once this request reaches the front of the queue.
      - variables:
          journal: >-
            {% set saved = state_attr('sensor.water_softener_salt_refill_journal', 'journal') %}
            {% if saved is mapping %}
              {{ saved }}
            {% elif states.sensor.water_softener_salt_refill_journal is not none
                 and has_value('counter.water_softener_salt_event_count')
                 and has_value('input_number.water_softener_salt_total_added_lb')
                 and (states('counter.water_softener_salt_event_count') | int == 0
                      or (has_value('input_text.water_softener_salt_recent_event_ids')
                          and has_value('input_text.water_softener_salt_recent_events')
                          and has_value('input_datetime.water_softener_salt_last_occurred_at')
                          and has_value('input_number.water_softener_salt_last_amount_lb'))) %}
              {% from 'softener_salt.jinja' import legacy_journal %}
              {{ (legacy_journal | as_function)() }}
            {% else %}
              {{ none }}
            {% endif %}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ not is_supported_item }}"
            sequence:
              - service: script.send_to_logbook
                data:
                  topic: MAINTENANCE
                  message: >-
                    Ignored unsupported maintenance item "{{ item_key }}" (event_id={{ event_id }}).
          - conditions:
              - condition: template
                value_template: "{{ not is_add_action or effective_amount_lb <= 0 }}"
            sequence:
              - service: script.send_to_logbook
                data:
                  topic: MAINTENANCE
                  message: >-
                    Ignored maintenance payload with invalid amount (event_id={{ event_id }}, raw_amount={{ amount_value }} {{ unit }}).
          - conditions:
              - condition: template
                value_template: "{{ journal is not mapping }}"
            sequence:
              - stop: "Salt history is unavailable; retry this event when the helpers have loaded."
                error: true
        default:
          - variables:
              duplicate: "{{ event_id | string in journal.ids }}"
              updated: >-
                {% if duplicate %}
                  {{ journal }}
                {% else %}
                  {% set entry = dict(at=as_timestamp(occurred_at) | int, lb=effective_amount_lb, note=note_value | string) %}
                  {{ dict(records=([entry] + journal.records) | sort(attribute='at', reverse=true),
                          ids=[event_id | string] + journal.ids, count=journal['count'] + 1,
                          total=(journal.total + effective_amount_lb) | round(2)) }}
                {% endif %}
          - if: "{{ not duplicate or state_attr('sensor.water_softener_salt_refill_journal', 'journal') is none }}"
            then:
              - event: water_softener_salt_journal_updated
                event_data:
                  journal: "{{ updated }}"
              - wait_template: "{{ state_attr('sensor.water_softener_salt_refill_journal', 'journal') == updated }}"
                timeout: "00:00:10"
                continue_on_timeout: false

          # Write absolute values so retrying an interrupted update repairs its displays.
          - action: input_number.set_value
            target:
              entity_id: input_number.water_softener_salt_total_added_lb
            data:
              value: "{{ updated.total }}"
          - action: counter.set_value
            target:
              entity_id: counter.water_softener_salt_event_count
            data:
              value: "{{ updated['count'] }}"
          - if: "{{ updated.records | length > 0 }}"
            then:
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.water_softener_salt_last_occurred_at
                data:
                  timestamp: "{{ updated.records[0].at }}"
              - action: input_number.set_value
                target:
                  entity_id: input_number.water_softener_salt_last_amount_lb
                data:
                  value: "{{ updated.records[0].lb }}"
              - action: input_text.set_value
                target:
                  entity_id: input_text.water_softener_salt_last_note
                data:
                  value: "{{ updated.records[0].note }}"
          - action: input_text.set_value
            target:
              entity_id: input_text.water_softener_salt_recent_event_ids
            data:
              value: >-
                {% set text = updated.ids[:8] | join('|') %}
                {{ text if text | length <= 255 else text[:256].rsplit('|', 1)[0] if '|' in text[:256] else '' }}
          - action: input_text.set_value
            target:
              entity_id: input_text.water_softener_salt_recent_events
            data:
              value: >-
                {% from 'softener_salt.jinja' import recent_history %}
                {{ recent_history(updated.records) }}
          - action: script.send_to_logbook
            data:
              topic: MAINTENANCE
              message: >-
                {% if duplicate %}
                  Duplicate maintenance event ignored for softener salt (event_id={{ event_id }}).
                {% else %}
                  Softener salt logged: {{ effective_amount_lb | round(1) }} lb at {{ occurred_display }}.
                  total={{ updated.total }} lb, count={{ updated['count'] }},
                  actor={{ actor }}, confidence={{ parse_confidence }}, event_id={{ event_id }},
                  raw="{{ raw_text | truncate(110, true, '...') }}".
                {% endif %}
