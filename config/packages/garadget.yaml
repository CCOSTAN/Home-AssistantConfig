######################################################################
# @CCOSTAN - Follow Me on X
# For more info visit https://www.vcloudinfo.com/click-here
# Original Repo : https://github.com/CCOSTAN/Home-AssistantConfig
# -------------------------------------------------------------------
# Garadget Garage Doors - MQTT cover control and monitoring
# Related Issue: 1773, 1996, 2005, 2055
#  Open/close commands, status polling, and notifications.
# -------------------------------------------------------------------
# Notes: Debounces garage door open/close triggers to reduce noisy
#  state flapping from spamming lights, speech, and Alexa displays.
# Notes: Reflection sensors retain MQTT samples for alignment and fault history.
# Notes: Alignment alerts require 30 minutes of valid low reflection while
#  the corresponding Garadget reports closed. Snoozes are per door and restore.
# Notes: Owns the restart-safe garbage reminder snooze timer shared by
#  the garage reminder and household speech paths.
# Notes: Garage door reminders share a one-hour phone/speech snooze. It
#  resets when both doors close and does not survive Home Assistant restarts.
# Notes: The garage_door_reminder tag replaces the previous check-doors push.
# Setup: https://www.vcloudinfo.com/2019/03/how-to-add-garadget-to-home-assistant.html
# Token fix: https://www.vcloudinfo.com/2020/05/fixing-garadget-in-home-assistant.html
# Video: https://youtu.be/wFO0H5zgnzk
# Companion post: https://www.vcloudinfo.com/2026/05/home-assistant-garage-automations-arrival-alerts-tesla.html
# Hardware: Garadget unit https://amzn.to/2jQLpVQ
######################################################################

mqtt:
  cover:
    - name: "Large Garage Door"
      unique_id: garadget_large_garage_door_cover
      device_class: 'garage'
      command_topic: "garadget/GLarge/command"
      state_topic: "garadget/GLarge/status"
      value_template: >-
        {% if value_json.status == 'closed' %}
          closed
        {% else %}
          open
        {% endif %}
      payload_open: "open"
      payload_close: "close"
      payload_stop: "stop"

    - name: "Small Garage Door"
      unique_id: garadget_small_garage_door_cover
      device_class: 'garage'
      command_topic: "garadget/GSmall/command"
      state_topic: "garadget/GSmall/status"
      value_template: >-
        {% if value_json.status == 'closed' %}
          closed
        {% else %}
          open
        {% endif %}
      payload_open: "open"
      payload_close: "close"
      payload_stop: "stop"

  sensor:
    - name: "Large Garage Door Since"
      unique_id: garadget_large_garage_door_since
      state_topic: "garadget/GLarge/status"
      value_template: '{{ value_json.time }}'

    - name: "Large Garage Door Brightness"
      unique_id: garadget_large_garage_door_brightness
      state_topic: "garadget/GLarge/status"
      unit_of_measurement: '%'
      state_class: measurement
      value_template: '{{ value_json.bright }}'

    - name: "Large Garage Reflection Rate"
      unique_id: garadget_large_garage_reflection_rate
      state_topic: "garadget/GLarge/status"
      unit_of_measurement: '%'
      state_class: measurement
      expire_after: 180
      value_template: >-
        {{ value_json.sensor if value_json is mapping and is_number(value_json.get('sensor')) else 'None' }}

    - name: "Small Garage Door Since"
      unique_id: garadget_small_garage_door_since
      state_topic: "garadget/GSmall/status"
      value_template: '{{ value_json.time }}'

    - name: "Small Garage Door Brightness"
      unique_id: garadget_small_garage_door_brightness
      state_topic: "garadget/GSmall/status"
      unit_of_measurement: '%'
      state_class: measurement
      value_template: '{{ value_json.bright }}'

    - name: "Small Garage Reflection Rate"
      unique_id: garadget_small_garage_reflection_rate
      state_topic: "garadget/GSmall/status"
      unit_of_measurement: '%'
      state_class: measurement
      expire_after: 180
      value_template: >-
        {{ value_json.sensor if value_json is mapping and is_number(value_json.get('sensor')) else 'None' }}

template:
  - binary_sensor:
      - name: Large Garage Reflection Low
        unique_id: large_garage_reflection_low
        device_class: problem
        delay_on: "00:30:00"
        state: >-
          {% from 'garadget.jinja' import low_reflection %}
          {{ low_reflection('large') }}

      - name: Small Garage Reflection Low
        unique_id: small_garage_reflection_low
        device_class: problem
        delay_on: "00:30:00"
        state: >-
          {% from 'garadget.jinja' import low_reflection %}
          {{ low_reflection('small') }}

input_text:
  last_person_home:
    name: Last Person Home
    initial: 'Carlo'

timer:
  large_garage_reflection_snooze:
    name: Large Garage Reflection Snooze
    duration: "24:00:00"
    restore: true

  small_garage_reflection_snooze:
    name: Small Garage Reflection Snooze
    duration: "24:00:00"
    restore: true

  garage_door_reminder_snooze:
    name: Garage Door Reminder Snooze
    duration: "01:00:00"
    restore: false
    icon: mdi:timer-pause-outline

  garbage_reminder_snooze:
    name: Garbage Reminder Snooze
    duration: "00:30:00"
    restore: true
    icon: mdi:timer-pause-outline

group:
  garage_doors:     # This group is used to check if doors are open or Closed.
    name: Garage Doors
    entities:
      - cover.large_garage_door
      - cover.small_garage_door

script:
  open_large_garage_door_if_ready:
    alias: Open Large Garage Door If Ready
    mode: single
    fields:
      person_name:
        description: Optional person name for arrival logging.
        example: Carlo
    sequence:
      - condition: state
        entity_id: cover.large_garage_door
        state: 'closed'
      - condition: state
        entity_id: group.family
        state: 'home'
      # - condition: state
      #   entity_id: group.bed
      #   state: 'off'
      - service: cover.open_cover
        target:
          entity_id: cover.large_garage_door
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ person_name | default('', true) | trim != '' }}"
            sequence:
              - service: input_text.set_value
                target:
                  entity_id: input_text.last_person_home
                data:
                  value: "{{ person_name }}"
              - service: script.send_to_logbook
                data:
                  topic: "GARAGE"
                  message: "Large Garage was auto-opened for {{ person_name }}."

automation:
  - alias: Small Garage Lights After Dark
    id: small_garage_lights_after_dark
    description: >-
      A door opening or Garagecam detecting a person turns on the small garage
      fixture between civil dusk and dawn. In daylight, person detection can
      start it once both doors are closed. Both doors must stay closed and
      occupancy clear for 20 minutes to turn it off. If detection is switched
      off, use the doors alone. An automation reload or restart ends the run.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: garage_door.opened
        id: door_opened
        target:
          entity_id: &garage_light_doors
            - cover.large_garage_door
            - cover.small_garage_door
      - trigger: garage_door.closed
        id: door_closed
        target:
          entity_id: *garage_light_doors
      - trigger: occupancy.detected
        id: person_detected
        target:
          entity_id: binary_sensor.garagecam_person_occupancy_2
    conditions:
      - condition: or
        conditions:
          - alias: A door opened after dark
            condition: and
            conditions:
              - condition: trigger
                id: door_opened
              - &garage_light_dark
                condition: sun.elevation
                options:
                  threshold:
                    type: below
                    value:
                      number: -6
          - alias: A person is inside with both doors closed or was detected after dark
            condition: and
            conditions:
              - condition: trigger
                id:
                  - person_detected
                  - door_closed
              - condition: state
                entity_id:
                  - switch.garagecam_detect_2
                  - binary_sensor.garagecam_person_occupancy_2
                state: 'on'
              - condition: or
                conditions:
                  - condition: state
                    entity_id: *garage_light_doors
                    state: 'closed'
                  - condition: and
                    conditions:
                      - condition: trigger
                        id: person_detected
                      - *garage_light_dark
    actions:
      - action: light.turn_on
        target:
          entity_id: light.garage_lights
      - repeat:
          sequence:
            - alias: Wait for both doors closed and no person detected
              wait_template: >-
                {{ is_state('cover.large_garage_door', 'closed')
                   and is_state('cover.small_garage_door', 'closed')
                   and (is_state('switch.garagecam_detect_2', 'off')
                        or (is_state('switch.garagecam_detect_2', 'on')
                            and is_state('binary_sensor.garagecam_person_occupancy_2', 'off'))) }}
            - alias: Restart the hold when a door or the occupancy inputs change
              wait_for_trigger:
                - trigger: state
                  entity_id:
                    - cover.large_garage_door
                    - cover.small_garage_door
                    - binary_sensor.garagecam_person_occupancy_2
                    - switch.garagecam_detect_2
                  to: null
              timeout: &garage_lights_hold "00:20:00"
          until:
            - "{{ not wait.completed }}"
            - condition: state
              entity_id:
                - cover.large_garage_door
                - cover.small_garage_door
              state: 'closed'
              for: *garage_lights_hold
            - condition: or
              conditions:
                - condition: state
                  entity_id: switch.garagecam_detect_2
                  state: 'off'
                  for: *garage_lights_hold
                - condition: and
                  conditions:
                    - condition: state
                      entity_id: switch.garagecam_detect_2
                      state: 'on'
                      for: *garage_lights_hold
                    - condition: state
                      entity_id: binary_sensor.garagecam_person_occupancy_2
                      state: 'off'
                      for: *garage_lights_hold
      - action: light.turn_off
        target:
          entity_id: light.garage_lights

  - alias: Garage Light Switch Power Reminder
    id: garage_light_switch_power_reminder
    description: Remind through the Garage Echo if both bulbs on the shared fixture lose contact.
    mode: single
    triggers:
      - trigger: state
        entity_id: light.garage_lights
        from:
          - 'on'
          - 'off'
        to: 'unavailable'
        for: "00:00:30"
    conditions:
      # The group can also be unavailable if its members are missing during setup.
      - condition: state
        entity_id:
          - light.dimmable_light_1_2
          - light.garage_2_bulb
        state: 'unavailable'
    actions:
      - action: notify.send_message
        target:
          entity_id: notify.garage_speak
        data:
          message: "The garage light switch may be off. Please turn it back on."

  - alias: Garadget Reflection Maintenance Alert
    id: garadget_reflection_maintenance_alert
    mode: queued
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.large_garage_reflection_low
          - binary_sensor.small_garage_reflection_low
        to: 'on'
        id: low
      - trigger: state
        entity_id:
          - binary_sensor.large_garage_reflection_low
          - binary_sensor.small_garage_reflection_low
        from: 'on'
        to: 'off'
        id: clear
      - trigger: state
        entity_id:
          - timer.large_garage_reflection_snooze
          - timer.small_garage_reflection_snooze
        from: 'active'
        to: 'idle'
        id: expired
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: GARADGET_REFLECTION_LARGE_1D
        id: snooze
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: GARADGET_REFLECTION_LARGE_3D
        id: snooze
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: GARADGET_REFLECTION_SMALL_1D
        id: snooze
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: GARADGET_REFLECTION_SMALL_3D
        id: snooze
    variables:
      door: >-
        {{ trigger.event.data.action.split('_')[2] | lower if trigger.id == 'snooze'
           else trigger.entity_id.split('.')[1].split('_')[0] }}
      alert_entity: "binary_sensor.{{ door }}_garage_reflection_low"
      snooze_timer: "timer.{{ door }}_garage_reflection_snooze"
      notification_tag: "garadget_reflection_{{ door }}"
    actions:
      - condition: template
        value_template: >-
          {{ is_state(snooze_timer, 'idle')
             and is_state(alert_entity, 'off' if trigger.id == 'clear' else 'on') }}
      - if:
          - condition: trigger
            id: snooze
        then:
          - action: timer.start
            target:
              entity_id: "{{ snooze_timer }}"
            data:
              duration: "{{ 259200 if trigger.event.data.action.endswith('_3D') else 86400 }}"
      - if:
          - condition: trigger
            id:
              - clear
              - snooze
        then:
          - action: script.notify_engine
            data:
              who: carlo
              tag: "{{ notification_tag }}"
              value1: clear_notification
          - stop: Garage alignment notification cleared.
      - action: script.notify_engine
        data:
          title: "Align the {{ door }} Garadget"
          value1: "Reflection is {{ states('sensor.' ~ door ~ '_garage_reflection_rate') }}% with the door closed."
          who: carlo
          group: Maintenance
          tag: "{{ notification_tag }}"
          url: /dashboard-infrastructure/car
          notification_icon: mdi:garage-alert
          color: "#C2410C"
          title1: Snooze 1 day
          action1: "GARADGET_REFLECTION_{{ door | upper }}_1D"
          icon1: sfsymbols:clock
          title2: Snooze 3 days
          action2: "GARADGET_REFLECTION_{{ door | upper }}_3D"
          icon2: sfsymbols:calendar

  ######################################################################
  ##  Automation: Auto-open Large Garage Door when someone comes home
  ######################################################################
  - alias: 'Auto Open Large Garage Door On Arrival'
    id: 7e2b1c3a-4b1e-4b2a-9c1a-automated_garage_door
    mode: single
    trigger:
      - platform: state
        entity_id:
          - person.carlo
          - person.stacey
        from: 'driving'
        to: 'home'
    action:
      - service: script.open_large_garage_door_if_ready
        data:
          person_name: "{{ trigger.to_state.entity_id.split('.')[1] }}"

######################################################################
##  Entry helper prompt after arrival if auto-open didn’t fire.
######################################################################

  - alias: 'Entry Helper'
    id: 365adc21-5e96-4e78-9e94-089901a29430
    mode: parallel
    trigger:
      - platform: state
        entity_id:
          - person.carlo
          - person.stacey
        to: 'home'
    condition:
        - condition: state
          entity_id: cover.large_garage_door
          state: 'closed'
    action:
      # Give the auto-open routine a chance to fire; if the door opened, skip the prompt.
      - delay: "00:00:25"
      - choose:
          - conditions:
              - condition: state
                entity_id: cover.large_garage_door
                state: 'closed'
            sequence:
              - service: input_text.set_value
                target:
                  entity_id: input_text.last_person_home
                data:
                  value: "{{ trigger.to_state.entity_id.split('.')[1] }}"
              - service: script.notify_engine_two_button
                data:
                  title: 'Welcome Home!'
                  value1: 'Choose: unlock front door or open garage?'
                  title1: 'Unlock Door'
                  action1: 'UNLOCK_FRONT_DOOR'
                  icon1: 'sfsymbols:lock.open'
                  destructive1: 'false'
                  title2: 'Open Garage'
                  action2: 'OPEN_LARGE_GARAGE'
                  icon2: 'sfsymbols:arrow.up.circle'
                  destructive2: 'false'
                  who: "{{ states('input_text.last_person_home') }}"
                  group: 'Welcome_Home'

  - alias: 'Open Large Garage Door Action'
    id: 85e02a74-2ecc-4815-95a6-db864a6dffd7
    trigger:
      platform: event
      event_type: mobile_app_notification_action
      event_data:
        action: OPEN_LARGE_GARAGE
    action:
      - service: script.open_large_garage_door_if_ready

  - alias: 'Unlock Front Door Action'
    id: c3106db1-f2c4-4800-b1a3-76d440228600
    trigger:
      platform: event
      event_type: mobile_app_notification_action
      event_data:
        action: UNLOCK_FRONT_DOOR
    action:
      - service: lock.unlock
        entity_id: lock.front_door

  ######################################################################
  ##  Auto-unlock front door when Paige or Justin arrive from driving
  ######################################################################
  - alias: 'Auto Unlock Front Door on Arrival (Paige/Justin)'
    id: 8f4f5f6a-9c2d-4f4c-9f6c-7d5e5b2e2c3d
    mode: single
    trigger:
      - platform: state
        entity_id:
          - person.paige
          - person.justin
        from: 'driving'
        to: 'home'
    variables:
      arriving_person: >-
        {{ (trigger.to_state.name | replace('Life360 ', '')).split(' ')[0] }}
    condition:
      - condition: state
        entity_id: lock.front_door
        state: 'locked'
    action:
      - service: lock.unlock
        target:
          entity_id: lock.front_door
      - service: script.notify_engine
        data:
          title: "Front door auto-unlocked"
          value1: "Unlocking for {{ arriving_person }} arriving from driving."
          who: "family"
          group: "Welcome_Home"
      - service: script.send_to_logbook
        data:
          topic: "DOORS"
          message: "Front door auto-unlocked for {{ arriving_person }} arriving from driving."


######################################################################
##  Garage Status Announcements - Only during normal hours.
######################################################################

  - alias: 'Update Garage Get-Status'
    id: 2b9e8359-c189-4399-b415-50107513fe90
    trigger:
      - platform: time_pattern
        minutes: '/1'
    action:
      - service: mqtt.publish
        data:
          topic: "garadget/GSmall/command"
          payload: "get-status"

      - service: mqtt.publish
        data:
          topic: "garadget/GLarge/command"
          payload: "get-status"

  - alias: Is the Garage door Open at night - Checks every 30 minutes or 5 minutes after we drive away.
    id: 4eb3e83e-4484-4102-a4ca-6bacd5b3cbdd
    description: >-
      Remind the family about open garage doors at night or while away.
      A shared one-hour snooze pauses phone and spoken reminders.
    mode: restart

    trigger:
      - platform: time_pattern
        minutes: '/30'

      - platform: state
        entity_id: group.family
        to: not_home
        for: 00:05:00

      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: SNOOZE_GARAGE_DOOR_REMINDERS_1H
        id: snooze

      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.garage_door_reminder_snooze

      - platform: state
        entity_id: group.garage_doors
        to: 'closed'
        for: "00:00:20"
        id: doors_closed

    action:
      - choose:
          - conditions:
              - condition: trigger
                id: doors_closed
            sequence:
              - service: timer.cancel
                target:
                  entity_id: timer.garage_door_reminder_snooze
              - stop: "Both garage doors closed; clear the reminder snooze."

      # Ignore old phone actions once the garage is closed.
      - condition: state
        entity_id: group.garage_doors
        state: 'open'

      - choose:
          - conditions:
              - condition: trigger
                id: snooze
            sequence:
              - service: timer.start
                target:
                  entity_id: timer.garage_door_reminder_snooze
              - service: script.send_to_logbook
                data:
                  topic: "GARAGE"
                  message: "Garage door phone and spoken reminders snoozed for 1 hour."
              - stop: "Garage door reminder snooze started."

      - condition: state
        entity_id: timer.garage_door_reminder_snooze
        state: 'idle'
      - condition: or
        conditions:
          - condition: state
            entity_id: sun.sun
            state: 'below_horizon'
          - condition: state
            entity_id: group.family
            state: not_home
            for: 00:05:00

      - service: script.notify_engine
        data:
          notification_icon: "mdi:garage-open"
          color: "#C2410C"
          title: 'Check Garage Doors:'
          value1: >
            {% set open = [
              'Small garage door' if is_state('cover.small_garage_door', 'open') else '',
              'Large garage door' if is_state('cover.large_garage_door', 'open') else ''
            ] | reject('eq', '') | list %}
            {% if open|length == 0 %}
              All garage doors are closed.
            {% elif open|length == 1 %}
              {{ open[0] }} is open.
            {% else %}
              {{ open|join(' and ') }} are open.
            {% endif %}
          who: "family"
          camera_entity: "camera.garagecam"
          group: 'information'
          tag: 'garage_door_reminder'
          title1: "Snooze 1 hour"
          action1: "SNOOZE_GARAGE_DOOR_REMINDERS_1H"
          icon1: "sfsymbols:clock"

      - service: script.speech_engine
        data:
          value1: "Check the garage doors. The Small garage is {{ states('cover.small_garage_door')}} and the large garage is {{ states('cover.large_garage_door')}} [Always mention the specific garage door that is currently open and remind us to close it for the night]"
