# -------------------------------------------------------------------
# Landscape Lighting - Schedules and recovery for the Tuya Smart Life outlets.
# Related Issue: 684
#  Catch up a missed morning shutoff when an unavailable outlet returns on.
# -------------------------------------------------------------------
######################################################################
# Outlets managed via Smart_Life package.
group:
  landscaping:
    entities:
      - switch.front_landscaping
      - switch.back_landscaping
      # - switch.villaneri
#-------------------------------------------
# Automation : Added to Sunset_ON
# Automation : Added to Sunset_OFF
# Automation : Added to Away. (Switches off Back Landscaping)
# Automation : Added to Late Night Helper Outside (Switches Back lights on)
automation:
    - alias: 'Landscape lights off'
      id: 05172967-9309-4624-8633-4f8bce4f3aa1
      mode: single
      max_exceeded: silent
      trigger:
        - platform: state
          entity_id:
            - binary_sensor.sleepnumber_carlo_carlo_is_in_bed
            - binary_sensor.sleepnumber_carlo_stacey_is_in_bed
          to: 'on'

      condition:
        - condition: or
          conditions:
            - condition: state
              entity_id: binary_sensor.sleepnumber_carlo_carlo_is_in_bed
              state: 'on'
            - condition: state
              entity_id: person.carlo
              state: 'not_home'
        - condition: or
          conditions:
            - condition: state
              entity_id: binary_sensor.sleepnumber_carlo_stacey_is_in_bed
              state: 'on'
            - condition: state
              entity_id: person.stacey
              state: 'not_home'

      action:
        - service: switch.turn_off
          entity_id: switch.back_landscaping

        - wait_template: >-
           {{ is_state('group.bed', 'on') }}
          timeout: "08:00:00"
          continue_on_timeout: false

        - delay: '0{{ range(0,2) | random | int }}:{{ range(0,5) | random | int }}{{ range(0,9) | random | int }}:00'

        - service: homeassistant.turn_off
          entity_id: group.landscaping

    - alias: 'Recover missed morning landscaping shutoff'
      id: recover_missed_morning_landscaping_shutoff
      mode: restart
      triggers:
        # Both morning routines emit this immediately before their outlet off command.
        - trigger: event
          event_type: landscaping_morning_shutoff
        - trigger: sun
          event: sunset
          offset: "-00:15:00"
          id: evening
      actions:
        # Restart mode cancels pending waits at the evening lighting boundary.
        - condition: not
          conditions:
            - condition: trigger
              id: evening
        - &morning_window
          condition: sun
          after: sunrise
          after_offset: "-02:00:00"
          before: sunset
          before_offset: "-00:15:00"
        - parallel:
            - alias: Recover the front outlet
              sequence:
                - condition: template
                  value_template: "{{ not has_value('switch.front_landscaping') }}"
                - wait_template: "{{ is_state('switch.front_landscaping', ['on', 'off']) }}"
                - condition: state
                  entity_id: switch.front_landscaping
                  state: 'on'
                - *morning_window
                - action: switch.turn_off
                  target:
                    entity_id: switch.front_landscaping
            - alias: Recover the back outlet
              sequence:
                - condition: template
                  value_template: "{{ not has_value('switch.back_landscaping') }}"
                - wait_template: "{{ is_state('switch.back_landscaping', ['on', 'off']) }}"
                - condition: state
                  entity_id: switch.back_landscaping
                  state: 'on'
                - *morning_window
                - action: switch.turn_off
                  target:
                    entity_id: switch.back_landscaping
