# Original Repo : https://github.com/CCOSTAN/Home-AssistantConfig
# -------------------------------------------------------------------
# Holiday Package - Flag/holiday sensors and lighting mode
# Related Issue: 1774
#  Centralizes holiday calendar data and the active exterior lighting mode.
# -------------------------------------------------------------------
# Video: https://youtu.be/QzrfDFA7htc
# Blog: https://www.vcloudinfo.com/2026/10/home-assistant-local-holiday-countdowns-python-codex.html
# Notes: holiday_countdowns.py calculates floating dates and all nine countdowns locally.
# Notes: config/www/json_data holds fixed household dates and optional one-off additions.
# Notes: Existing IDs stay stable; calendars/countdowns refresh at startup and local midnight.
# Notes: Hanukkah lighting spans eight evenings, beginning before 25 Kislev; flag days retain priority.
######################################################################
# Video breakdown: https://www.vcloudinfo.com/2019/02/breaking-down-the-flag-sensor-in-home-assistant.html
# Modified for my own fun stuff!

homeassistant:
  customize:

    sensor.holiday:

      icon: mdi:beach
      friendly_name: US Holiday
    sensor.flag:

      icon: mdi:flag
      friendly_name: Flag Day

command_line:
  - sensor:
      name: Holiday
      unique_id: holiday_calendar
      command: "python3 /config/shell_scripts/holiday_countdowns.py holiday"
      value_template: "{{ value_json.state }}"
      json_attributes:
        - MAJOR_US
      scan_interval: 86400
  - sensor:
      name: Flag
      unique_id: flag_calendar
      command: "python3 /config/shell_scripts/holiday_countdowns.py flag"
      value_template: "{{ value_json.state }}"
      json_attributes:
        - Flag_Days_US
      scan_interval: 86400
  - sensor:
      name: Halloween Countdown
      unique_id: halloween_countdown
      command: "python3 /config/shell_scripts/holiday_countdowns.py halloween"
      unit_of_measurement: Days
      scan_interval: 86400
  - sensor:
      name: Christmas Countdown
      unique_id: christmas_countdown
      command: "python3 /config/shell_scripts/holiday_countdowns.py christmas"
      unit_of_measurement: Days
      scan_interval: 86400
  - sensor:
      name: Easter Countdown
      unique_id: easter_countdown
      command: "python3 /config/shell_scripts/holiday_countdowns.py easter"
      unit_of_measurement: Days
      scan_interval: 86400
  - sensor:
      name: Mothers Countdown
      unique_id: mothers_countdown
      command: "python3 /config/shell_scripts/holiday_countdowns.py mothers"
      unit_of_measurement: Days
      scan_interval: 86400
  - sensor:
      name: Fathers Countdown
      unique_id: fathers_countdown
      command: "python3 /config/shell_scripts/holiday_countdowns.py fathers"
      unit_of_measurement: Days
      scan_interval: 86400
  - sensor:
      name: Chanukkah Countdown
      unique_id: chanukkah_countdown
      command: "python3 /config/shell_scripts/holiday_countdowns.py chanukkah"
      unit_of_measurement: Days
      scan_interval: 86400
  - sensor:
      name: Labor Day Countdown
      unique_id: labor_day_countdown
      command: "python3 /config/shell_scripts/holiday_countdowns.py labor_day"
      unit_of_measurement: Days
      scan_interval: 86400
  - sensor:
      name: Memorial Day Countdown
      unique_id: memorial_day_countdown
      command: "python3 /config/shell_scripts/holiday_countdowns.py memorial_day"
      unit_of_measurement: Days
      scan_interval: 86400
  - sensor:
      name: Thanksgiving Day Countdown
      unique_id: thanksgiving_day_countdown
      command: "python3 /config/shell_scripts/holiday_countdowns.py thanksgiving_day"
      unit_of_measurement: Days
      scan_interval: 86400

automation:
  - alias: Holiday Countdown Midnight Refresh
    id: holiday_countdown_midnight_refresh
    mode: single
    triggers:
      - trigger: time
        at: "00:00:05"
    actions:
      - action: homeassistant.update_entity
        target:
          entity_id:
            - sensor.holiday
            - sensor.flag
            - sensor.halloween_countdown
            - sensor.christmas_countdown
            - sensor.easter_countdown
            - sensor.mothers_countdown
            - sensor.fathers_countdown
            - sensor.chanukkah_countdown
            - sensor.labor_day_countdown
            - sensor.memorial_day_countdown
            - sensor.thanksgiving_day_countdown

template:
  - sensor:
      - name: Holiday Lighting Mode
        unique_id: holiday_lighting_mode
        icon: mdi:string-lights
        state: >-
          {%- set today = now().date() -%}
          {%- set mmdd = now().strftime('%m%d') | int -%}
          {%- set holiday_data = state_attr('sensor.holiday', 'MAJOR_US') or {} -%}
          {%- set holiday_dynamic = holiday_data.get('dynamic', {}) if holiday_data is mapping else {} -%}
          {%- set dates = namespace(mardi_gras=false, hanukkah=false) -%}
          {%- set mode = namespace(value='standard') -%}
          {%- for date_text, names in holiday_dynamic.items() -%}
            {%- set event_date = strptime(date_text, '%m/%d/%Y', none) -%}
            {%- if event_date is not none -%}
              {%- set days = (event_date.date() - today).days -%}
              {%- if 'Mardi Gras' in names.split('; ') and days == 0 -%}
                {%- set dates.mardi_gras = true -%}
              {%- elif 'Chanukkah' in names.split('; ') and -6 <= days <= 1 -%}
                {%- set dates.hanukkah = true -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {%- if is_state('sensor.flag', 'True') -%}
            {%- set mode.value = 'RWB' -%}
          {%- elif mmdd == 101 -%}
            {%- set mode.value = 'new_years_day' -%}
          {%- elif dates.mardi_gras -%}
            {%- set mode.value = 'mardi_gras' -%}
          {%- elif mmdd >= 210 and mmdd <= 214 -%}
            {%- set mode.value = 'valentine' -%}
          {%- elif mmdd == 314 -%}
            {%- set mode.value = 'pi' -%}
          {%- elif mmdd >= 315 and mmdd <= 317 -%}
            {%- set mode.value = 'st_patty' -%}
          {%- elif 0 <= states('sensor.easter_countdown') | int(9999) < 4 -%}
            {%- set mode.value = 'easter' -%}
          {%- elif mmdd == 504 -%}
            {%- set mode.value = 'starwars' -%}
          {%- elif mmdd == 505 -%}
            {%- set mode.value = 'cinco_de_mayo' -%}
          {%- elif 0 <= states('sensor.mothers_countdown') | int(9999) < 4 -%}
            {%- set mode.value = 'mothers_day' -%}
          {%- elif 0 <= states('sensor.fathers_countdown') | int(9999) < 4 -%}
            {%- set mode.value = 'fathers_day' -%}
          {%- elif 0 <= states('sensor.memorial_day_countdown') | int(9999) < 3 -%}
            {%- set mode.value = 'RWB' -%}
          {%- elif mmdd == 704 -%}
            {%- set mode.value = 'RWB' -%}
          {%- elif 0 <= states('sensor.labor_day_countdown') | int(9999) < 3 -%}
            {%- set mode.value = 'RWB' -%}
          {%- elif mmdd >= 1001 and mmdd <= 1031 -%}
            {%- set mode.value = 'halloween' -%}
          {%- elif mmdd == 1111 -%}
            {%- set mode.value = 'veterans' -%}
          {%- elif 0 <= states('sensor.thanksgiving_day_countdown') | int(9999) < 4 -%}
            {%- set mode.value = 'thanksgiving' -%}
          {%- elif dates.hanukkah -%}
            {%- set mode.value = 'hanukkah' -%}
          {%- elif 0 <= states('sensor.christmas_countdown') | int(9999) <= 25 -%}
            {%- set mode.value = 'christmas' -%}
          {%- elif mmdd == 1231 -%}
            {%- set mode.value = 'new_years_day' -%}
          {%- endif -%}
          {{- mode.value -}}

      - name: Holiday Lighting Scene
        unique_id: holiday_lighting_scene
        icon: mdi:palette
        state: >-
          {%- set mode = states('sensor.holiday_lighting_mode') | trim -%}
          {%- if mode in ['unknown', 'unavailable', 'none', ''] -%}
            scene.month_standard_colors
          {%- else -%}
            scene.month_{{ mode }}_colors
          {%- endif -%}
        attributes:
          mode: "{{ states('sensor.holiday_lighting_mode') }}"
          holiday: "{{ states('sensor.holiday') }}"
          flag_day: "{{ states('sensor.flag') }}"
          source: local calendar rules plus config/www/json_data household dates
