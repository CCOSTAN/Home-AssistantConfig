# Original Repo : https://github.com/CCOSTAN/Home-AssistantConfig
# -------------------------------------------------------------------
# Frigate - local package and garage bin state classification
# Related Issue: 1984, 2016
#  Classify porch packages and the separate garage bin storage positions.
# -------------------------------------------------------------------
# Notes: Frigate 0.18 classifies clear/package_present with a trained
#  custom model, motion checks, a 15-second interval, and 3-state consensus.
# Notes: Either crop can mark a package present; both must report clear
#  before clearing it. The second crop covers partial doorstep-edge boxes.
# Notes: Existing package/cans binary-sensor identities stay compatible.
#  LLM Vision is removed. Last sync records state updates, not every
#  inference; the status button reads the last verified state.
# Notes: Unknown/unavailable classifications never clear a package.
# Notes: Package alerts and manual status checks share front_door_package_check
#  so each phone keeps only its latest package notification.
# Notes: Garage labels are stored/absent/obstructed. Per household policy,
#  absent means at the curb. Sunday needs garbage; Wednesday needs both.
#  Unknown/obstructed/offline views never count as verified bins out.
#  The legacy cans helper mirrors verified out only for existing kiosks.
# Docs: https://docs.frigate.video/configuration/custom_classification/state_classification/
# Video: https://youtu.be/KpPYo_Uur7k
# Garage bins video: https://youtu.be/zcCrtwcw-S4
# Garage bins blog: https://www.vcloudinfo.com/2026/10/home-assistant-frigate-garbage-bin-reminders.html
# Blog: https://www.vcloudinfo.com/2026/10/local-package-detection-frigate-home-assistant.html
# Original LLM Vision experiment video: https://youtu.be/nAhCezFetvI
# Notification icons video: https://youtu.be/TMfdxv-WprM
# Notification icons blog: https://www.vcloudinfo.com/2026/10/home-assistant-ios-notification-icons.html
######################################################################

input_button:
  front_door_package_check:
    name: "Frigate: Front door package status"
    icon: mdi:package-variant-closed-check

input_boolean:
  garbage_cans_out:
    name: "Garbage Cans Out"
    icon: mdi:trash-can
  front_door_packages_present:
    name: "Front Door Packages Present"
    icon: mdi:package-variant-closed

input_text:
  front_door_package_classification:
    name: "Frigate front door classification"
    max: 255

input_datetime:
  front_door_package_last_sync:
    name: "Frigate front door last state sync"
    has_date: true
    has_time: true

template:
  - binary_sensor:
      - name: "Garage Garbage At Curb"
        unique_id: garage_garbage_at_curb
        icon: mdi:trash-can-check
        availability: >-
          {{ states('camera.garagecam') in ['recording', 'streaming', 'idle']
             and states('sensor.garagecam_garage_garbage_storage_classification')
                 in ['stored', 'absent'] }}
        state: "{{ is_state('sensor.garagecam_garage_garbage_storage_classification', 'absent') }}"
        attributes:
          assumption: absent_from_usual_garage_storage_means_at_curb
          classifier_state: "{{ states('sensor.garagecam_garage_garbage_storage_classification') }}"
          source_camera: camera.garagecam

      - name: "Garage Recycling At Curb"
        unique_id: garage_recycling_at_curb
        icon: mdi:recycle
        availability: >-
          {{ states('camera.garagecam') in ['recording', 'streaming', 'idle']
             and states('sensor.garagecam_garage_recycling_storage_classification')
                 in ['stored', 'absent'] }}
        state: "{{ is_state('sensor.garagecam_garage_recycling_storage_classification', 'absent') }}"
        attributes:
          assumption: absent_from_usual_garage_storage_means_at_curb
          classifier_state: "{{ states('sensor.garagecam_garage_recycling_storage_classification') }}"
          source_camera: camera.garagecam

      - name: "Garbage Cans Out"
        unique_id: llmvision_garbage_cans_out
        device_class: presence
        availability: >-
          {{ states('binary_sensor.garage_garbage_at_curb') in ['on', 'off']
             and (now().strftime('%a') != 'Wed'
                  or states('binary_sensor.garage_recycling_at_curb') in ['on', 'off']) }}
        state: >-
          {{ is_state('binary_sensor.garage_garbage_at_curb', 'on')
             and (now().strftime('%a') != 'Wed'
                  or is_state('binary_sensor.garage_recycling_at_curb', 'on')) }}
        attributes:
          classification_status: local_storage_classifiers
          source_camera: camera.garagecam
          required_bins: "{{ 'garbage_and_recycling' if now().strftime('%a') == 'Wed' else 'garbage' }}"
          garbage_at_curb: "{{ states('binary_sensor.garage_garbage_at_curb') }}"
          recycling_at_curb: "{{ states('binary_sensor.garage_recycling_at_curb') }}"

      - name: "Front Door Packages Present"
        unique_id: llmvision_front_door_packages_present
        availability: >-
          {{ states('sensor.frontdoorbell_front_door_packages_classification')
             in ['clear', 'package_present']
             and states('sensor.frontdoorbell_front_door_package_edge_classification')
             in ['clear', 'package_present'] }}
        device_class: presence
        state: "{{ is_state('input_boolean.front_door_packages_present', 'on') }}"
        attributes:
          last_sync: "{{ states('input_datetime.front_door_package_last_sync') }}"
          classification: "{{ states('input_text.front_door_package_classification') }}"
          source_camera: camera.frontdoorbell
          source_classifier: sensor.frontdoorbell_front_door_packages_classification
          source_classifier_edge: sensor.frontdoorbell_front_door_package_edge_classification
          classifier_state: "{{ states('sensor.frontdoorbell_front_door_packages_classification') }}"
          classifier_edge_state: "{{ states('sensor.frontdoorbell_front_door_package_edge_classification') }}"

automation:
  - alias: Frigate - Garage bins compatibility state
    id: frigate_garage_bins_compatibility_state
    description: "Keep existing kiosk consumers true only when today's required bins are verified out."
    mode: restart
    trigger:
      - platform: state
        entity_id: binary_sensor.garbage_cans_out
        from: null
      - platform: homeassistant
        event: start
    action:
      - variables:
          desired_bin_state: "{{ 'on' if is_state('binary_sensor.garbage_cans_out', 'on') else 'off' }}"
      - condition: template
        value_template: "{{ states('input_boolean.garbage_cans_out') != desired_bin_state }}"
      - choose:
          - conditions: "{{ desired_bin_state == 'on' }}"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.garbage_cans_out
        default:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.garbage_cans_out
      - action: script.send_to_logbook
        data:
          topic: GARBAGE
          message: >-
            Required bins verified at curb from garage storage:
            {{ states('binary_sensor.garbage_cans_out') }}.

  - alias: Frigate - Front door packages
    id: 8647b555-7ba0-41d5-98de-cfd3094e5b4f
    description: "Sync Frigate's verified local porch state to the existing package helper."
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - sensor.frontdoorbell_front_door_packages_classification
          - sensor.frontdoorbell_front_door_package_edge_classification
        from: null
        id: classification
      - platform: homeassistant
        event: start
        id: startup
      - platform: state
        entity_id: input_button.front_door_package_check
        id: manual_check
    variables:
      labels: >-
        {{ [states('sensor.frontdoorbell_front_door_packages_classification'),
            states('sensor.frontdoorbell_front_door_package_edge_classification')] }}
      classification: "{{ 'package_present' if 'package_present' in labels else 'clear' }}"
    condition:
      - condition: state
        entity_id:
          - sensor.frontdoorbell_front_door_packages_classification
          - sensor.frontdoorbell_front_door_package_edge_classification
        state:
          - clear
          - package_present
    action:
      - if:
          - condition: state
            entity_id:
              - sensor.frontdoorbell_front_door_packages_classification
              - sensor.frontdoorbell_front_door_package_edge_classification
            state: package_present
            match: any
        then:
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.front_door_packages_present
        else:
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.front_door_packages_present
      - service: input_text.set_value
        target:
          entity_id: input_text.front_door_package_classification
        data:
          value: "{{ classification }}"
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.front_door_package_last_sync
        data:
          datetime: "{{ now() }}"
      - service: script.send_to_logbook
        data:
          topic: PACKAGES
          message: "Local Frigate package state synced: {{ classification }}."
      - if:
          - condition: trigger
            id: manual_check
        then:
          - service: script.notify_engine
            data:
              title: Front door package status
              notification_icon: mdi:package-variant-closed-check
              color: '#6A1B9A'
              value1: "Frigate's last verified porch state is {{ classification | replace('_', ' ') }}."
              who: carlo
              group: information
              tag: front_door_package_check
              level: active
              camera_entity: camera.frontdoorbell

  - alias: Frigate - Front door package notify
    id: 0ddf0fb5-4600-4eff-9236-95b2af3739a6
    mode: restart
    trigger:
      - platform: state
        entity_id: input_boolean.front_door_packages_present
        to: 'on'
        for: "00:01:00"
    action:
      - variables:
          package_message: >-
            Front door camera thinks a package may be waiting at the door.
          notify_target: >-
            {% if is_state('group.family', 'home') %}
              family
            {% else %}
              carlo
            {% endif %}
      - service: script.notify_engine
        data:
          title: Package check
          notification_icon: mdi:package-variant-closed-check
          color: '#6A1B9A'
          value1: "{{ package_message }}"
          who: "{{ notify_target }}"
          group: information
          tag: front_door_package_check
          level: active
          camera_entity: camera.frontdoorbell
      - service: script.send_to_logbook
        data:
          topic: PACKAGES
          message: "{{ package_message }}"
