# @CCOSTAN - Follow Me on X
# For more info visit https://www.vcloudinfo.com/click-here
# Original Repo : https://github.com/CCOSTAN/Home-AssistantConfig
# -------------------------------------------------------------------
# Network Switches - Authenticated NETGEAR SNMP monitoring.
#  https://www.home-assistant.io/integrations/snmp/
# -------------------------------------------------------------------
# Notes: Standard IF-MIB and POWER-ETHERNET-MIB; poll once per minute.
# Notes: Link/PoE status covers every physical port; speeds/errors cover key links.
# Notes: Credentials and management hosts live only in secrets.yaml.
# Notes: Current firmware exposes no temperature/fan/CPU telemetry over these MIBs.
# Notes: Camera PoE controls exclude access points, uplinks, and compute hosts.
# Notes: Stale SNMP data becomes unknown, never a cached healthy state.
######################################################################

sensor:
  - <<: &garage_switch_snmp
      platform: snmp
      host: !secret garage_netgear_host
      version: "3"
      username: !secret netgear_snmp_username
      auth_key: !secret netgear_snmp_auth_key
      auth_protocol: hmac-md5
      accept_errors: true
      scan_interval: 60
    name: "Garage Switch Name"
    unique_id: garage_switch_name
    baseoid: "1.3.6.1.2.1.1.5.0"

  - <<: *garage_switch_snmp
    name: "Garage Switch Uptime"
    unique_id: garage_switch_uptime
    baseoid: "1.3.6.1.2.1.1.3.0"
    value_template: "{{ (value | float / 100) | round(0) }}"
    unit_of_measurement: "s"
    state_class: measurement
    device_class: duration

  - <<: *garage_switch_snmp
    name: "Garage Switch Firmware"
    unique_id: garage_switch_firmware
    baseoid: "1.3.6.1.2.1.1.1.0"
    value_template: "{{ value.split('Software Version ')[1].split(',')[0] if 'Software Version ' in value else 'unknown' }}"

  - <<: *garage_switch_snmp
    name: "Garage Switch PoE Budget"
    unique_id: garage_switch_poe_budget
    baseoid: "1.3.6.1.2.1.105.1.3.1.1.2.1"
    unit_of_measurement: "W"
    state_class: measurement
    device_class: power

  - <<: *garage_switch_snmp
    name: "Garage Switch PoE Power"
    unique_id: garage_switch_poe_power
    baseoid: "1.3.6.1.2.1.105.1.3.1.1.4.1"
    unit_of_measurement: "W"
    state_class: measurement
    device_class: power

  - <<: *garage_switch_snmp
    name: "Garage Switch PoE Supply"
    unique_id: garage_switch_poe_supply
    baseoid: "1.3.6.1.2.1.105.1.3.1.1.3.1"
    value_template: "{{ {1: 'on', 2: 'off', 3: 'fault'}.get(value | int(0), 'unknown') }}"

  - <<: *garage_switch_snmp
    name: "Garage Switch PoE Alert Threshold"
    unique_id: garage_switch_poe_alert_threshold
    baseoid: "1.3.6.1.2.1.105.1.3.1.1.5.1"
    unit_of_measurement: "%"

