switch:
  - <<: &garage_camera_poe
      platform: snmp
      host: !secret garage_netgear_host
      version: "3"
      username: !secret netgear_snmp_username
      auth_key: !secret netgear_snmp_auth_key
      auth_protocol: hmac-md5
      payload_on: 1
      payload_off: 2
      vartype: Integer
    name: "Garage Switch Front Lawn PoE"
    baseoid: "1.3.6.1.2.1.105.1.1.1.3.1.5"
    command_oid: "1.3.6.1.2.1.105.1.1.1.3.1.5"

  - <<: *garage_camera_poe
    name: "Garage Switch Driveway PoE"
    baseoid: "1.3.6.1.2.1.105.1.1.1.3.1.7"
    command_oid: "1.3.6.1.2.1.105.1.1.1.3.1.7"

  - <<: *garage_camera_poe
    name: "Garage Switch Kids Gate PoE"
    baseoid: "1.3.6.1.2.1.105.1.1.1.3.1.9"
    command_oid: "1.3.6.1.2.1.105.1.1.1.3.1.9"

  - <<: *garage_camera_poe
    name: "Garage Switch Garage Camera PoE"
    baseoid: "1.3.6.1.2.1.105.1.1.1.3.1.15"
    command_oid: "1.3.6.1.2.1.105.1.1.1.3.1.15"

template:
  - sensor:
      - name: "Garage Switch PoE Utilization"
        unique_id: garage_switch_poe_utilization
        unit_of_measurement: "%"
        state_class: measurement
        availability: "{{ is_number(states('sensor.garage_switch_poe_power')) and states('sensor.garage_switch_poe_budget') | float(0) > 0 }}"
        state: "{{ (states('sensor.garage_switch_poe_power') | float(0) / states('sensor.garage_switch_poe_budget') | float(1) * 100) | round(1) }}"

      - name: "Office Switch PoE Utilization"
        unique_id: office_switch_poe_utilization
        unit_of_measurement: "%"
        state_class: measurement
        availability: "{{ is_number(states('sensor.office_switch_poe_power')) and states('sensor.office_switch_poe_budget') | float(0) > 0 }}"
        state: "{{ (states('sensor.office_switch_poe_power') | float(0) / states('sensor.office_switch_poe_budget') | float(1) * 100) | round(1) }}"

  - binary_sensor:
      - name: "Garage Switch Problem"
        unique_id: garage_switch_problem
        device_class: problem
        state: >-
          {{ not is_state('sensor.garage_switch_poe_supply', 'on') or
             states('sensor.garage_switch_poe_utilization') | float(100) >= states('sensor.garage_switch_poe_alert_threshold') | float(95) or
             not is_state('sensor.garage_switch_port_1_link', 'up') or not is_state('sensor.garage_switch_port_2_link', 'up') or not is_state('sensor.garage_switch_port_3_link', 'up') or not is_state('sensor.garage_switch_port_4_link', 'up') or not is_state('sensor.garage_switch_port_6_link', 'up') }}

      - name: "Office Switch Problem"
        unique_id: office_switch_problem
        device_class: problem
        state: >-
          {{ not is_state('sensor.office_switch_poe_supply', 'on') or
             states('sensor.office_switch_poe_utilization') | float(100) >= states('sensor.office_switch_poe_alert_threshold') | float(95) or
             not is_state('sensor.office_switch_port_9_link', 'up') }}
