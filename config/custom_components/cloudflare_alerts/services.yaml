# Cloudflare Alert Actions - Delivery status and verified incident closure
# -------------------------------------------------------------------
create_cloudhook:
  name: Create cloud webhook
  description: Return the private Nabu Casa delivery URL. Treat the response as a secret.
get_status:
  name: Get delivery status
  description: Return accepted delivery counts and current incidents without credentials.
resolve:
  name: Resolve verified incident
  description: Clear a bridge-owned alert only after verifying recovery or completing human review.
  fields:
    issue_id:
      name: Issue ID
      required: true
      selector:
        text:
    verification:
      name: Recovery evidence
      required: true
      selector:
        text:
          multiline: true
