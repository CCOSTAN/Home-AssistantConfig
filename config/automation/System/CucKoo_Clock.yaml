# -------------------------------------------------------------------
# Plays the number of cuckoos per hour and 1 on the half hour - Home Assistant automation behavior.
# Related Issue: 2012, 984
#  Defines the Plays the number of cuckoos per hour and 1 on the half hour triggers, conditions, and actions.
# -------------------------------------------------------------------
# Notes: More Info and Video: https://www.vcloudinfo.com/2017/11/building-digital-cuckoo-clock-with-home.html
# Notes: Patriotic/fireworks chimes (July 3-4, Memorial Day, Labor Day) are disabled for noise sensitivity. See issue 984.
# Notes: Holiday lighting mode selects Hanukkah, New Year's, Easter, and Thanksgiving ahead of the monthly packs.
# Notes: Clock WAVs are served from /local/sounds so Chromecast fetches them from Home Assistant.
# Notes: Guest mode keeps scheduled chimes running outside the normal 09:00-22:00 window.
######################################################################
- alias: Cuckoo Clock
  id: 33dcd8e2-e87c-4d18-82bc-c7f9b53a1624
  description: >-
    Chime hourly and half-hourly whenever guest mode is on; otherwise only
    while family is home between 09:00 and 22:00.
  mode: restart
  trigger:
    - platform: time_pattern
      minutes: 0
    - platform: time_pattern
      minutes: 30

  condition:
    - condition: or
      conditions:
        - condition: state
          entity_id: input_boolean.guest_mode
          state: 'on'
        - condition: and
          conditions:
            - condition: time
              after: '09:00:00'
              before: '22:00:00'
            - condition: state
              entity_id: group.family
              state: 'home'

  action:
    - service: script.amp_settings
      data:
        media_player: 'media_player.livingroomcc'
        volume_level: 0.22

    - wait_template: "{{ not is_state('media_player.livingroomCC', 'playing') }}"
      timeout: "00:02:00"
      continue_on_timeout: false

    - service: media_player.play_media
      data:
        entity_id: media_player.livingroomCC
        media_content_id: >-
          {% set chime_time = as_local(trigger.now) if trigger is defined and trigger.now is defined else now() %}
          {% set holiday_packs = {
            'hanukkah': 'hanukkah-clock',
            'new_years_day': 'new-years-clock',
            'easter': 'easter-clock',
            'thanksgiving': 'thanksgiving-clock'
          } %}
          {% set monthly_packs = {10: 'october-clock', 12: 'december-clock'} %}
          {% set folder = holiday_packs.get(states('sensor.holiday_lighting_mode'),
                                             monthly_packs.get(chime_time.month, 'cuckoo-clock')) %}
          {% set hour = '01' if chime_time.minute == 30 else chime_time.strftime('%I') %}
          {% set base = "http://192.168.10.10:8123/local/sounds/" %}
          {{ base ~ folder ~ '/cuckoo-clock-' ~ hour ~ '.wav' }}
        media_content_type: audio/wav
