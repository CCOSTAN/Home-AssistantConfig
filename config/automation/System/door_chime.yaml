# -------------------------------------------------------------------
# Door Chime Automation - Home Assistant automation behavior.
#  Plays local open/close tones in the living room or on the bedroom tablet.
# Notes: door_chime_audio_base_url is the Home Assistant URL reachable by both players.
# -------------------------------------------------------------------
######################################################################
- alias: Door
  mode: queued
  id: ae0fb37b-67cf-48a4-a609-999d44272e90
  trigger:
    - platform: state
      entity_id:
        - group.entry_points

  condition:
    - condition: state
      entity_id: group.family
      state: 'home'

  variables:
    chime_audio_base_url: !secret door_chime_audio_base_url

  action:
    - service: script.amp_settings
      data:
        media_player: 'media_player.livingroomcc'
        volume_level: 0.22

    - wait_template: "{{ not is_state('media_player.livingroomcc', 'playing') }}"
      timeout: '00:01:00'  # Adjust the timeout as needed

    - action: media_player.play_media
      target:
        entity_id: >-
          {{ 'media_player.livingroomcc' if is_state('group.bed', 'off') else 'media_player.bedroom_tablet' }}
      data:
        media_content_id: >-
          {% set tone = 'one-tone' if trigger.to_state.state == 'on' else 'two-tone' %}
          {{ chime_audio_base_url.rstrip('/') }}/local/sounds/{{ tone }}-chime.mp3
        media_content_type: audio/mpeg
