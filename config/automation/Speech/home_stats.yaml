# -------------------------------------------------------------------
# Home Stats Automation - arrival briefing with weather and safety checks
# Related Issue: 364
#  Announces key home status after family returns or on manual trigger.
# -------------------------------------------------------------------
# Notes: Waits for garage doors to close before speaking.
#  Automatic first-household returns include the last trip's recorded doorstep
#  visits. Manual briefings do not repeat it; the next departure resets the count.
######################################################################
- alias: 'Home Stats'
  id: f98e1ef4-051b-4214-908d-d8b35f076a3e

  trigger:
    - platform: state
      entity_id:
        - group.family
      from: 'not_home'
      to: 'home'
      for: '00:03:00'

    - platform: state
      entity_id: input_boolean.home_stats
      to: 'on'
      from: 'off'

  action:

    - wait_template: >-
       {{ is_state('group.garage_doors', 'closed') }}
      timeout: 00:05:30

    - service: script.speech_engine
      data:
        value1: >-
          {% set visits = states('counter.front_door_visits_while_away') | int(0) %}
          {% if trigger is defined and trigger.platform == 'state'
                and trigger.entity_id == 'group.family' and visits > 0 %}
            While everyone was out, {{ visits }} doorstep
            {{ 'visit was' if visits == 1 else 'visits were' }} recorded.
            Review the footage in Clips using the Doorstep visits filter.
            [Report recorded visits, not distinct people or doorbell presses.]
          {% endif %}
        call_inside_weather: 1
        call_garbage_day: 1
        call_outside_weather: 1
        call_garage_check: 1
        call_window_check: 1
