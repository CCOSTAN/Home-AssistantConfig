# -------------------------------------------------------------------
# Garage Garbage Day Reminders - actionable, snoozable garage alerts
# Related Issue: 2022
# Related Issue: 2016
# Video: https://youtu.be/zcCrtwcw-S4
# Blog: https://www.vcloudinfo.com/2026/10/home-assistant-frigate-garbage-bin-reminders.html
#  Notify Carlo and announce at 30s/90s/180s if the garage stays open.
# -------------------------------------------------------------------
# Notes: Carlo's push offers 30-minute and 2-hour snooze actions. The
#  shared timer suppresses new runs, staggered Alexa repeats, and the
#  garbage-day speech macro until the snooze expires.
# Notes: Uses Alexa announce in the garage for local playback and sends
#  one inside reminder via `script.speech_engine` (Chromecasts).
# Notes: Debounced garage door open trigger to avoid restarts if the
#  garage door state flaps (noisy sensors/reflection).
# Notes: A stable garbage_day_reminder tag replaces the previous phone reminder.
# Notes: Use a short phone title and single-line macro text; iOS owns layout.
# Notes: A garage opening also runs the shared briefing when Tesla tires
#  need air, even outside garbage days or during a garbage-only snooze.
#  Tire speech uses the existing 1-day/3-day tire-alert snooze.
# Notes: Local garage classifiers suppress garbage reminders once the
#  required bins are absent. Unknown/obstructed views retain reminders.
# Notes: Bring-in checks start with Monday/Thursday morning garage
#  openings, continuing on following days until the next take-out day.
#  Each bin stops appearing once verified stored. Timing is a household
#  pickup window, not camera confirmation that collection occurred.
######################################################################
- alias: 'Garage Garbage Day Reminders'
  id: 3f97f3be-3d0a-4d2d-9100-5b9c0dbfd5c3
  description: >-
    Remind Carlo to take bins out and bring them back on pickup days, with
    phone actions that silence all bin speech for 30 minutes or 2 hours.
    Stop naming each bin once its required location is verified. Include low Tesla tire
    pressure in the shared briefing and announce tire-only reminders
    on other days when the garage opens.
  mode: restart

  trigger:
    - platform: state
      entity_id: group.garage_doors
      from: 'closed'
      to: 'open'
      for: "00:00:20"
      id: garage_open
    - platform: event
      event_type: mobile_app_notification_action
      event_data:
        action: SNOOZE_GARBAGE_REMINDERS_30M
      id: snooze_30m
    - platform: event
      event_type: mobile_app_notification_action
      event_data:
        action: SNOOZE_GARBAGE_REMINDERS_2H
      id: snooze_2h

  action:
    - choose:
        - conditions:
            - condition: trigger
              id:
                - snooze_30m
                - snooze_2h
          sequence:
            - variables:
                snooze_duration: >-
                  {{ '00:30:00' if trigger.id == 'snooze_30m' else '02:00:00' }}
                snooze_label: >-
                  {{ '30 minutes' if trigger.id == 'snooze_30m' else '2 hours' }}
            - service: timer.start
              target:
                entity_id: timer.garbage_reminder_snooze
              data:
                duration: "{{ snooze_duration }}"
            - service: script.send_to_logbook
              data:
                topic: "GARBAGE"
                message: "Garbage reminders snoozed for {{ snooze_label }} from Carlo's phone."
            - stop: "Garbage reminder snooze saved."

    - condition: trigger
      id: garage_open

    - variables:
        reminder_delays: [30, 60, 90]  # cumulative delays to hit 30s, 90s, 180s
        reminder_message: >-
          {% from 'garbage_bins.jinja' import garbage_reminder %}
          {{ garbage_reminder() }}

    # Garbage-day openings already run speech_engine below, which includes tires.
    # On other openings, speak once only when an unsnoozed tire needs air.
    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {% from 'tesla_tires.jinja' import tire_reminder %}
                {{ tire_reminder() | trim != '' }}
            - condition: template
              value_template: "{{ reminder_message | trim == '' }}"
          sequence:
            - service: script.speech_engine
              data:
                value1: >-
                  {% from 'tesla_tires.jinja' import tire_reminder %}
                  {{ tire_reminder() }}
                call_garbage_day: 1
            - stop: "Shared garage tire reminder announced."

    # The shared macro owns the current take-out/return phase and snooze.
    - condition: template
      value_template: "{{ reminder_message | trim != '' }}"

    # Make the phone actions available immediately while the first speech runs.
    - parallel:
        - service: script.notify_engine_two_button
          data:
            title: "Garage Bins"
            value1: "{{ reminder_message }}"
            who: 'carlo'
            group: 'Garbage_Reminders'
            tag: 'garbage_day_reminder'
            level: 'active'
            title1: "Snooze 30m"
            action1: "SNOOZE_GARBAGE_REMINDERS_30M"
            icon1: "sfsymbols:clock"
            title2: "Snooze 2h"
            action2: "SNOOZE_GARBAGE_REMINDERS_2H"
            icon2: "sfsymbols:clock.badge.checkmark"

        # One inside reminder via Chromecasts (speech_engine targets living room).
        - service: script.speech_engine
          data:
            value1: "{{ reminder_message }}"

    - repeat:
        for_each: "{{ reminder_delays }}"
        sequence:
          - delay:
              seconds: "{{ repeat.item }}"

          # Recheck the current bin locations, reminder phase, and shared snooze.
          - condition: state
            entity_id: group.garage_doors
            state: 'open'

          - variables:
              reminder_message: >-
                {% from 'garbage_bins.jinja' import garbage_reminder %}
                {{ garbage_reminder() }}
          - condition: template
            value_template: "{{ reminder_message | trim != '' }}"

          - service: notify.alexa_media_garage
            data:
              message: "{{ reminder_message }}"
              data:
                type: announce


