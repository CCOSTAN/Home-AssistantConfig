# -------------------------------------------------------------------
# 10 p.m. amp shutdown - Wait for quiet before the nightly checks and power-off.
#  Leave the amp on if either audio source stays busy or stops reporting.
# -------------------------------------------------------------------
######################################################################
- alias: 'Shut down AMP in Living room'
  id: 3b41321c-8242-4cf5-9a93-b2b7aeeb8ea0
  mode: single
  max_exceeded: silent
  trigger:
    - platform: time
      at: '22:00:00'

  action:
    - wait_template: >-
       {{ not is_state('input_boolean.guest_mode', 'on') or is_state('group.bed', 'on') }}
      timeout: "08:00:00"
      continue_on_timeout: false
    - alias: Wait for both audio sources before requesting the briefing
      wait_template: &amp_quiet >-
        {% from 'amp_playback.jinja' import amp_is_quiet %}
        {{ (amp_is_quiet | as_function)() }}
      timeout: "02:00:00"
      continue_on_timeout: false

    - service: script.speech_engine
      data:
        call_no_announcement: 1
        call_garage_check: 1
        call_window_check: 1
        protect_amp_playback: true

    # Give Cast time to report the start of a dispatched announcement.
    - delay: "00:00:05"
    - wait_template: *amp_quiet
      timeout: "00:10:00"
      continue_on_timeout: false
    - condition: template
      value_template: *amp_quiet
    - action: switch.turn_off
      target:
        entity_id: switch.lr_amp
