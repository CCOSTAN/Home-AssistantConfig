# -------------------------------------------------------------------
# Living Room Entry Alert - temporary red lights for open entries
# Related Issue: 1901
#  Manual late-night turns use the separate brightness guard.
# -------------------------------------------------------------------
# Notes: Garage reports must remain open for five seconds; each light's
#  previous state is restored after all entries are secured.
######################################################################

- alias: 'Living Room Red on Entry/Garage Open'
  id: living_room_red_on_entry_open
  mode: single
  max_exceeded: silent
  trigger:
    - platform: state
      entity_id: group.entry_points
      to: 'on'
    - platform: state
      entity_id: group.garage_doors
      from: 'closed'
      to: 'open'
      for: '00:00:05'
  action:
    - service: scene.create
      data:
        scene_id: living_room_before_entry_alert
        snapshot_entities:
          - light.m1_front_left
          - light.m1_front_right
          - light.m1_back_left
          - light.m1_back_right
          - light.tv_stand_light
          - light.tv_light
          - light.couch_1
    - service: scene.turn_on
      target:
        entity_id: scene.red_living_room
    - repeat:
        sequence:
          - wait_template: >-
              {{ is_state('group.entry_points', 'off') and
                 is_state('group.garage_doors', 'closed') }}
          - delay: '00:00:30'
        until:
          - condition: state
            entity_id: group.entry_points
            state: 'off'
          - condition: state
            entity_id: group.garage_doors
            state: 'closed'
    - service: scene.turn_on
      target:
        entity_id: scene.living_room_before_entry_alert
