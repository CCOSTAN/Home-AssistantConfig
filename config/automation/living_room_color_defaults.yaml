# -------------------------------------------------------------------
# Living Room Entry Alert - red while a monitored entry is open
# Related Issue: 1901
#  Manual late-night turns use the separate brightness guard.
# -------------------------------------------------------------------
# Notes: Garage openings qualify after five seconds. On close, restore
#  power and brightness with the TV scene's golden yellow.
######################################################################

- alias: 'Living Room Red on Entry/Garage Open'
  id: living_room_red_on_entry_open
  mode: queued
  triggers:
    - trigger: state
      entity_id: group.entry_points
      to: 'on'
    - trigger: state
      entity_id: group.garage_doors
      to: 'open'
      for: '00:00:05'
  actions:
    # A second opening can queue while the first alert is restoring.
    - condition: or
      conditions:
        - condition: state
          entity_id: group.entry_points
          state: 'on'
        - condition: state
          entity_id: group.garage_doors
          state: 'open'
          for: '00:00:05'
    - variables:
        lamps: &entry_lamps
          - light.m1_front_left
          - light.m1_front_right
          - light.m1_back_left
          - light.m1_back_right
          - light.tv_stand_light
          - light.tv_light
          - light.couch_1
        yellow: &entry_yellow [255, 223, 0]
    - variables:
        return_states: >-
          {% set ns = namespace(items=[]) %}
          {% for lamp in expand(lamps) if lamp.state in ['on', 'off'] %}
            {% set settings = {'state': lamp.state} %}
            {% if lamp.state == 'on' %}
              {% set settings = dict(settings, rgb_color=yellow) %}
              {% if lamp.attributes.get('brightness') is number %}
                {% set settings = dict(settings, brightness=lamp.attributes.brightness) %}
              {% endif %}
            {% endif %}
            {% set ns.items = ns.items + [(lamp.entity_id, settings)] %}
          {% endfor %}
          {{ dict(ns.items) }}
    - action: scene.turn_on
      continue_on_error: true
      target:
        entity_id: scene.red_living_room
    - wait_template: >-
        {{ is_state('group.entry_points', 'off') and
           is_state('group.garage_doors', 'closed') }}
    - condition: template
      value_template: "{{ return_states | count > 0 }}"
    - action: scene.apply
      data:
        entities: "{{ return_states }}"

- alias: Living Room Clear Stale Entry Red
  id: living_room_clear_stale_entry_red
  mode: restart
  triggers:
    - trigger: state
      entity_id: *entry_lamps
      attribute: hs_color
    - trigger: template
      value_template: &secure_and_idle >-
        {{ is_state('group.entry_points', 'off') and
           is_state('group.garage_doors', 'closed') and
           is_state_attr('automation.living_room_red_on_entry_garage_open', 'current', 0) }}
    - trigger: homeassistant
      event: start
    - trigger: event
      event_type: automation_reloaded
  conditions:
    - condition: template
      value_template: *secure_and_idle
  actions:
    # A bulb can report its retained alert color when it comes back online.
    - variables:
        lamps: *entry_lamps
    - variables:
        stale_red: >-
          {% set ns = namespace(lamps=[]) %}
          {% for lamp in expand(lamps) if lamp.state == 'on' %}
            {% set hs = lamp.attributes.get('hs_color') %}
            {# Hue bulbs can report pure red as 10 degrees after gamut conversion. #}
            {% if hs and hs[1] >= 90 and (hs[0] <= 12 or hs[0] >= 350) %}
              {% set ns.lamps = ns.lamps + [lamp.entity_id] %}
            {% endif %}
          {% endfor %}
          {{ ns.lamps }}
    - condition: template
      value_template: "{{ stale_red | count > 0 }}"
    - action: light.turn_on
      target:
        entity_id: "{{ stale_red }}"
      data:
        rgb_color: *entry_yellow
