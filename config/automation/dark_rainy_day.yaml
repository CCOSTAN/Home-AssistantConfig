# -------------------------------------------------------------------
# Dark House Little Extra Light - Daytime rain/lightning lighting helper
# Related Issue: 2016
#  Turns on living-room lights and announces weather-related reasons.
# -------------------------------------------------------------------
# Notes:
#  Avoid trigger entity string-splitting; map trigger IDs safely.
#  Lightning may turn on the lights here, but its safety speech is owned by
#  the Lightning Notification automation to prevent back-to-back briefings.
#  Kitchen Show illuminance confirms the occupied first floor is actually dim;
#  the illuminance gate keeps its weather fallback if the sensor is unavailable.
#  Uses the canonical native ESPHome ambient-light entity without a numeric suffix.
#  Rain lighting requires fresh visual corroboration; dry, uncertain, or
#  failed checks skip lights and speech. Lightning bypasses the rain check.
######################################################################

- alias: 'Dark House Little extra light'
  id: cb94a5bb-7cb3-4e0d-a753-ace01af0bae4
  mode: single

  trigger:
    - platform: state
      entity_id: sensor.pirateweather_precip
      to: 'rain'
    - platform: numeric_state
      entity_id: sensor.pirateweather_precip_intensity
      above: 0.5
    - platform: numeric_state
      entity_id: sensor.blitzortung_lightning_counter
      above: 1
    - platform: numeric_state
      entity_id: sensor.kitchen_show_ambient_light
      below: 30
      for: "00:05:00"
    - platform: state
      entity_id: group.family
      to: 'home'
      from: 'not_home'
    - platform: state
      entity_id: binary_sensor.sleepnumber_carlo_carlo_is_in_bed
      to: 'off'
      for: "00:10:00"

  condition:
    condition: and
    conditions:
      - condition: or
        conditions:
          - condition: numeric_state
            entity_id: sensor.pirateweather_precip_intensity
            above: 0.2
          - condition: numeric_state
            entity_id: sensor.blitzortung_lightning_counter
            above: 1
      - condition: template
        value_template: >-
          {% set lux = states('sensor.kitchen_show_ambient_light') %}
          {{ lux in ['unknown', 'unavailable', 'none', '']
             or lux | float(0) < 35 }}
      - condition: state
        entity_id: binary_sensor.sleepnumber_carlo_carlo_is_in_bed
        state: 'off'
      - condition: state
        entity_id: binary_sensor.sleepnumber_carlo_stacey_is_in_bed
        state: 'off'
      - condition: state
        entity_id: sun.sun
        state: 'above_horizon'
      - condition: state
        entity_id: group.family
        state: 'home'

  action:
    - variables:
        rain_verification: {}

    - if:
        - condition: template
          value_template: "{{ states('sensor.blitzortung_lightning_counter') | int(0) <= 1 }}"
      then:
        - action: script.verify_rain_at_house
          continue_on_error: true
          response_variable: rain_verification

    - condition: template
      value_template: >-
        {{ states('sensor.blitzortung_lightning_counter') | int(0) > 1
           or (rain_verification is mapping
               and rain_verification.get('verified') is sameas true) }}

    - alias: Recheck lighting eligibility after camera analysis
      condition: template
      value_template: >-
        {% set lux = states('sensor.kitchen_show_ambient_light') %}
        {{ is_state('group.family', 'home')
           and is_state('sun.sun', 'above_horizon')
           and is_state('binary_sensor.sleepnumber_carlo_carlo_is_in_bed', 'off')
           and is_state('binary_sensor.sleepnumber_carlo_stacey_is_in_bed', 'off')
           and (lux in ['unknown', 'unavailable', 'none', ''] or lux | float(0) < 35)
           and (states('sensor.pirateweather_precip_intensity') | float(0) > 0.2
                or states('sensor.blitzortung_lightning_counter') | int(0) > 1) }}

    - service: light.turn_on
      data:
        entity_id:
          - light.living_room_lights
          - light.living_room_accents
        brightness: 255
        color_temp_kelvin: 5500

    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {{ states('sensor.blitzortung_lightning_counter') | int(0) <= 1
                   and rain_verification is mapping
                   and rain_verification.get('verified') is sameas true }}
          sequence:
            - service: script.speech_engine
              data:
                value1: >-
                  It's raining at the house, so I've turned on the extra lighting in the living room.
                call_outside_weather: 1
                call_window_check: 1
                call_garage_check: 1

    - delay:
        hours: 3
######################################################################
