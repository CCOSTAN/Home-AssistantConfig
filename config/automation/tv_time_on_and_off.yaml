# -------------------------------------------------------------------
# TV Time and Samsung Power - Living room media scenes and explicit TV wake.
#  Softens house lights for TV time and wakes the Samsung Q70 via WOL.
# -------------------------------------------------------------------
# Notes: Explicit WOL replaces Samsung's deprecated implicit wake behavior.
######################################################################
- alias: TV Time
  id: 6e59d312-661f-40da-bb08-416f2e86b566
  trigger:
    - platform: state
      entity_id: media_player.living_room_ultra
      to: 'playing'
  condition:
    condition: and
    conditions:
      - condition: state
        entity_id: group.family
        state: home
      - condition: state
        entity_id: sun.sun
        state: 'below_horizon'
      - condition: state
        entity_id: input_boolean.guest_mode
        state: 'off'
      - condition: time
        after: '20:00:00'
      - condition: state
        entity_id: media_player.living_room_ultra
        state: 'playing'

  action:

    - service: light.turn_off
      entity_id:
        - light.dinette_lights
        - light.kitchen_lights

    - service: switch.turn_on
      entity_id: group.kitchen_Accents

    - service: scene.turn_on
      entity_id: scene.tv_time


- alias: "Samsung Q70 - Explicit Wake-on-LAN"
  id: 08c48f69-bb66-4d65-bba8-d21c4343ad47
  mode: single
  trigger:
    - platform: samsungtv.turn_on
      entity_id: media_player.samsung_q70_series_65
  action:
    - service: wake_on_lan.send_magic_packet
      data:
        mac: "bc:7e:8b:1e:8a:d8"
