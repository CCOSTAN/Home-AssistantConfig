######################################################################
# @CCOSTAN - Follow Me on X
# For more info visit https://www.vcloudinfo.com/click-here
# Original Repo : https://github.com/CCOSTAN/Home-AssistantConfig
# -------------------------------------------------------------------
# Logbook Configuration - Activity/Logbook display controls
#  Defines what is hidden from the Activity/logbook view to keep noise down.
# Video: https://youtu.be/aceV7ObKJVA
# Blog: https://www.vcloudinfo.com/2026/07/using-codex-clean-up-home-assistant-entities.html
# -------------------------------------------------------------------
# Notes: Filters vcloudinfo availability chatter plus location/weather noise and raw Glances host telemetry.
# Notes: L10s status/room telemetry is hidden; curated VACUUM logbook entries remain visible.
# Notes: Tesla Fleet Spaceship telemetry is hidden; TeslaMate keeps the historical car record.
# Notes: Person/location changes and Life360 online status stay out of Activity; recorder keeps location history.
# Notes: Raw Portainer container/stack status telemetry is hidden; Docker aggregate outage sensors and curated DOCKER events remain.
# Notes: Mobile app phone telemetry stays out of Activity; phone notify services are unaffected.
# Notes: Water-softener salt helpers stay in recorder for restore/math; curated MAINTENANCE events and trend sensors are the visible signal.
# Notes: Rolling maintenance days-since sensors are live-only display helpers.
# Notes: TP-Link lamp voltage diagnostics stay out of Activity; recorder.yaml keeps them live-only.
# Notes: WHOIS days-until-expiration countdowns stay out of Activity; actionable domain alert changes remain visible.
# Notes: Dashboard aggregate issue counts stay out of Activity; underlying degraded-state changes remain visible.
# Notes: The SQL-backed sleep-score average stays out of Activity; source scores remain available in Health.
# Notes: Duplicati result helpers stay out of Activity; curated BACKUP entries carry verification outcomes.
######################################################################

