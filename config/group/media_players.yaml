# -------------------------------------------------------------------
# Media Players Group - Multi-room media control
#  Keep entries aligned with active media_player IDs.
# -------------------------------------------------------------------
# Notes: Removed stale media_player.* refs that triggered Spook warnings.
# Notes: Samsung Q70 power control uses the native samsungtv entity, not
#        unavailable Alexa or DLNA aliases.
######################################################################

media_players:
  entities:
    - media_player.livingroomcc
    - media_player.living_room_ultra
    - media_player.bedroom_tablet
    - media_player.living_room
    - media_player.front_room_flex
    - media_player.garage
    - media_player.office
    - media_player.kitchen
    - media_player.upstairs
    - media_player.stacey_bedroom
    - media_player.carlo_bedroom
    - media_player.master_bathroom
tvs:
  entities:
    - media_player.fireplaceroku
    - media_player.living_room_ultra
    - media_player.roku_3810x_923c
    - media_player.roku_living_room
    - media_player.samsung_q70_series_65
    
